<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="니케 소장품 레벨업에 필요한 키트 사용 순서와 SR 15 도달 확률을 계산합니다."
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      as="style"
      rel="preload"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      />
    </noscript>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <title>소장품 레벨업 계산기</title>
  </head>
  <body>
    <script>
      (() => {
        const storageKey = "collectionThemeMode";
        let theme = "light";
        try {
          const saved = window.localStorage.getItem(storageKey);
          if (saved === "dark" || saved === "light") {
            theme = saved;
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            theme = "dark";
          }
        } catch {
          theme = "light";
        }
        document.body.classList.add(theme === "dark" ? "theme-dark" : "theme-light", "grade-r");
      })();
    </script>
    <div id="app"></div>

    <script>
      window.COLLECTION_STATS_CONFIG = {
        endpoint: "https://collection-kit-stats.tbvj159.workers.dev",
        turnstileSiteKey: "0x4AAAAAADJiF42vmIlh7EOp",
        staging: {
          endpoint: "https://collection-kit-stats-staging.tbvj159.workers.dev",
          turnstileSiteKey: "0x4AAAAAADW5XM4osvVaOofe",
        },
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

  <body>
    <script>
      (() => {
        const storageKey = "collectionThemeMode";
        let theme = "light";
        try {
          const saved = window.localStorage.getItem(storageKey);
          if (saved === "dark" || saved === "light") {
            theme = saved;
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            theme = "dark";
          }
        } catch {
          theme = "light";
        }
        document.body.classList.add(theme === "dark" ? "theme-dark" : "theme-light", "grade-r");
      })();
    </script>
    <div id="app"></div>

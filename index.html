<!doctype html>
<html lang="ko" data-locale="ko" data-site-locale-root>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/" />
<!-- localized-seo:start -->
    <title>NIKKE 소장품 레벨업 계산기</title>
    <meta
      name="description"
      content="니케 소장품 레벨업에 필요한 키트 사용 순서와 SR 15 도달 확률을 계산합니다."
    />
<!-- localized-seo:end -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script>
      (() => {
        const legacyStorageKey = "collection-kit-calculator.language";
        try {
          const savedLocale = window.localStorage.getItem(legacyStorageKey);
          if (window.location.pathname === "/") {
            if (savedLocale === "en" || savedLocale === "ja") {
              window.history.replaceState(
                null,
                "",
                `/${savedLocale}/${window.location.search}${window.location.hash}`,
              );
            }
          }
          window.localStorage.removeItem(legacyStorageKey);
        } catch {
          // Language storage can be unavailable in restricted browser contexts.
        }
        const firstPathSegment = window.location.pathname.split("/").find(Boolean);
        const locale = firstPathSegment === "en" || firstPathSegment === "ja"
          ? firstPathSegment
          : "ko";
        const fontStylesheets = /* localized-font-stylesheets */ {};
        document.documentElement.lang = locale;
        document.documentElement.dataset.locale = locale;
        document.documentElement.dataset.localeFontReady = "false";
        const fontLink = document.createElement("link");
        fontLink.id = "locale-font-stylesheet";
        fontLink.dataset.localeFont = locale;
        fontLink.dataset.loadState = "loading";
        fontLink.rel = "stylesheet";
        fontLink.media = "print";
        fontLink.crossOrigin = "anonymous";
        fontLink.href = fontStylesheets[locale];
        fontLink.addEventListener("load", () => {
          fontLink.media = "all";
          fontLink.dataset.loadState = "loaded";
        });
        fontLink.addEventListener("error", () => {
          fontLink.dataset.loadState = "error";
        });
        document.head.append(fontLink);
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  </head>
  <body>
    <script>
      (() => {
        const storageKey = "collectionThemeMode";
        let theme = "light";
        try {
          const saved = window.localStorage.getItem(storageKey);
          if (saved === "dark" || saved === "light") {
            theme = saved;
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            theme = "dark";
          }
        } catch {
          theme = "light";
        }
        document.body.classList.add(theme === "dark" ? "theme-dark" : "theme-light", "grade-r");
      })();
    </script>
    <div id="app"></div>

    <script>
      window.COLLECTION_STATS_CONFIG = {
        endpoint: "https://collection-kit-stats.tbvj159.workers.dev",
        turnstileSiteKey: "0x4AAAAAADJiF42vmIlh7EOp",
        staging: {
          endpoint: "https://collection-kit-stats-staging.tbvj159.workers.dev",
          turnstileSiteKey: "0x4AAAAAADW5XM4osvVaOofe",
        },
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

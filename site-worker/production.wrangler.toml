name = "collection-kit-site-production"
main = "src/worker.ts"
compatibility_date = "2026-10-13"
workers_dev = false
preview_urls = false
upload_source_maps = false

[vars]
SITE_ENV = "production"
FORECAST_RUNTIME_MODE = "enabled"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api", "/api/*", "/auth", "/auth/*", "/v1", "/v1/*", "/account", "/account/*", "/admin", "/admin/*", "/robots.txt"]

[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[[services]]
binding = "STATS"
service = "collection-kit-stats"

[secrets]
required = ["STATS_HEALTH_PROBE_TOKEN"]

[[d1_databases]]
binding = "FORECAST_DB"
database_name = "collection-kit-forecast-collector"
database_id = "2d58bcc0-a7b5-43f3-8f42-34e1bf1ff853"

[[d1_databases]]
binding = "USAGE_GUARD_DB"
database_name = "collection-kit-usage-guard"
database_id = "49b7f966-f4e8-4c2d-8453-279415737054"

[[ratelimits]]
name = "FORECAST_RATE_LIMITER"
namespace_id = "419201"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "STATS_HEALTH_RATE_LIMITER"
namespace_id = "419105"
simple = { limit = 320, period = 60 }

# Production gateway. DNS and Custom Domains require separate operator approval.
# Intentionally omit route/routes: Wrangler preserves dashboard-managed routes.
name = "collection-kit-site-production"
main = "src/worker.ts"
compatibility_date = "2026-10-13"
workers_dev = false
preview_urls = false
upload_source_maps = false

[vars]
SITE_ENV = "production"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api", "/api/*", "/auth", "/auth/*", "/v1", "/v1/*", "/account", "/account/*", "/admin", "/admin/*", "/robots.txt"]

[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[[services]]
binding = "STATS"
service = "collection-kit-stats"

[secrets]
required = ["STATS_HEALTH_PROBE_TOKEN"]

[[ratelimits]]
name = "STATS_HEALTH_RATE_LIMITER"
# Unused in tracked configs; operator must confirm account-wide availability before publish.
namespace_id = "419105"
simple = { limit = 320, period = 60 }

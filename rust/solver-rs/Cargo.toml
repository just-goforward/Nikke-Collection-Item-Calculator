# Rust port of the AssemblyScript solver kernel (1:1 translation of ../assembly, which is itself a
# faithful, equivalence-verified port of ../../src/solver.ts). Build to wasm32 and verify by pointing
# the existing equivalence harness at the Rust .wasm (see ../README.md "Rust").
#
# BUILT + VERIFIED (2026-06-02, Rust 1.96.0): the full harness passes 13/13, 0 skipped against this
# crate's wasm — equivalence/exact/dist vs the original JS solver, plus a direct Rust<->AS head-to-head
# that is BIT-IDENTICAL on solve/exact/dist (Δ=0) and ~1e-17 on CVaR. Full parity. To reproduce:
#   rustup target add wasm32-unknown-unknown
#   cargo build --release --target wasm32-unknown-unknown
#   # output: target/wasm32-unknown-unknown/release/solver_rs.wasm (~46 KB; same numeric exports as AS)
#   cd .. && WASM_PATH=rust/target/wasm32-unknown-unknown/release/solver_rs.wasm npm test
[package]
name = "solver-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "solver_rs"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

# Rust implementation of the finite-inventory solver kernels used by the browser product and
# research benchmarks. Build to wasm32 and verify against the TypeScript solver parity suite.
#
# BUILT + VERIFIED (2026-07-18, Rust 1.97.1): the full harness passes 13/13, 0 skipped against this
# crate's wasm. Product phase2 behavior remains parity-checked against the TypeScript solver.
# To reproduce:
#   rustup target add wasm32-unknown-unknown
#   cargo build --release --target wasm32-unknown-unknown
#   # output: target/wasm32-unknown-unknown/release/solver_rs.wasm
#   npm run build:solver-wasm && npm test
[package]
name = "solver-rs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/just-goforward/Nikke-Collection-Item-Calculator"

[lib]
crate-type = ["cdylib"]
name = "solver_rs"

[features]
default = []
research-branch-bound = []
research-sparse-pi = []

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

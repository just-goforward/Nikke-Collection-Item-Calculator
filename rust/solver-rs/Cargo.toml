# Rust implementation of the finite-inventory solver kernels used by the browser product and
# research benchmarks. Build to wasm32 and verify against the TypeScript solver parity suite.
#
# TOOLCHAIN: Rust 1.99.1 (root rust-toolchain.toml). Validated against 1.98.1 for min-E[f], phase2,
# dynamic-gain ABI, cache lifecycle, WASM page growth, and existing product parity tests.
# To reproduce:
#   rustup target add wasm32-unknown-unknown
#   cargo build --release --target wasm32-unknown-unknown
#   # output: target/wasm32-unknown-unknown/release/solver_rs.wasm
#   npm run build:solver-wasm && npm test
[package]
name = "solver-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/just-goforward/Nikke-Collection-Item-Calculator"

[lib]
crate-type = ["cdylib"]
name = "solver_rs"

[features]
default = []
research-branch-bound = []
research-sparse-pi = []

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

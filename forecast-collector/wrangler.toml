name = "collection-kit-forecast-collector"
main = "src/worker.ts"
compatibility_date = "2026-08-14"
upload_source_maps = false
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[limits]
# Owner decision 2026-10-20: 300 ms runaway guard per invocation (observed legitimate
# first-build peak: 114 ms on staging). The canary checks a separate 100 ms
# performance target, not the cap. Scheduled worst case per deployment: */3 Cron =
# 14,400 runs/month x 300 ms = 4.32M CPU-ms (<15% of the Paid plan's 30M included);
# Production + staging worst case: 8.64M CPU-ms (~29% of 30M included), above the
# 25% canary quota threshold; the canary quota check measures actual usage.
# Staging is a second deployment. This is not an aggregate spending bound: HTTP
# request count is caller-driven, so public /health and /discord/interactions are
# rate-limited per address (location-local) before any D1 read, and Usage Guard stops
# automation near the account CPU/request/D1 quotas.
cpu_ms = 300

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 0.25

[triggers]
crons = ["*/3 * * * *"]

[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "419001"

  [ratelimits.simple]
  limit = 60
  period = 60

[[d1_databases]]
binding = "FORECAST_DB"
database_name = "collection-kit-forecast-collector"
database_id = "2d58bcc0-a7b5-43f3-8f42-34e1bf1ff853"

[[d1_databases]]
binding = "USAGE_GUARD_DB"
database_name = "collection-kit-usage-guard"
database_id = "49b7f966-f4e8-4c2d-8453-279415737054"

[vars]
FORECAST_V2_MODE = "off"
FORECAST_V2_BOOTSTRAP_CUTOFF = ""
NAVER_BOARD48_PAGE_SIZE = "10"
ENVIRONMENT = "production"
COLLECTION_SCHEDULE = "combined"
DEPLOY_SHA = "local"
POLL_MODE = "both"
COLLECT_ENABLED = "true"
RUNTIME_INGESTION_ENABLED = "false"
RUNTIME_NOTICE_DAILY_LIMIT = "20"
DISCORD_APPROVAL_MODE = "disabled"
DISCORD_INTERACTION_OWNER = "collector"

[secrets]
required = ["ADMIN_TOKEN"]

[env.staging]
name = "collection-kit-forecast-collector-staging"
workers_dev = true

[env.staging.limits]
# Same 300 ms runaway guard and 100 ms performance target (owner decision 2026-10-20).
cpu_ms = 300

[env.staging.observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1.0

[[env.staging.ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "419002"

  [env.staging.ratelimits.simple]
  limit = 60
  period = 60

[[env.staging.d1_databases]]
binding = "FORECAST_DB"
database_name = "collection-kit-forecast-collector-staging"
database_id = "49b5dc06-37ae-4245-896c-daea98562ed8"

[[env.staging.d1_databases]]
binding = "USAGE_GUARD_DB"
database_name = "collection-kit-usage-guard"
database_id = "49b7f966-f4e8-4c2d-8453-279415737054"

[env.staging.vars]
FORECAST_V2_MODE = "on"
FORECAST_V2_BOOTSTRAP_CUTOFF = ""
NAVER_BOARD48_PAGE_SIZE = "5"
ENVIRONMENT = "staging"
COLLECTION_SCHEDULE = "rotation"
DEPLOY_SHA = "local"
POLL_MODE = "both"
COLLECT_ENABLED = "true"
RUNTIME_INGESTION_ENABLED = "true"
RUNTIME_NOTICE_DAILY_LIMIT = "2"
DISCORD_APPROVAL_MODE = "disabled"
DISCORD_INTERACTION_OWNER = "collector"

[env.staging.secrets]
required = ["ADMIN_TOKEN"]

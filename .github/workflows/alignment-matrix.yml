name: Cross-platform Text Alignment

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  alignment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.98.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright browsers
        if: runner.os != 'Linux'
        run: npx playwright install chromium firefox webkit

      - name: Run alignment matrix
        run: npm run test:alignment
        env:
          FULL_ALIGNMENT_MATRIX: "1"

      - name: Upload alignment failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: alignment-${{ runner.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

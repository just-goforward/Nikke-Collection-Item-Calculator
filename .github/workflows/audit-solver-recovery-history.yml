name: Audit Solver Recovery History

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Statistics environment to read
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  production-approval:
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: cloudflare-production
    steps:
      - run: echo "Production read-only audit approved."

  audit:
    needs: production-approval
    if: always() && (inputs.environment == 'staging' || needs.production-approval.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Prepare npm 12.2.0 with pinned integrity
        shell: bash
        timeout-minutes: 5
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-bootstrap-cache
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { existsSync, mkdtempSync, writeFileSync, appendFileSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { setTimeout as delay } from 'node:timers/promises';
          const version = '12.2.0';
          const url = 'https://registry.npmjs.org/npm/-/npm-12.2.0.tgz';
          const sri = 'sha512-ZsJjKpTnlmSXOLLXiU1xDCzC4Wlok4IwZmh/aw2KUuXytU7q6qMv/cUT7MoeSf95Slwuw/lRXYefGzGCspHPNQ==';
          if (process.version !== 'v24.21.0') throw new Error('Unexpected Node version');
          if (!process.env.RUNNER_TEMP || !process.env.GITHUB_PATH || !process.env.NPM_CONFIG_CACHE) throw new Error('Missing runner paths');
          const nodeDir = dirname(process.execPath);
          const sourceCli = [join(nodeDir, 'node_modules/npm/bin/npm-cli.js'), resolve(nodeDir, '../lib/node_modules/npm/bin/npm-cli.js')].find(existsSync);
          if (!sourceCli) throw new Error('Bundled npm CLI not found');
          const cleanEnv = Object.fromEntries(['PATH', 'HOME', 'USERPROFILE', 'SYSTEMROOT', 'WINDIR', 'COMSPEC', 'PATHEXT', 'TEMP', 'TMP', 'TMPDIR', 'APPDATA', 'LOCALAPPDATA'].filter(k => process.env[k] !== undefined).map(k => [k, process.env[k]]));
          const root = mkdtempSync(join(process.env.RUNNER_TEMP, 'npm-12.2.0-'));
          const prefix = join(root, 'prefix');
          const userConfig = join(root, 'user.npmrc');
          const globalConfig = join(root, 'global.npmrc');
          writeFileSync(userConfig, '', { flag: 'wx' });
          writeFileSync(globalConfig, '', { flag: 'wx' });
          const cacheKey = `npm-${version}-${process.platform}-${process.arch}-${Buffer.from(sri.slice(7), 'base64').toString('hex')}`;
          const cache = join(process.env.NPM_CONFIG_CACHE, cacheKey);
          let bytes;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(30000) });
              if (!response.ok) {
                const error = new Error(`npm tarball HTTP ${response.status}`);
                error.terminal = response.status < 500 && response.status !== 408 && response.status !== 429;
                throw error;
              }
              const chunks = []; let size = 0;
              for await (const chunk of response.body) {
                size += chunk.length;
                if (size > 8 * 1024 * 1024) throw Object.assign(new Error('npm tarball size limit exceeded'), { terminal: true });
                chunks.push(chunk);
              }
              bytes = Buffer.concat(chunks); break;
            } catch (error) {
              if (error.terminal || attempt === 2) throw error;
              await delay(1000 * (attempt + 1));
            }
          }
          if ('sha512-' + createHash('sha512').update(bytes).digest('base64') !== sri) throw new Error('npm tarball integrity mismatch');
          const tgz = join(root, 'npm-12.2.0.tgz');
          writeFileSync(tgz, bytes, { flag: 'wx' });
          const options = { cwd: root, env: cleanEnv, timeout: 120000 };
          execFileSync(process.execPath, [sourceCli, 'install', '--global', '--prefix', prefix, tgz, '--offline', '--ignore-scripts', '--no-audit', '--no-fund', '--no-update-notifier', '--cache', cache, '--userconfig', userConfig, '--globalconfig', globalConfig], { ...options, stdio: 'inherit' });
          const windows = process.platform === 'win32';
          const targetCli = join(prefix, windows ? 'node_modules' : 'lib/node_modules', 'npm/bin/npm-cli.js');
          if (execFileSync(process.execPath, [targetCli, '--version', '--no-update-notifier', '--userconfig', userConfig, '--globalconfig', globalConfig], options).toString().trim() !== version) throw new Error('Installed npm version mismatch');
          appendFileSync(process.env.GITHUB_PATH, (windows ? prefix : join(prefix, 'bin')) + '\n');
          console.log(`Prepared npm ${version}; platform=${process.platform}; integrity verified`);
          NODE

      - run: npm ci

      - name: Export bucketed recovery evidence
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/solver-recovery-audit"
          if [[ "$TARGET_ENVIRONMENT" == "staging" ]]; then
            env_args=(--env staging)
          else
            env_args=(--env=)
          fi
          npx wrangler d1 execute DB --remote "${env_args[@]}" --config cloudflare/wrangler.toml --json \
            --command "SELECT 'legacy_calendar' AS date_basis,* FROM solver_recovery_terminal_aggregates WHERE terminal_outcome='failure' UNION ALL SELECT 'game_day_0500' AS date_basis,* FROM solver_recovery_terminal_aggregates_game_day WHERE terminal_outcome='failure' ORDER BY last_seen DESC LIMIT 5000;" \
            > "$RUNNER_TEMP/solver-recovery-audit/terminal-failures.json"
          npx wrangler d1 execute DB --remote "${env_args[@]}" --config cloudflare/wrangler.toml --json \
            --command "SELECT 'legacy_calendar' AS date_basis,* FROM solver_recovery_terminal_aggregates WHERE terminal_outcome='failure' AND grade='R' AND level=0 AND stock_bucket_blue='500_plus' AND stock_bucket_purple='300_349' AND stock_bucket_yellow='150_199' UNION ALL SELECT 'game_day_0500' AS date_basis,* FROM solver_recovery_terminal_aggregates_game_day WHERE terminal_outcome='failure' AND grade='R' AND level=0 AND stock_bucket_blue='500_plus' AND stock_bucket_purple='300_349' AND stock_bucket_yellow='150_199' ORDER BY last_seen DESC LIMIT 1000;" \
            > "$RUNNER_TEMP/solver-recovery-audit/r0-target-buckets.json"
          npx wrangler d1 execute DB --remote "${env_args[@]}" --config cloudflare/wrangler.toml --json \
            --command "SELECT * FROM solver_failure_aggregates_game_day ORDER BY last_seen DESC LIMIT 5000; SELECT * FROM stats_submission_rejection_aggregates_game_day ORDER BY last_seen DESC LIMIT 1000; SELECT * FROM stats_delivery_health_aggregates_game_day ORDER BY last_seen DESC LIMIT 1000;" \
            > "$RUNNER_TEMP/solver-recovery-audit/operational-indexes.json"
          npx wrangler d1 execute OBSERVER_DB --remote "${env_args[@]}" --config stats-observer/wrangler.toml --json \
            --command "SELECT baseline_initialized,baseline_at,last_poll_at,updated_at FROM observer_state WHERE singleton_id=1; SELECT scheduled_at,finished_at,status,error_code,deployment_sha FROM observer_runs ORDER BY scheduled_at DESC LIMIT 100; SELECT severity,error_code,first_seen,last_seen,total_count,send_status,last_send_error FROM observer_alerts ORDER BY last_seen DESC LIMIT 100; SELECT canary_id,deployment_sha,started_at,ends_at,status,checked_at FROM observer_canaries ORDER BY started_at DESC LIMIT 20;" \
            > "$RUNNER_TEMP/solver-recovery-audit/observer-coverage.json"

      - name: Write audit summary
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          terminal_rows=$(jq '.[0].results | length' "$RUNNER_TEMP/solver-recovery-audit/terminal-failures.json")
          target_rows=$(jq '.[0].results | length' "$RUNNER_TEMP/solver-recovery-audit/r0-target-buckets.json")
          operational_rows=$(jq '.[0].results | length' "$RUNNER_TEMP/solver-recovery-audit/operational-indexes.json")
          cat > "$RUNNER_TEMP/solver-recovery-audit/README.md" <<EOF
          # Solver recovery history audit

          - Environment: $TARGET_ENVIRONMENT
          - Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Historical terminal failure rows: $terminal_rows
          - R0 / blue 500_plus / purple 300_349 / yellow 150_199 rows: $target_rows
          - Recovery v2 operational rows: $operational_rows

          This artifact contains aggregate buckets only. It cannot prove that a row came from the
          exact inventory 720/330/195, and it contains no exact stock, IP address, user identifier,
          raw User-Agent, error message, or stack trace. The workflow is read-only.
          EOF
          cat "$RUNNER_TEMP/solver-recovery-audit/README.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solver-recovery-history-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ runner.temp }}/solver-recovery-audit
          retention-days: 30

name: Site source verification (no publication)

on:
  push:
    branches:
      - ci/site-source-transition
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: site-source-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DO_NOT_TRACK: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WRANGLER_SEND_METRICS: "false"
  WRANGLER_SEND_ERROR_REPORTS: "false"
  CLOUDFLARE_CF_FETCH_ENABLED: "false"

# Separate approved Site CI boundary, not isolated operational admission.
# CodeQL remains GitHub-managed default setup; this job cannot replace its checks.
jobs:
  site-source-verify:
    name: Site source prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up the pinned Node toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        timeout-minutes: 5
        with:
          node-version-file: .nvmrc

      - name: Check revision and Node identity
        timeout-minutes: 2
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import assert from "node:assert/strict"; assert.equal(process.versions.node,readFileSync(".nvmrc","utf8").trim());'

      - name: Pin pnpm without lifecycle scripts
        timeout-minutes: 5
        run: bash scripts/ci/setup-pnpm.sh

      - name: Cache the pinned pnpm store
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        timeout-minutes: 5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install the committed lock without lifecycle scripts
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check operational source types
        timeout-minutes: 10
        run: pnpm run typecheck:operations

      - name: Run the existing Site operations lane
        timeout-minutes: 10
        run: pnpm run test:operations

      - name: Run online build, artifact and publication guard tests
        timeout-minutes: 10
        run: node --test scripts/build-certified-wasm.test.mjs scripts/build-production-service.test.mjs scripts/site-deployment-artifact.test.mjs scripts/site-release.test.mjs scripts/deploy-rebuild.test.mjs scripts/pnpm-lock.test.mjs scripts/ci/operational-pnpm.test.mjs

      - name: Select the source profile from exact bytes, never a dispatch flag
        id: profile
        env:
          ROOT_PAIR_SOURCE_APPROVAL_SHA256: ${{ vars.ROOT_PAIR_SOURCE_APPROVAL_SHA256 }}
        run: |
          set -euo pipefail
          profile=$(node scripts/ci/root-source-profile.mjs)
          printf 'profile=%s\n' "$profile" >> "$GITHUB_OUTPUT"

      - name: Build production-online with pinned WASM and engine freshness guards
        if: steps.profile.outputs.profile == 'legacy'
        timeout-minutes: 45
        run: pnpm run build:site-production

      - name: Verify the event revision, approved online profile and packaged content
        if: steps.profile.outputs.profile == 'legacy'
        timeout-minutes: 5
        run: |
          node --input-type=module -e 'const {assertProductionSiteCandidateProfile}=await import("./scripts/site-deployment-artifact.mjs"); const {buildSiteProduction}=await import("./scripts/build-site-production.ts"); const contract=await assertProductionSiteCandidateProfile("dist",process.env.GITHUB_SHA); await buildSiteProduction("dist",true,contract);'

      # PR evidence identifies GitHub's tested merge SHA, not a protected-main build.
      # This inventory is not a publication seal and has no publish consumer.
      - name: Package verification-only candidate and hash its bytes
        id: candidate
        if: steps.profile.outputs.profile == 'legacy' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected))
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          root="$(mktemp -d "$RUNNER_TEMP/site-candidate.XXXXXXXX")"
          mkdir "$root/worker"
          node node_modules/wrangler/bin/wrangler.js deploy \
            --config site-worker/production.wrangler.toml --env "" --dry-run \
            --outdir "$RUNNER_TEMP/site-candidate-bundle"
          test -s "$RUNNER_TEMP/site-candidate-bundle/worker.js"
          cp "$RUNNER_TEMP/site-candidate-bundle/worker.js" "$root/worker/"
          cp -R dist "$root/dist"
          cd "$root"
          test -z "$(find dist worker ! -type f ! -type d -print -quit)"
          node --input-type=module -e 'const e=process.env; console.log(JSON.stringify({profile:"production-k1r2-verification-only",publicationApproved:false,event:e.GITHUB_EVENT_NAME,ref:e.GITHUB_REF,sha:e.GITHUB_SHA,runId:e.GITHUB_RUN_ID,runAttempt:e.GITHUB_RUN_ATTEMPT}))' > candidate.json
          find dist worker candidate.json -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum -- > SHA256SUMS
          printf 'directory=%s\n' "$root" >> "$GITHUB_OUTPUT"

      - name: Retain build-only evidence
        if: steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-only-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.candidate.outputs.directory }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  root-source-verify:
    name: Production root source (no publication)
    needs: site-source-verify
    if: needs.site-source-verify.outputs.profile == 'root' || needs.site-source-verify.outputs.profile == 'root-review-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: bash scripts/ci/setup-pnpm.sh
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify formal source bindings and the two-direction preparation contract
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module -e 'import {loadApproval} from "./e2e/operational-report.mjs"; for (const s of ["numerical-boundary","production-policy","analytics-policy"]) loadApproval(s);'
          node --test scripts/ci/prepare-root-pair.test.mjs scripts/root-release-custody.test.mjs
      - name: Build source-only root with the isolated pin, never the enrolled key
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          cargo +1.99.1 fetch --locked --manifest-path rust/service-h14/Cargo.toml
          mkdir -p .artifacts
          node scripts/build-root-candidate.mjs "$RUNNER_TEMP/root-source"
          node --input-type=module -e 'import assert from "node:assert/strict";import fs from "node:fs";const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/root-source/root-assets.json"));assert.equal(p.status,"ISOLATED_LOCAL_ROOT_CANDIDATE");assert.equal(p.productionDeployable,false);assert.equal(p.conditionalJoint.enrolled,false)'
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { SERVICE_H14_BUILD as built } from './src/serviceH14/generated/build.ts';
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const committed = file => execFileSync('git', ['show', `HEAD:${file}`], { maxBuffer: 16 * 1024 * 1024 });
          const source = 'src/serviceH14/generated/build.ts';
          const text = committed(source).toString('utf8');
          const expected = JSON.parse(text.slice(text.indexOf(' = {') + 3, text.lastIndexOf(' as const;')));
          for (const field of ['codeHash', 'nativeSourceHash', 'exactWasmHash'])
            console.log(field, expected[field], built[field]);
          const actual = new Map(built.sourceManifest.map(row => [row.path, row.sha256]));
          for (const row of expected.sourceManifest) {
            if (actual.get(row.path) !== row.sha256) console.log('changed-input', row.path, row.sha256, actual.get(row.path) ?? 'absent');
            actual.delete(row.path);
          }
          for (const [path, digest] of actual) {
            // A generated Wasm name is public. Do not expose unexpected runner paths.
            console.log('additional-input', /^public\/wasm\/service-fused-h14-[a-f0-9]{64}\.wasm$/.test(path) ? path : hash(path), digest);
          }
          for (const path of ['shared/generated/certifiedEngineBuild.ts', 'src/serviceH14/generated/native.json', source])
            console.log('generated-file', path, hash(committed(path)), hash(readFileSync(path)));
          if (expected.exactWasmHash !== built.exactWasmHash) {
            // Compare section payloads without publishing binary contents or embedded strings.
            const sections = digest => {
              const wasm = readFileSync(`public/wasm/service-fused-h14-${digest}.wasm`);
              const out = [];
              for (let at = 8; at < wasm.length;) {
                const id = wasm[at++];
                let length = 0, shift = 0, byte;
                do { byte = wasm[at++]; length += (byte & 127) * 2 ** shift; shift += 7; } while (byte & 128);
                out.push([id, hash(wasm.subarray(at, at + length))]);
                at += length;
              }
              return out;
            };
            for (const [label, digest] of [['committed', expected.exactWasmHash], ['rebuilt', built.exactWasmHash]])
              console.log('wasm-sections', label, JSON.stringify(sections(digest)));
          }
          JS
          node --input-type=module <<'COMPILER'
          import { readFileSync, readdirSync, mkdtempSync, rmSync, existsSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join, dirname } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const run = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/root-source/root-assets.json`)).run;
          const stage = readdirSync(run).find(p => p.startsWith('native-build.'));
          const cmd = JSON.parse(readFileSync(join(run, stage, 'command.json')));
          const {executable: cargo, env, cwd, args} = cmd, rustc = env.RUSTC;
          const invoke = (exe, argv) => execFileSync(exe, argv, {env, cwd, encoding:'utf8'});
          const version = invoke(rustc, ['-vV']);
          const host = /^host: ([\w-]+)$/m.exec(version)[1];
          const sysroot = invoke(rustc, ['--print','sysroot']).trim();
          const lld = join(sysroot, 'lib/rustlib', host, 'bin/rust-lld');
          for (const file of [rustc, cargo, lld]) console.log('compiler-file', file.split('/').pop(), hash(readFileSync(file)));
          console.log('compiler-host', host, /^LLVM version: ([\d.]+)$/m.exec(version)[1]);
          const rustlibs = join(sysroot, 'lib/rustlib/wasm32-unknown-unknown/lib');
          console.log('target-sysroot', hash(readdirSync(rustlibs).sort().map(file => hash(readFileSync(join(rustlibs,file)))).join('\n')));
          for (let path=cwd;;path=dirname(path)) {
            for (const name of ['config','config.toml']) if (existsSync(join(path,'.cargo',name)))
              console.log('ancestor-cargo-config',name,hash(readFileSync(join(path,'.cargo',name))));
            if (path===dirname(path)) break;
          }
          for (const name of ['config','config.toml']) if (existsSync(join(env.CARGO_HOME,name)))
            console.log('home-cargo-config',name,hash(readFileSync(join(env.CARGO_HOME,name))));
          console.log('remap-flags', hash(env.CARGO_ENCODED_RUSTFLAGS.replaceAll(cwd,'<checkout>').replaceAll(env.CARGO_HOME,'<cargo>')));
          const features = invoke(cargo,['tree','--offline','--locked','--manifest-path','rust/service-h14/Cargo.toml','--target','wasm32-unknown-unknown','-e','features','--format','{p} {f}']).replaceAll(cwd,'<checkout>');
          console.log('feature-graph',hash(features));
          const temp = mkdtempSync(join(tmpdir(),'root-repro-'));
          try {
            for (const [label,profile] of [['baseline',{}],['single-cgu', {CARGO_PROFILE_RELEASE_CODEGEN_UNITS:'1',CARGO_PROFILE_RELEASE_STRIP:'symbols'}]]) {
              const target = join(temp,label);
              const {spawnSync} = await import('node:child_process');
              const child = spawnSync(cargo,[...args,'-vv'],{env:{...env,...profile,CARGO_TARGET_DIR:target},cwd,encoding:'utf8',maxBuffer:16*1024*1024,timeout:240000});
              if (child.error || child.status !== 0) throw Error('compiler comparison failed: '+label);
              const units=[];
              for (const line of child.stderr.split('\n')) {
                const name = / --crate-name (\w+)/.exec(line)?.[1], metadata = / -C metadata=([0-9a-f]+)/.exec(line)?.[1];
                if (name && metadata) units.push([line.includes(' --target wasm32-unknown-unknown')?'target':'host',name,metadata]);
              }
              console.log('crate-identities',label,JSON.stringify(units.sort()));
              const wasm = readFileSync(join(target,'wasm32-unknown-unknown/release/certified_wasm.wasm'));
              console.log('isolated-wasm',label,hash(wasm));
            }
          } finally { rmSync(temp,{recursive:true,force:true}); }
          COMPILER
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Validate the single public WASM for PR 79 behavioral review
        id: wasm_review
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.number == 79
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, lstatSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { assertServiceH14NativeAbi } from './scripts/service-h14-native-integrity.ts';
          const hash = '7e839b1c2651cf1aeda9afc9af9b8acaffce4928e368185978e34bfa8e3275a5';
          const path = `public/wasm/service-fused-h14-${hash}.wasm`;
          const size = lstatSync(path);
          assert(size.isFile() && size.size > 0 && size.size <= 32 * 1024 * 1024);
          const bytes = readFileSync(path);
          assert.equal(createHash('sha256').update(bytes).digest('hex'), hash);
          await assertServiceH14NativeAbi(bytes);
          console.log('review-wasm', path, bytes.length, hash);
          JS
      - name: Retain only validated review WASM for one day
        if: failure() && steps.wasm_review.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: review-wasm-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/wasm/service-fused-h14-7e839b1c2651cf1aeda9afc9af9b8acaffce4928e368185978e34bfa8e3275a5.wasm
          if-no-files-found: error
          retention-days: 1

  required-source:
    name: Site source verification
    if: always()
    needs: [site-source-verify, root-source-verify]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the complete applicable source lane
        env:
          PREREQUISITES: ${{ needs.site-source-verify.result }}
          PROFILE: ${{ needs.site-source-verify.outputs.profile }}
          ROOT: ${{ needs.root-source-verify.result }}
        run: |
          case "$PREREQUISITES:$PROFILE:$ROOT" in
            success:legacy:skipped|success:root:success|success:root-review-only:success) exit 0 ;;
            *) echo 'Applicable Site source verification did not complete.' >&2; exit 1 ;;
          esac

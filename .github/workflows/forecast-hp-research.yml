name: Start Dynamic Forecast H-p Research

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Trusted forecast PR to evaluate without merging
        required: false
        default: ""
      records_per_profile:
        description: Maximum new root or exact records per profile
        required: false
        default: "64"
      slices_per_run:
        description: Maximum bounded research slices per profile job
        required: false
        default: "8"
      continuation_generation:
        description: Internal bounded continuation counter
        required: false
        default: "0"
      max_continuation_generation:
        description: Inclusive fail-closed continuation limit
        required: false
        default: "23"
      profile_deduplication:
        description: Gain-vector profile deduplication mode; auto preserves legacy continuations
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - gain-vector-v1
          - "off"

permissions:
  actions: write
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: dynamic-forecast-hp-research
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '' && vars.FORECAST_COLLECTOR_STAGING_URL != '') ||
      (github.event_name == 'workflow_dispatch' && inputs.pull_request_number == '' && vars.FORECAST_COLLECTOR_URL != '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORECAST_RESEARCH_COLLECTOR_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '' && vars.FORECAST_COLLECTOR_STAGING_URL || vars.FORECAST_COLLECTOR_URL }}
    outputs:
      enabled: ${{ steps.contract.outputs.enabled }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      profile-count: ${{ steps.matrix.outputs.profile_count }}
      wasm-key: ${{ steps.wasm.outputs.key }}
      profile-deduplication: ${{ steps.matrix.outputs.deduplication }}
      rules-version: ${{ steps.contract.outputs.rules_version }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load candidate registry without executing pull request code
        if: github.event_name == 'workflow_dispatch' && inputs.pull_request_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid pull request number." >&2; exit 1; }
          metadata="$RUNNER_TEMP/forecast-pr.json"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json author,baseRefName,headRefName,headRefOid,isDraft,mergeable,files,url > "$metadata"
          node --input-type=module - "$metadata" <<'NODE'
          import { readFileSync } from "node:fs";
          const pr = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const allowed = new Set(["shared/supplyForecasts.json", "shared/generated/supplyForecast.ts"]);
          if (pr.author?.login !== "app/github-actions" || pr.author?.is_bot !== true) throw new Error("Forecast PR author is not GitHub Actions.");
          if (pr.baseRefName !== "main" || !/^automation\/supply-forecast\/forecast-[a-z0-9-]+$/.test(pr.headRefName)) throw new Error("Forecast PR branch contract is invalid.");
          if (pr.isDraft || pr.mergeable !== "MERGEABLE") throw new Error("A draft or conflicting forecast PR cannot enter H/p research.");
          if (!/^[0-9a-f]{40}$/.test(pr.headRefOid)) throw new Error("Forecast PR head SHA is invalid.");
          const files = pr.files.map((entry) => entry.path);
          if (files.length !== allowed.size || files.some((file) => !allowed.has(file))) throw new Error("Forecast PR changes files outside the registry contract.");
          NODE
          head_sha=$(jq -r .headRefOid "$metadata")
          git fetch --no-tags origin "$head_sha"
          git show "$head_sha:shared/supplyForecasts.json" > "$RUNNER_TEMP/candidate-supplyForecasts.json"
          node --input-type=module - "$RUNNER_TEMP/candidate-supplyForecasts.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const registry = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (registry.version !== 3 || registry.approvedForecastId === registry.activeForecastId) throw new Error("Forecast PR does not contain an inactive approved forecast.");
          const approved = registry.forecasts?.find((entry) => entry.id === registry.approvedForecastId);
          if (!approved || approved.kind !== "schedule" || approved.rulesVersion !== "schedule-kit-v2" || !Array.isArray(approved.profiles) || approved.profiles.length === 0) throw new Error("Forecast PR approved entry is invalid.");
          for (const profile of approved.profiles) {
            for (const value of Object.values(profile.expectedGain ?? {})) if (!Number.isFinite(value) || value < 0) throw new Error("Forecast PR contains an invalid gain vector.");
          }
          NODE
          cp "$RUNNER_TEMP/candidate-supplyForecasts.json" shared/supplyForecasts.json
          npm run generate:supply-forecast

      - name: Verify collector and inactive approved forecast
        id: contract
        env:
          FORECAST_COLLECTOR_URL: ${{ env.FORECAST_RESEARCH_COLLECTOR_URL }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 10 \
            "$FORECAST_COLLECTOR_URL/health" > "$RUNNER_TEMP/forecast-health.json"
          node -e 'const x=require(process.argv[1]);if(x.status!=="ok")process.exit(1)' \
            "$RUNNER_TEMP/forecast-health.json"
          node --input-type=module - <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const registry = JSON.parse(readFileSync("shared/supplyForecasts.json", "utf8"));
          const enabled = registry.version === 2 &&
            registry.approvedForecastId !== registry.activeForecastId;
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
          const approved = registry.forecasts.find((entry) => entry.id === registry.approvedForecastId);
          if (enabled && approved?.rulesVersion !== "schedule-kit-v2") throw new Error("Unsupported forecast rules version.");
          appendFileSync(process.env.GITHUB_OUTPUT, `rules_version=${approved?.rulesVersion ?? "none"}\n`);
          NODE

      - name: Build and verify research WASM
        if: steps.contract.outputs.enabled == 'true'
        run: |
          npm run build:solver-wasm
          npx vitest run benchmarks/dynamic-hp-profile-matrix.spec.ts benchmarks/min-ef-hp-report.spec.ts \
            --config vitest.benchmark.config.ts --configLoader runner

      - name: Generate profile matrix
        if: steps.contract.outputs.enabled == 'true'
        id: matrix
        env:
          REQUESTED_DEDUPLICATION: ${{ inputs.profile_deduplication || 'auto' }}
          CONTINUATION_GENERATION: ${{ inputs.continuation_generation || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          mode="$REQUESTED_DEDUPLICATION"
          if [[ "$mode" == "auto" ]]; then
            if [[ "$CONTINUATION_GENERATION" == "0" ]]; then
              mode="gain-vector-v1"
            else
              # Continuations created by the pre-certificate workflow omitted this input.
              mode="off"
            fi
          fi
          [[ "$mode" == "off" || "$mode" == "gain-vector-v1" ]] || {
            echo "Invalid profile deduplication mode: $mode" >&2
            exit 1
          }
          HP_PROFILE_DEDUPLICATION="$mode" npm run bench:min-ef-hp:matrix
          node --input-type=module - <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const rows = JSON.parse(readFileSync("benchmarks/results/dynamic-hp-profile-matrix.json", "utf8"));
          if (rows.length === 0) throw new Error("Dynamic H/p profile matrix is empty.");
          const evidence = new Set(rows.flatMap((row) => row.evidenceProfiles.map((entry) => entry.id)));
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({profile: rows})}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `profile_count=${rows.length}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `evidence_profile_count=${evidence.size}\n`);
          NODE
          echo "deduplication=$mode" >> "$GITHUB_OUTPUT"
          echo "profile_deduplication=$mode" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload profile evidence matrix
        if: steps.contract.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hp-profile-matrix-${{ github.run_id }}
          path: benchmarks/results/dynamic-hp-profile-matrix.json
          if-no-files-found: error
          retention-days: 90

      - name: Identify WASM contract
        if: steps.contract.outputs.enabled == 'true'
        id: wasm
        shell: bash
        run: echo "key=$(sha256sum public/solver_rs.wasm | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload verified WASM
        if: steps.contract.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dynamic-hp-wasm-${{ github.run_id }}
          path: public/solver_rs.wasm
          if-no-files-found: error
          retention-days: 7

  advance:
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # GitHub Free permits 20 concurrent standard hosted-runner jobs. Other workflows queue while
      # this bounded research matrix occupies the account-wide allowance.
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      HP_STUDY_REPORT_FILE: dynamic/${{ matrix.profile.id }}.json
      HP_STUDY_SUPPLY_CONTEXT: ${{ toJSON(matrix.profile.context) }}
      HP_STUDY_MAX_NEW_RECORDS: ${{ inputs.records_per_profile || '64' }}
      HP_STUDY_SLICES_PER_RUN: ${{ inputs.slices_per_run || '8' }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified WASM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dynamic-hp-wasm-${{ github.run_id }}
          path: public

      - name: Restore resumable profile state
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            benchmarks/results/dynamic/${{ matrix.profile.id }}.json
            benchmarks/results/min-ef-hp-checkpoints/${{ matrix.profile.context.forecastProfileId }}
          key: dynamic-hp-${{ needs.prepare.outputs.wasm-key }}-${{ matrix.profile.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dynamic-hp-${{ needs.prepare.outputs.wasm-key }}-${{ matrix.profile.id }}-

      - name: Initialize one record when needed
        shell: bash
        run: |
          if [[ ! -f "benchmarks/results/$HP_STUDY_REPORT_FILE" ]]; then
            HP_STUDY_STAGE=screen HP_STUDY_MAX_NEW_RECORDS=1 npm run bench:min-ef-hp
          fi

      - name: Verify baseline under this gain profile
        run: npm run bench:min-ef-hp:verify-baseline

      - name: Advance bounded research slice
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HP_STUDY_SLICES_PER_RUN" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid slices_per_run." >&2; exit 1; }
          for ((slice=1; slice<=HP_STUDY_SLICES_PER_RUN; slice+=1)); do
            stage=$(node -e 'const r=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(r.screening.complete?"exact":"screen")' \
              "benchmarks/results/$HP_STUDY_REPORT_FILE")
            if [[ "$stage" == "exact" ]]; then
              complete=$(node -e 'const r=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String(r.exact.complete))' \
                "benchmarks/results/$HP_STUDY_REPORT_FILE")
              if [[ "$complete" == "true" ]]; then
                echo "Exact gate is complete for this profile."
                break
              fi
            fi
            echo "Advancing $stage slice $slice/$HP_STUDY_SLICES_PER_RUN"
            if [[ "$stage" == "exact" ]]; then
              HP_STUDY_STAGE="$stage" HP_STUDY_MAX_NEW_RECORDS=8 npm run bench:min-ef-hp
            else
              HP_STUDY_STAGE="$stage" npm run bench:min-ef-hp
            fi
          done

      - name: Validate report contract
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(`benchmarks/results/${process.env.HP_STUDY_REPORT_FILE}`, "utf8"));
          const expected = JSON.parse(process.env.HP_STUDY_SUPPLY_CONTEXT);
          if (report.kind !== "min-ef-hp-study" || report.version !== 2) throw new Error("Invalid report contract");
          if (JSON.stringify(report.options.supplyForecast) !== JSON.stringify(expected)) throw new Error("Forecast context drift");
          if (report.decisionScope.productAdoptionAuthorized !== false) throw new Error("Research report authorized product adoption");
          console.log(JSON.stringify({
            profile: expected.forecastProfileId,
            screening: report.screening.records.length,
            screeningComplete: report.screening.complete,
            exact: report.exact.records.length,
            exactComplete: report.exact.complete,
          }));
          NODE

      - name: Save resumable profile state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            benchmarks/results/dynamic/${{ matrix.profile.id }}.json
            benchmarks/results/min-ef-hp-checkpoints/${{ matrix.profile.context.forecastProfileId }}
          key: dynamic-hp-${{ needs.prepare.outputs.wasm-key }}-${{ matrix.profile.id }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload profile report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dynamic-hp-${{ matrix.profile.id }}-${{ github.run_id }}
          path: benchmarks/results/dynamic/${{ matrix.profile.id }}.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: [prepare, advance]
    if: >-
      always() && needs.prepare.outputs.enabled == 'true' &&
      needs.advance.result != 'failure' && needs.advance.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      complete: ${{ steps.contract.outputs.complete }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download this run's profile reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dynamic-hp-*-${{ github.run_id }}
          path: collected
          merge-multiple: true

      - name: Download profile evidence matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hp-profile-matrix-${{ github.run_id }}
          path: profile-matrix

      - name: Check aggregate exact-gate completion
        id: contract
        env:
          EXPECTED_PROFILE_COUNT: ${{ needs.prepare.outputs.profile-count }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PROFILE_COUNT" =~ ^[1-9][0-9]*$ ]] || { echo "Expected profile count is invalid." >&2; exit 1; }
          report_dir="$RUNNER_TEMP/dynamic-hp-reports"
          mkdir -p "$report_dir"
          while IFS= read -r -d '' source; do
            target="$report_dir/$(basename "$source")"
            [[ ! -e "$target" ]] || { echo "Duplicate H/p report name: $(basename "$source")" >&2; exit 1; }
            cp "$source" "$target"
          done < <(find collected -type f -name '*.json' -print0)
          actual=$(find "$report_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          complete=$(node --input-type=module - "$report_dir" "$EXPECTED_PROFILE_COUNT" <<'NODE'
          import { readdirSync, readFileSync } from "node:fs";
          const directory = process.argv[2];
          const expected = Number(process.argv[3]);
          const reports = readdirSync(directory).filter((name) => name.endsWith(".json")).map((name) => JSON.parse(readFileSync(`${directory}/${name}`, "utf8")));
          process.stdout.write(String(reports.length === expected && reports.every((report) => report.kind === "min-ef-hp-study" && report.version === 2 && report.exact.complete === true)));
          NODE
          )
          echo "expected_reports=$EXPECTED_PROFILE_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "reports=$actual" >> "$GITHUB_STEP_SUMMARY"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "report_dir=$report_dir" >> "$GITHUB_OUTPUT"

      - name: Build exact-gate summary
        if: steps.contract.outputs.complete == 'true'
        run: >-
          node benchmarks/summarize-dynamic-hp-gates.ts
          "${{ steps.contract.outputs.report_dir }}"
          benchmarks/results/dynamic-hp-exact-gate-summary.json
          profile-matrix/dynamic-hp-profile-matrix.json
          "${{ needs.prepare.outputs.wasm-key }}"
          "${{ needs.prepare.outputs.rules-version }}"
          "$RUNNER_TEMP/dynamic-hp-certificate"

      - name: Upload exact-gate certificate
        if: steps.contract.outputs.complete == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dynamic-hp-exact-gate-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/dynamic-hp-certificate
          if-no-files-found: error
          retention-days: 90

      - name: Dispatch bounded continuation
        id: continuation
        if: steps.contract.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          RECORDS_PER_PROFILE: ${{ inputs.records_per_profile || '64' }}
          SLICES_PER_RUN: ${{ inputs.slices_per_run || '8' }}
          GENERATION: ${{ inputs.continuation_generation || '0' }}
          MAX_GENERATION: ${{ inputs.max_continuation_generation || '23' }}
          PROFILE_DEDUPLICATION: ${{ needs.prepare.outputs.profile-deduplication }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GENERATION" =~ ^[0-9]+$ ]] || { echo "Invalid continuation generation." >&2; exit 1; }
          [[ "$MAX_GENERATION" =~ ^[0-9]+$ ]] || { echo "Invalid maximum continuation generation." >&2; exit 1; }
          (( MAX_GENERATION >= 15 && MAX_GENERATION <= 31 )) || {
            echo "Maximum continuation generation must be between 15 and 31." >&2
            exit 1
          }
          if (( GENERATION >= MAX_GENERATION )); then
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
            echo "Dynamic H/p research remains incomplete at bounded generation $GENERATION/$MAX_GENERATION." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "exhausted=false" >> "$GITHUB_OUTPUT"
          next=$((GENERATION + 1))
          gh workflow run forecast-hp-research.yml --ref main \
            -f pull_request_number="$PR_NUMBER" \
            -f records_per_profile="$RECORDS_PER_PROFILE" \
            -f slices_per_run="$SLICES_PER_RUN" \
            -f continuation_generation="$next" \
            -f max_continuation_generation="$MAX_GENERATION" \
            -f profile_deduplication="$PROFILE_DEDUPLICATION"
          echo "Queued continuation generation $next/$MAX_GENERATION." >> "$GITHUB_STEP_SUMMARY"

      - name: Build bounded-incomplete diagnostic certificate
        if: steps.continuation.outputs.exhausted == 'true'
        run: >-
          node benchmarks/summarize-dynamic-hp-gates.ts
          "${{ steps.contract.outputs.report_dir }}"
          benchmarks/results/dynamic-hp-bounded-incomplete-summary.json
          profile-matrix/dynamic-hp-profile-matrix.json
          "${{ needs.prepare.outputs.wasm-key }}"
          "${{ needs.prepare.outputs.rules-version }}"
          "$RUNNER_TEMP/dynamic-hp-bounded-incomplete-certificate"

      - name: Upload bounded-incomplete diagnostic certificate
        if: steps.continuation.outputs.exhausted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dynamic-hp-bounded-incomplete-${{ github.run_id }}
          path: ${{ runner.temp }}/dynamic-hp-bounded-incomplete-certificate
          if-no-files-found: error
          retention-days: 90

      - name: Fail bounded-incomplete research
        if: steps.continuation.outputs.exhausted == 'true'
        run: |
          echo "Dynamic H/p research exhausted its bounded continuation budget." >&2
          exit 1

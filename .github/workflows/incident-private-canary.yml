name: Authorize exactly one private incident canary
on:
  workflow_dispatch:
    inputs:
      source_sha: {description: Independently reviewed full protected main SHA, required: true, type: string}
      module_sha256: {description: Independent private-canary.js SHA-256 for this expiry, required: true, type: string}
      end_epoch: {description: End of one-hour UTC canary window (epoch seconds), required: true, type: string}
permissions:
  contents: read
concurrency:
  group: cloudflare-site-production
  cancel-in-progress: false
jobs:
  permit:
    name: Approve private incident canary permit (no Cloudflare writes)
    if: github.repository_id == '1229775730' && github.actor_id == '281915448' && github.run_attempt == 1 && github.ref_protected && github.ref == 'refs/heads/main' && github.sha == inputs.source_sha
    environment: incident-private-install
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: bash scripts/ci/setup-pnpm.sh
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify reviewed window and issue restricted permit
        env:
          INCIDENT_CANARY_END: ${{ inputs.end_epoch }}
          EXPECTED_SHA256: ${{ inputs.module_sha256 }}
        run: |
          set -eu -o pipefail
          [[ "$INCIDENT_CANARY_END" =~ ^[1-9][0-9]{9}$ && "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          now=$(date +%s)
          (( INCIDENT_CANARY_END > now+600 && INCIDENT_CANARY_END <= now+3600 ))
          mkdir "$RUNNER_TEMP/private-canary"
          bash scripts/ci/bundle-private-canary.sh "$RUNNER_TEMP/private-canary"
          cd "$RUNNER_TEMP/private-canary"
          printf '%s  private-canary.js\n' "$EXPECTED_SHA256" | sha256sum --check --status
          jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg module "$EXPECTED_SHA256" --argjson end "$INCIDENT_CANARY_END" '{phase:"private-one-dm",sha:$sha,run:$run,attempt:1,module:$module,end:$end}' > permit.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/private-canary/permit.json
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-canary-permit-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/private-canary/permit.json
            ${{ runner.temp }}/private-canary/private-canary.js
          retention-days: 7
          if-no-files-found: error

name: Deploy GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.98.0
          rustup component add rustfmt clippy

      - name: Install dependencies
        run: npm ci

      - name: Build Rust solver WASM
        run: npm run build:solver-wasm

      - name: Rust format and clippy
        run: npm run lint:rust

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Worker D1 integration tests
        run: npm run test:worker

      - name: Build
        run: npx vite build --configLoader native

      - name: Verify current production Worker contract
        if: github.event_name == 'push'
        env:
          PRODUCTION_WORKER_URL: ${{ vars.CLOUDFLARE_PRODUCTION_WORKER_URL }}
          STATS_ALLOWED_ORIGIN: ${{ vars.STATS_ALLOWED_ORIGIN }}
        run: |
          test -n "$PRODUCTION_WORKER_URL" || { echo "Missing CLOUDFLARE_PRODUCTION_WORKER_URL variable." >&2; exit 1; }
          test -n "$STATS_ALLOWED_ORIGIN" || { echo "Missing STATS_ALLOWED_ORIGIN variable." >&2; exit 1; }
          npm run smoke:stats-worker -- "$PRODUCTION_WORKER_URL" "$STATS_ALLOWED_ORIGIN" frontend-contract-only

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: E2E and visual regression tests
        run: npx playwright test

      - name: WebKit language and accessibility compatibility tests
        run: npx playwright test --config playwright.compat.config.ts

      - name: Cross-browser text alignment contracts
        run: npx playwright test --config playwright.alignment.config.ts

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Bundle budget
        run: npm run check:bundle-budget

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  post-deploy-smoke:
    if: github.event_name == 'push'
    needs:
      - verify
      - deploy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Smoke test deployed Pages assets
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run smoke:pages -- "$PAGES_URL" "$EXPECTED_SHA"

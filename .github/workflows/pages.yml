name: Manual isolated operational verification (no publication)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full approved candidate commit (40 hex); must match the dispatched ref
        required: true
        type: string
      approval_url:
        description: Independently reviewed detached manifest at an immutable public raw GitHub URL
        required: true
        type: string
      approval_sha256:
        description: Independently approved raw manifest SHA-256 (not generated by this workflow)
        required: true
        type: string
      approval_bytes:
        description: Exact approved manifest byte length
        required: true
        type: string
      provision_input:
        description: Independently prepared existing read-only payload directory; this job never downloads payloads or images
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: operational-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Admit, provision, isolate, verify and remove the owned namespace
        timeout-minutes: 87
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          R65_EXPECTED_SHA: ${{ inputs.candidate_sha }}
          OPERATIONAL_APPROVAL_URL: ${{ inputs.approval_url }}
          OPERATIONAL_APPROVAL_DIGEST: ${{ inputs.approval_sha256 }}
          OPERATIONAL_APPROVAL_BYTES: ${{ inputs.approval_bytes }}
          OPERATIONAL_PROVISION_DIR: ${{ inputs.provision_input }}
        shell: bash
        run: |
          set +x
          node scripts/ci/operational-launch.mjs >/dev/null 2>&1

      - name: Retain only the bounded opaque result
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operational-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/operational-public/result.json
          if-no-files-found: error
          retention-days: 1


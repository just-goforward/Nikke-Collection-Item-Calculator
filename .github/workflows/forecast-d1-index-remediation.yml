name: Remediate Forecast D1 Indexes

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: forecast-d1-index-remediation
  cancel-in-progress: false

jobs:
  remediate-production-indexes:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify statistics production D1 remains readable
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(npx wrangler d1 execute DB --remote --config cloudflare/wrangler.toml \
            --command "SELECT 1 AS ok;" --json)
          [[ "$(jq -r '.[0].results[0].ok' <<<"$result")" == "1" ]]

      - name: Apply production Forecast prerequisite migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for version in 7 8; do
            migration=$(npx wrangler d1 execute FORECAST_DB --remote --env="" \
              --config forecast-collector/wrangler.toml \
              --command "SELECT COUNT(*) AS count FROM schema_migrations WHERE version = $version;" \
              --json)
            if [[ "$(jq -r '.[0].results[0].count' <<<"$migration")" == "1" ]]; then
              continue
            fi
            file=$(printf "forecast-collector/migrations/%04d_" "$version")
            migration_file=$(compgen -G "${file}*.sql" | head -n 1)
            [[ -n "$migration_file" ]] || {
              echo "Migration file for version $version was not found." >&2
              exit 1
            }
            npx wrangler d1 execute FORECAST_DB --remote --env="" \
              --config forecast-collector/wrangler.toml --file "$migration_file"
          done

      - name: Apply production Forecast covering indexes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          run_sql() {
            local label="$1"
            local sql="$2"
            for attempt in 1 2 3; do
              if npx wrangler d1 execute FORECAST_DB --remote --env="" \
                --config forecast-collector/wrangler.toml --command "$sql"; then
                return 0
              fi
              if [[ "$attempt" == "3" ]]; then
                echo "Failed to apply $label after $attempt attempts." >&2
                return 1
              fi
              sleep $((attempt * 5))
            done
          }
          migration=$(npx wrangler d1 execute FORECAST_DB --remote --env="" \
            --config forecast-collector/wrangler.toml \
            --command "SELECT COUNT(*) AS count FROM schema_migrations WHERE version = 9;" \
            --json)
          if [[ "$(jq -r '.[0].results[0].count' <<<"$migration")" != "1" ]]; then
            run_sql "Collector covering index" "$(cat <<'SQL'
          CREATE INDEX IF NOT EXISTS collector_invocations_latest_idx
            ON collector_invocations(
              scheduled_at DESC, status, next_retry_at, error_code, finished_at, started_at
            );
          SQL
          )"
            run_sql "Dispatcher covering index" "$(cat <<'SQL'
          CREATE INDEX IF NOT EXISTS dispatcher_invocations_environment_latest_idx
            ON dispatcher_invocations(
              environment, scheduled_at DESC, status, error_code, finished_at, started_at
            );
          SQL
          )"
            run_sql "canary run table" "$(cat <<'SQL'
          CREATE TABLE IF NOT EXISTS canary_runs (
            canary_id TEXT PRIMARY KEY CHECK (
              substr(canary_id, 1, 3) = 'fc-' AND length(canary_id) = 35
                AND substr(canary_id, 4) NOT GLOB '*[^0-9a-f]*'
            ),
            environment TEXT NOT NULL CHECK (environment IN ('staging', 'production')),
            deployment_sha TEXT NOT NULL CHECK (length(deployment_sha) = 40),
            collector_cron TEXT NOT NULL CHECK (length(collector_cron) BETWEEN 1 AND 80),
            dispatcher_cron TEXT NOT NULL CHECK (length(dispatcher_cron) BETWEEN 1 AND 80),
            started_at TEXT NOT NULL,
            ends_at TEXT NOT NULL,
            quota_evidence_json TEXT NOT NULL CHECK (length(quota_evidence_json) BETWEEN 2 AND 65536),
            quota_evidence_hash TEXT NOT NULL CHECK (
              length(quota_evidence_hash) = 64
                AND quota_evidence_hash NOT GLOB '*[^0-9a-f]*'
            ),
            created_at TEXT NOT NULL,
            CHECK (ends_at > started_at)
          );
          SQL
          )"
            run_sql "canary run lookup index" "$(cat <<'SQL'
          CREATE INDEX IF NOT EXISTS canary_runs_environment_sha_started_idx
            ON canary_runs(environment, deployment_sha, started_at DESC);
          SQL
          )"
            run_sql "migration ledger" "INSERT OR IGNORE INTO schema_migrations (version, applied_at) VALUES (9, CURRENT_TIMESTAMP);"
          fi

      - name: Verify production Forecast index plans
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          indexes=$(npx wrangler d1 execute FORECAST_DB --remote --env="" \
            --config forecast-collector/wrangler.toml \
            --command "SELECT name FROM sqlite_master WHERE type = 'index' AND name IN ('collector_invocations_latest_idx', 'dispatcher_invocations_environment_latest_idx') ORDER BY name;" \
            --json)
          jq -e '([.[0].results[].name] | sort) == ["collector_invocations_latest_idx","dispatcher_invocations_environment_latest_idx"]' \
            <<<"$indexes" >/dev/null
          collector_plan=$(npx wrangler d1 execute FORECAST_DB --remote --env="" \
            --config forecast-collector/wrangler.toml \
            --command "EXPLAIN QUERY PLAN SELECT status, COALESCE(finished_at, started_at) FROM collector_invocations ORDER BY scheduled_at DESC LIMIT 1;" \
            --json)
          dispatcher_plan=$(npx wrangler d1 execute FORECAST_DB --remote --env="" \
            --config forecast-collector/wrangler.toml \
            --command "EXPLAIN QUERY PLAN SELECT status, COALESCE(finished_at, started_at), deployment_sha, error_code FROM dispatcher_invocations WHERE environment = 'production' ORDER BY scheduled_at DESC LIMIT 1;" \
            --json)
          jq -e '.[0].results | any(.detail | strings | contains("collector_invocations_latest_idx"))' \
            <<<"$collector_plan" >/dev/null
          jq -e '.[0].results | any(.detail | strings | contains("dispatcher_invocations_environment_latest_idx"))' \
            <<<"$dispatcher_plan" >/dev/null

      - name: Record protected remediation
        run: |
          {
            echo "### Forecast production D1 index remediation"
            echo "- Statistics production D1 read probe: passed"
            echo "- Forecast prerequisite migrations 0007 and 0008: present"
            echo "- Forecast migration 0009: present"
            echo "- Latest Collector and Dispatcher query plans: indexed"
            echo "- Worker deployment and Forecast activation: not performed"
          } >> "$GITHUB_STEP_SUMMARY"

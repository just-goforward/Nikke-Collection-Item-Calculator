name: Deploy Stats Observer

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Full main commit SHA already deployed to the staging statistics Worker
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stats-observer-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main

      - name: Verify deployment target
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.deploy_sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_SHA" ]] || {
            echo "Stats Observer staging deploy must target current trusted main." >&2
            exit 1
          }
          echo "DEPLOY_SHA=$REQUESTED_SHA" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Prepare npm 12.2.0 with pinned integrity
        shell: bash
        timeout-minutes: 5
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-bootstrap-cache
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { existsSync, mkdtempSync, writeFileSync, appendFileSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { setTimeout as delay } from 'node:timers/promises';
          const version = '12.2.0';
          const url = 'https://registry.npmjs.org/npm/-/npm-12.2.0.tgz';
          const sri = 'sha512-ZsJjKpTnlmSXOLLXiU1xDCzC4Wlok4IwZmh/aw2KUuXytU7q6qMv/cUT7MoeSf95Slwuw/lRXYefGzGCspHPNQ==';
          if (process.version !== 'v24.21.0') throw new Error('Unexpected Node version');
          if (!process.env.RUNNER_TEMP || !process.env.GITHUB_PATH || !process.env.NPM_CONFIG_CACHE) throw new Error('Missing runner paths');
          const nodeDir = dirname(process.execPath);
          const sourceCli = [join(nodeDir, 'node_modules/npm/bin/npm-cli.js'), resolve(nodeDir, '../lib/node_modules/npm/bin/npm-cli.js')].find(existsSync);
          if (!sourceCli) throw new Error('Bundled npm CLI not found');
          const cleanEnv = Object.fromEntries(['PATH', 'HOME', 'USERPROFILE', 'SYSTEMROOT', 'WINDIR', 'COMSPEC', 'PATHEXT', 'TEMP', 'TMP', 'TMPDIR', 'APPDATA', 'LOCALAPPDATA'].filter(k => process.env[k] !== undefined).map(k => [k, process.env[k]]));
          const root = mkdtempSync(join(process.env.RUNNER_TEMP, 'npm-12.2.0-'));
          const prefix = join(root, 'prefix');
          const userConfig = join(root, 'user.npmrc');
          const globalConfig = join(root, 'global.npmrc');
          writeFileSync(userConfig, '', { flag: 'wx' });
          writeFileSync(globalConfig, '', { flag: 'wx' });
          const cacheKey = `npm-${version}-${process.platform}-${process.arch}-${Buffer.from(sri.slice(7), 'base64').toString('hex')}`;
          const cache = join(process.env.NPM_CONFIG_CACHE, cacheKey);
          let bytes;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(30000) });
              if (!response.ok) {
                const error = new Error(`npm tarball HTTP ${response.status}`);
                error.terminal = response.status < 500 && response.status !== 408 && response.status !== 429;
                throw error;
              }
              const chunks = []; let size = 0;
              for await (const chunk of response.body) {
                size += chunk.length;
                if (size > 8 * 1024 * 1024) throw Object.assign(new Error('npm tarball size limit exceeded'), { terminal: true });
                chunks.push(chunk);
              }
              bytes = Buffer.concat(chunks); break;
            } catch (error) {
              if (error.terminal || attempt === 2) throw error;
              await delay(1000 * (attempt + 1));
            }
          }
          if ('sha512-' + createHash('sha512').update(bytes).digest('base64') !== sri) throw new Error('npm tarball integrity mismatch');
          const tgz = join(root, 'npm-12.2.0.tgz');
          writeFileSync(tgz, bytes, { flag: 'wx' });
          const options = { cwd: root, env: cleanEnv, timeout: 120000 };
          execFileSync(process.execPath, [sourceCli, 'install', '--global', '--prefix', prefix, tgz, '--offline', '--ignore-scripts', '--no-audit', '--no-fund', '--no-update-notifier', '--cache', cache, '--userconfig', userConfig, '--globalconfig', globalConfig], { ...options, stdio: 'inherit' });
          const windows = process.platform === 'win32';
          const targetCli = join(prefix, windows ? 'node_modules' : 'lib/node_modules', 'npm/bin/npm-cli.js');
          if (execFileSync(process.execPath, [targetCli, '--version', '--no-update-notifier', '--userconfig', userConfig, '--globalconfig', globalConfig], options).toString().trim() !== version) throw new Error('Installed npm version mismatch');
          appendFileSync(process.env.GITHUB_PATH, (windows ? prefix : join(prefix, 'bin')) + '\n');
          console.log(`Prepared npm ${version}; platform=${process.platform}; integrity verified`);
          NODE

      - name: Install and verify
        run: |
          npm ci
          npm run stats-observer:types:check
          npx tsc --noEmit -p stats-observer/tsconfig.json
          npm run test:stats-observer
          npx wrangler deploy --dry-run --env staging --config stats-observer/wrangler.toml

      - name: Verify Paid guard and staging Stats contract
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_USAGE_GUARD_URL: ${{ vars.CLOUDFLARE_USAGE_GUARD_URL }}
          STAGING_WORKER_URL: ${{ vars.CLOUDFLARE_STAGING_WORKER_URL }}
          STATS_ALLOWED_ORIGIN: ${{ vars.STATS_ALLOWED_ORIGIN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 20 \
            "$CLOUDFLARE_USAGE_GUARD_URL/health" | jq -e '.state.action == "normal"' >/dev/null
          npm run check:d1-schema -- collection-kit-stats-staging staging
          npm run smoke:stats-worker -- "$STAGING_WORKER_URL" "$STATS_ALLOWED_ORIGIN"
          npx wrangler deployments status --env staging --config cloudflare/wrangler.toml --json > "$RUNNER_TEMP/stats-deployment.json"
          npx wrangler versions list --env staging --config cloudflare/wrangler.toml --json > "$RUNNER_TEMP/stats-versions.json"
          node --input-type=module - "$RUNNER_TEMP/stats-deployment.json" "$RUNNER_TEMP/stats-versions.json" "$DEPLOY_SHA" <<'NODE'
          import { readFileSync } from "node:fs";
          const deployment = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const versions = JSON.parse(readFileSync(process.argv[3], "utf8"));
          const activeId = deployment.versions?.find((row) => row.percentage === 100)?.version_id;
          const active = versions.find((row) => row.id === activeId);
          if (active?.annotations?.["workers/tag"] !== process.argv[4]) throw new Error("Statistics Worker and Observer SHA differ.");
          NODE

      - name: Initialize staging Observer D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler d1 execute OBSERVER_DB --remote --env staging
          --config stats-observer/wrangler.toml --file stats-observer/schema.sql --yes

      - name: Build deployment secrets
        shell: bash
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_FORECAST_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DISCORD_BOT_TOKEN"
          jq -n --arg token "$DISCORD_BOT_TOKEN" '{DISCORD_BOT_TOKEN:$token}' > "$RUNNER_TEMP/observer-secrets.json"

      - name: Deploy staging Stats Observer
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ALERT_CHANNEL_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ALERT_CHANNEL_ID" =~ ^[0-9]{15,22}$ ]]
          npx wrangler deploy --env staging --config stats-observer/wrangler.toml \
            --secrets-file "$RUNNER_TEMP/observer-secrets.json" \
            --var "ENVIRONMENT:staging" \
            --var "DEPLOY_SHA:$DEPLOY_SHA" \
            --var "DISCORD_ALERT_CHANNEL_ID:$ALERT_CHANNEL_ID" \
            --tag "$DEPLOY_SHA" --message "GitHub $DEPLOY_SHA"

      - name: Record burn-in boundary
        run: |
          {
            echo "### Stats Observer staging"
            echo "- Deployment: \`$DEPLOY_SHA\`"
            echo "- Cron: \`7,37 * * * *\`"
            echo "- Next gate: at least 30 minutes of healthy burn-in, then start a fresh 8-hour canary"
            echo "- Production and the client recovery emission version were not changed"
          } >> "$GITHUB_STEP_SUMMARY"

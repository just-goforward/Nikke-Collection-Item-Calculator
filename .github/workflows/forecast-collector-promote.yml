name: Promote Forecast Collector

on:
  workflow_dispatch:
    inputs:
      canary_only:
        description: Verify the canary without requesting production approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: forecast-collector-production
  cancel-in-progress: false

jobs:
  canary:
    if: github.ref == 'refs/heads/main' && vars.FORECAST_COLLECTOR_STAGING_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      canary_status: ${{ steps.canary.outputs.canary_status }}
      canary_promotable: ${{ steps.canary.outputs.canary_promotable }}
      canary_warning: ${{ steps.canary.outputs.canary_warning }}
      canary_id: ${{ steps.canary.outputs.canary_id }}
      deployment_sha: ${{ steps.canary.outputs.deployment_sha }}
      canary_early_failed: ${{ steps.canary.outputs.canary_early_failed }}
      poll_mode: ${{ steps.canary.outputs.poll_mode }}
      collector_version_id: ${{ steps.window.outputs.collector_version_id }}
      dispatcher_version_id: ${{ steps.window.outputs.dispatcher_version_id }}
      started_at: ${{ steps.window.outputs.started_at }}
      ends_at: ${{ steps.window.outputs.ends_at }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Prepare npm 12.2.0 with pinned integrity
        shell: bash
        timeout-minutes: 5
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-bootstrap-cache
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { existsSync, mkdtempSync, writeFileSync, appendFileSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { setTimeout as delay } from 'node:timers/promises';
          const version = '12.2.0';
          const url = 'https://registry.npmjs.org/npm/-/npm-12.2.0.tgz';
          const sri = 'sha512-ZsJjKpTnlmSXOLLXiU1xDCzC4Wlok4IwZmh/aw2KUuXytU7q6qMv/cUT7MoeSf95Slwuw/lRXYefGzGCspHPNQ==';
          if (process.version !== 'v24.21.0') throw new Error('Unexpected Node version');
          if (!process.env.RUNNER_TEMP || !process.env.GITHUB_PATH || !process.env.NPM_CONFIG_CACHE) throw new Error('Missing runner paths');
          const nodeDir = dirname(process.execPath);
          const sourceCli = [join(nodeDir, 'node_modules/npm/bin/npm-cli.js'), resolve(nodeDir, '../lib/node_modules/npm/bin/npm-cli.js')].find(existsSync);
          if (!sourceCli) throw new Error('Bundled npm CLI not found');
          const cleanEnv = Object.fromEntries(['PATH', 'HOME', 'USERPROFILE', 'SYSTEMROOT', 'WINDIR', 'COMSPEC', 'PATHEXT', 'TEMP', 'TMP', 'TMPDIR', 'APPDATA', 'LOCALAPPDATA'].filter(k => process.env[k] !== undefined).map(k => [k, process.env[k]]));
          const root = mkdtempSync(join(process.env.RUNNER_TEMP, 'npm-12.2.0-'));
          const prefix = join(root, 'prefix');
          const userConfig = join(root, 'user.npmrc');
          const globalConfig = join(root, 'global.npmrc');
          writeFileSync(userConfig, '', { flag: 'wx' });
          writeFileSync(globalConfig, '', { flag: 'wx' });
          const cacheKey = `npm-${version}-${process.platform}-${process.arch}-${Buffer.from(sri.slice(7), 'base64').toString('hex')}`;
          const cache = join(process.env.NPM_CONFIG_CACHE, cacheKey);
          let bytes;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(30000) });
              if (!response.ok) {
                const error = new Error(`npm tarball HTTP ${response.status}`);
                error.terminal = response.status < 500 && response.status !== 408 && response.status !== 429;
                throw error;
              }
              const chunks = []; let size = 0;
              for await (const chunk of response.body) {
                size += chunk.length;
                if (size > 8 * 1024 * 1024) throw Object.assign(new Error('npm tarball size limit exceeded'), { terminal: true });
                chunks.push(chunk);
              }
              bytes = Buffer.concat(chunks); break;
            } catch (error) {
              if (error.terminal || attempt === 2) throw error;
              await delay(1000 * (attempt + 1));
            }
          }
          if ('sha512-' + createHash('sha512').update(bytes).digest('base64') !== sri) throw new Error('npm tarball integrity mismatch');
          const tgz = join(root, 'npm-12.2.0.tgz');
          writeFileSync(tgz, bytes, { flag: 'wx' });
          const options = { cwd: root, env: cleanEnv, timeout: 120000 };
          execFileSync(process.execPath, [sourceCli, 'install', '--global', '--prefix', prefix, tgz, '--offline', '--ignore-scripts', '--no-audit', '--no-fund', '--no-update-notifier', '--cache', cache, '--userconfig', userConfig, '--globalconfig', globalConfig], { ...options, stdio: 'inherit' });
          const windows = process.platform === 'win32';
          const targetCli = join(prefix, windows ? 'node_modules' : 'lib/node_modules', 'npm/bin/npm-cli.js');
          if (execFileSync(process.execPath, [targetCli, '--version', '--no-update-notifier', '--userconfig', userConfig, '--globalconfig', globalConfig], options).toString().trim() !== version) throw new Error('Installed npm version mismatch');
          appendFileSync(process.env.GITHUB_PATH, (windows ? prefix : join(prefix, 'bin')) + '\n');
          console.log(`Prepared npm ${version}; platform=${process.platform}; integrity verified`);
          NODE

      - name: Verify Paid usage guard is normal
        env:
          CLOUDFLARE_USAGE_GUARD_URL: ${{ vars.CLOUDFLARE_USAGE_GUARD_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_USAGE_GUARD_URL" =~ ^https://[^/]+$ ]]
          refresh_status=$(curl --silent --show-error --connect-timeout 5 --max-time 30 \
            --output "$RUNNER_TEMP/usage-guard-refresh.json" --write-out "%{http_code}" \
            -X POST -H "Authorization: Bearer $FORECAST_COLLECTOR_ADMIN_TOKEN" \
            "$CLOUDFLARE_USAGE_GUARD_URL/admin/refresh")
          [[ "$refresh_status" == "200" ]] || { echo "Usage Guard refresh returned HTTP $refresh_status." >&2; exit 1; }
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 20 \
            "$CLOUDFLARE_USAGE_GUARD_URL/health" > "$RUNNER_TEMP/usage-guard-health.json"
          jq -e '.ok == true and .state.action == "normal"' "$RUNNER_TEMP/usage-guard-health.json" >/dev/null

      - name: Read the server-owned canary window
        id: window
        env:
          FORECAST_COLLECTOR_URL: ${{ vars.FORECAST_COLLECTOR_STAGING_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 20 \
            -H "Authorization: Bearer $FORECAST_COLLECTOR_ADMIN_TOKEN" \
            -H "Accept: application/json" \
            "$FORECAST_COLLECTOR_URL/admin/canary-window" > "$RUNNER_TEMP/canary-window.json"
          jq -e '.version == 10 and .policyId == "forecast-canary-v10-live-contract-v1" and (.canaryId | test("^fc-[0-9a-f]{32}$")) and (.deploymentSha | test("^[0-9a-f]{40}$")) and (.collectorVersionId | test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$")) and (.dispatcherVersionId | test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$")) and (.pollMode == "both" or .pollMode == "alternating")' \
            "$RUNNER_TEMP/canary-window.json" >/dev/null
          echo "canary_id=$(jq -r '.canaryId' "$RUNNER_TEMP/canary-window.json")" >> "$GITHUB_OUTPUT"
          echo "deployment_sha=$(jq -r '.deploymentSha' "$RUNNER_TEMP/canary-window.json")" >> "$GITHUB_OUTPUT"
          echo "started_at=$(jq -r '.window.startedAt' "$RUNNER_TEMP/canary-window.json")" >> "$GITHUB_OUTPUT"
          echo "ends_at=$(jq -r '.window.endsAt' "$RUNNER_TEMP/canary-window.json")" >> "$GITHUB_OUTPUT"
          echo "eligible=$(jq -r '.window.eligible' "$RUNNER_TEMP/canary-window.json")" >> "$GITHUB_OUTPUT"
          echo "poll_mode=$(jq -r '.pollMode' "$RUNNER_TEMP/canary-window.json")" >> "$GITHUB_OUTPUT"
          echo "collector_version_id=$(jq -r '.collectorVersionId' "$RUNNER_TEMP/canary-window.json")" >> "$GITHUB_OUTPUT"
          echo "dispatcher_version_id=$(jq -r '.dispatcherVersionId' "$RUNNER_TEMP/canary-window.json")" >> "$GITHUB_OUTPUT"

      - name: Select the exact trusted canary snapshot
        env:
          TRUSTED_SHA: ${{ github.sha }}
          CANARY_SHA: ${{ steps.window.outputs.deployment_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ && "$CANARY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"
          git cat-file -e "$CANARY_SHA^{commit}"
          git merge-base --is-ancestor "$CANARY_SHA" "$TRUSTED_SHA"
          git checkout --detach "$CANARY_SHA"
          test "$(git rev-parse HEAD)" = "$CANARY_SHA"

      - name: Install exact canary dependencies
        run: npm ci

      - name: Collect exact scheduled-only Workers Observability evidence
        if: steps.window.outputs.eligible == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_OBSERVABILITY_TOKEN }}
          FORECAST_CANARY_ID: ${{ steps.window.outputs.canary_id }}
          FORECAST_CANARY_DEPLOYMENT_SHA: ${{ steps.window.outputs.deployment_sha }}
          FORECAST_CANARY_STARTED_AT: ${{ steps.window.outputs.started_at }}
          FORECAST_CANARY_ENDED_AT: ${{ steps.window.outputs.ends_at }}
          FORECAST_COLLECTOR_SCRIPT_VERSION: ${{ steps.window.outputs.deployment_sha }}-${{ steps.window.outputs.poll_mode }}-v10
          FORECAST_DISPATCHER_SCRIPT_VERSION: ${{ steps.window.outputs.deployment_sha }}-v10
          FORECAST_COLLECTOR_SCRIPT_VERSION_ID: ${{ steps.window.outputs.collector_version_id }}
          FORECAST_DISPATCHER_SCRIPT_VERSION_ID: ${{ steps.window.outputs.dispatcher_version_id }}
          FORECAST_CANARY_RUNTIME_OUTPUT: ${{ runner.temp }}/forecast-canary-runtime.json
          FORECAST_OBSERVABILITY_MAX_WAIT_MS: 1800000
          FORECAST_OBSERVABILITY_RETRY_INTERVAL_MS: 300000
        run: npm run collect:forecast-runtime

      - name: Measure fresh account quota evidence for the exact canary window
        if: steps.window.outputs.eligible == 'true'
        id: final_quota
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_D1_ANALYTICS_TOKEN }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            if npm run check:d1-budget -- preflight \
              --runtime-start "${{ steps.window.outputs.started_at }}" \
              --runtime-end "${{ steps.window.outputs.ends_at }}" \
              --output "$RUNNER_TEMP/canary-final-quota.json"; then
              exit 0
            fi
            if (( attempt < 3 )); then sleep $((attempt * 15)); fi
          done
          exit 1

      - name: Read authenticated Paid canary v10 certificate
        id: canary
        continue-on-error: true
        env:
          FORECAST_COLLECTOR_URL: ${{ vars.FORECAST_COLLECTOR_STAGING_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
          FORECAST_CANARY_ID: ${{ steps.window.outputs.canary_id }}
          FORECAST_CANARY_QUOTA_EVIDENCE: ${{ steps.window.outputs.eligible == 'true' && steps.final_quota.outcome == 'success' && format('{0}/canary-final-quota.json', runner.temp) || '' }}
          FORECAST_CANARY_RUNTIME_EVIDENCE: ${{ steps.window.outputs.eligible == 'true' && format('{0}/forecast-canary-runtime.json', runner.temp) || '' }}
          FORECAST_CANARY_RUNTIME_BASELINE: ${{ hashFiles('forecast-collector/runtime-baseline.json') != '' && 'forecast-collector/runtime-baseline.json' || '' }}
          FORECAST_CANARY_REPORT_OUTPUT: ${{ runner.temp }}/forecast-canary-report.json
        run: npm run check:forecast-canary

      - name: Bind the certificate to the selected snapshot and window
        if: steps.canary.outcome == 'success'
        env:
          CANARY_SHA: ${{ steps.window.outputs.deployment_sha }}
          CANARY_ID: ${{ steps.window.outputs.canary_id }}
          POLL_MODE: ${{ steps.window.outputs.poll_mode }}
          COLLECTOR_VERSION_ID: ${{ steps.window.outputs.collector_version_id }}
          DISPATCHER_VERSION_ID: ${{ steps.window.outputs.dispatcher_version_id }}
          STARTED_AT: ${{ steps.window.outputs.started_at }}
          ENDS_AT: ${{ steps.window.outputs.ends_at }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANARY_SHA"
          jq -e --arg sha "$CANARY_SHA" --arg id "$CANARY_ID" --arg mode "$POLL_MODE" \
            --arg collector "$COLLECTOR_VERSION_ID" --arg dispatcher "$DISPATCHER_VERSION_ID" \
            --arg started "$STARTED_AT" --arg ended "$ENDS_AT" \
            '.deploymentSha == $sha and .canaryId == $id and .pollMode == $mode and
             .identity.deploymentSha == $sha and .identity.canaryId == $id and
             .identity.collectorScriptVersionId == $collector and .identity.dispatcherScriptVersionId == $dispatcher and
             .identity.startedAt == $started and .identity.endedAt == $ended and
             .window.startedAt == $started and .window.endsAt == $ended' \
            "$RUNNER_TEMP/forecast-canary-report.json" >/dev/null

      - name: Write Korean v10 certification summary
        if: always() && steps.window.outputs.eligible == 'true' && steps.canary.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          jq '{canaryId,deploymentSha,pollMode,collectorVersionId,dispatcherVersionId,
               startedAt:.window.startedAt,endsAt:.window.endsAt}' \
            "$RUNNER_TEMP/canary-window.json" > "$RUNNER_TEMP/forecast-canary-identity.json"
          node scripts/check-workflow-hardening.ts --sanitize-canary \
            "$RUNNER_TEMP/forecast-canary-identity.json" > "$RUNNER_TEMP/forecast-canary-identity.evidence.json"
          node scripts/check-workflow-hardening.ts --certification-summary \
            "$RUNNER_TEMP/forecast-canary-report.json" > "$RUNNER_TEMP/forecast-canary-summary.ko.md"
          cat "$RUNNER_TEMP/forecast-canary-summary.ko.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create baseline bootstrap candidate
        if: always() && steps.canary.outputs.canary_promotable == 'true'
        shell: bash
        run: |
          if ! jq -e '.performance.status == "baseline_bootstrap"' "$RUNNER_TEMP/forecast-canary-report.json" >/dev/null; then
            exit 0
          fi
          jq '{
            version:1,
            id:("forecast-canary-v10-" + .canaryId),
            sourceCanaryId:.canaryId,
            deploymentSha:.deploymentSha,
            collectorScriptVersion:.identity.collectorScriptVersion,
            dispatcherScriptVersion:.identity.dispatcherScriptVersion,
            sampleHash:.performance.sampleHash,
            collector:{full:.performance.collector.full,firstHalf:.performance.collector.firstHalf,secondHalf:.performance.collector.secondHalf},
            dispatcher:{full:.performance.dispatcher.full,firstHalf:.performance.dispatcher.firstHalf,secondHalf:.performance.dispatcher.secondHalf}
          }' "$RUNNER_TEMP/forecast-canary-report.json" > "$RUNNER_TEMP/forecast-canary-baseline-bootstrap.json"

      - name: Project privacy-safe certification CPU and quota evidence
        if: always() && steps.window.outputs.eligible == 'true'
        shell: bash
        run: |
          set -u
          failed=0
          while read -r kind stem; do
            source="$RUNNER_TEMP/$stem.json"
            [[ -f "$source" ]] || continue
            peer=()
            if [[ "$kind" == runtime || "$kind" == candidate ]]; then
              peer=("$RUNNER_TEMP/forecast-canary-report.json")
            fi
            if node scripts/check-workflow-hardening.ts --retain-evidence "$source" "$kind" "${peer[@]}" \
              > "$RUNNER_TEMP/$stem.evidence.pending"; then
              mv "$RUNNER_TEMP/$stem.evidence.pending" "$RUNNER_TEMP/$stem.evidence.json"
            else
              failed=1
            fi
          done <<'EVIDENCE'
          certification forecast-canary-report
          runtime forecast-canary-runtime
          quota canary-final-quota
          candidate forecast-canary-baseline-bootstrap
          EVIDENCE
          exit "$failed"

      - name: Upload immutable v10 evidence
        if: always() && steps.window.outputs.eligible == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forecast-canary-v10-${{ steps.window.outputs.canary_id }}
          path: |
            ${{ runner.temp }}/forecast-canary-identity.evidence.json
            ${{ runner.temp }}/forecast-canary-summary.ko.md
            ${{ runner.temp }}/forecast-canary-report.evidence.json
            ${{ runner.temp }}/forecast-canary-runtime.evidence.json
            ${{ runner.temp }}/canary-final-quota.evidence.json
            ${{ runner.temp }}/forecast-canary-baseline-bootstrap.evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Recheck account-wide D1 budget at promotion boundary
        if: steps.canary.outputs.canary_promotable == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_D1_ANALYTICS_TOKEN }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
        run: >-
          npm run check:d1-budget -- preflight
          --output "$RUNNER_TEMP/d1-budget-promotion.json"

      - name: Verify statistics production D1 at promotion boundary
        if: steps.canary.outputs.canary_promotable == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(npx wrangler d1 execute DB --remote --config cloudflare/wrangler.toml \
            --command "SELECT 1 AS ok;" --json)
          [[ "$(jq -r '.[0].results[0].ok' <<<"$result")" == "1" ]]

      - name: Canary pending summary
        if: steps.canary.outputs.canary_promotable != 'true'
        run: |
          echo "Eight-hour Forecast Canary v10 is not promotable. Status: ${{ steps.canary.outputs.canary_status || 'schema_error' }}." >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.canary.outputs.canary_early_failed }}" == "true" ]]; then
            echo "The v10 early-failure gate rejected this deployment. Do not weaken or reuse this window." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.canary.outputs.canary_status }}" == "incomplete" ]]; then
            echo "Evidence is incomplete. Re-run this workflow to query the same immutable window; do not restart the Worker canary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reject only a proven failed or malformed canary
        if: steps.window.outputs.eligible == 'true' && (steps.canary.outcome == 'failure' || steps.canary.outputs.canary_status == 'failed')
        run: |
          echo "The completed v10 canary has a proven hard-gate failure or malformed certificate. A fresh deployment and window are required." >&2
          exit 1

      - name: Record promotable warning
        if: steps.canary.outputs.canary_status == 'passed_with_warning'
        run: |
          echo "::warning::Forecast Canary v10 passed hard gates with warnings: ${{ steps.canary.outputs.canary_warning }}"
          echo "Production still requires the cloudflare-production environment approval." >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: canary
    if: github.ref == 'refs/heads/main' && needs.canary.outputs.canary_promotable == 'true' && !inputs.canary_only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: cloudflare-production
    steps:
      - name: Checkout exact certified snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.canary.outputs.deployment_sha }}

      - name: Verify exact certified checkout before executing project code
        env:
          CERTIFIED_SHA: ${{ needs.canary.outputs.deployment_sha }}
        run: |
          [[ "$CERTIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Prepare npm 12.2.0 with pinned integrity
        shell: bash
        timeout-minutes: 5
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-bootstrap-cache
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { existsSync, mkdtempSync, writeFileSync, appendFileSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { setTimeout as delay } from 'node:timers/promises';
          const version = '12.2.0';
          const url = 'https://registry.npmjs.org/npm/-/npm-12.2.0.tgz';
          const sri = 'sha512-ZsJjKpTnlmSXOLLXiU1xDCzC4Wlok4IwZmh/aw2KUuXytU7q6qMv/cUT7MoeSf95Slwuw/lRXYefGzGCspHPNQ==';
          if (process.version !== 'v24.21.0') throw new Error('Unexpected Node version');
          if (!process.env.RUNNER_TEMP || !process.env.GITHUB_PATH || !process.env.NPM_CONFIG_CACHE) throw new Error('Missing runner paths');
          const nodeDir = dirname(process.execPath);
          const sourceCli = [join(nodeDir, 'node_modules/npm/bin/npm-cli.js'), resolve(nodeDir, '../lib/node_modules/npm/bin/npm-cli.js')].find(existsSync);
          if (!sourceCli) throw new Error('Bundled npm CLI not found');
          const cleanEnv = Object.fromEntries(['PATH', 'HOME', 'USERPROFILE', 'SYSTEMROOT', 'WINDIR', 'COMSPEC', 'PATHEXT', 'TEMP', 'TMP', 'TMPDIR', 'APPDATA', 'LOCALAPPDATA'].filter(k => process.env[k] !== undefined).map(k => [k, process.env[k]]));
          const root = mkdtempSync(join(process.env.RUNNER_TEMP, 'npm-12.2.0-'));
          const prefix = join(root, 'prefix');
          const userConfig = join(root, 'user.npmrc');
          const globalConfig = join(root, 'global.npmrc');
          writeFileSync(userConfig, '', { flag: 'wx' });
          writeFileSync(globalConfig, '', { flag: 'wx' });
          const cacheKey = `npm-${version}-${process.platform}-${process.arch}-${Buffer.from(sri.slice(7), 'base64').toString('hex')}`;
          const cache = join(process.env.NPM_CONFIG_CACHE, cacheKey);
          let bytes;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(30000) });
              if (!response.ok) {
                const error = new Error(`npm tarball HTTP ${response.status}`);
                error.terminal = response.status < 500 && response.status !== 408 && response.status !== 429;
                throw error;
              }
              const chunks = []; let size = 0;
              for await (const chunk of response.body) {
                size += chunk.length;
                if (size > 8 * 1024 * 1024) throw Object.assign(new Error('npm tarball size limit exceeded'), { terminal: true });
                chunks.push(chunk);
              }
              bytes = Buffer.concat(chunks); break;
            } catch (error) {
              if (error.terminal || attempt === 2) throw error;
              await delay(1000 * (attempt + 1));
            }
          }
          if ('sha512-' + createHash('sha512').update(bytes).digest('base64') !== sri) throw new Error('npm tarball integrity mismatch');
          const tgz = join(root, 'npm-12.2.0.tgz');
          writeFileSync(tgz, bytes, { flag: 'wx' });
          const options = { cwd: root, env: cleanEnv, timeout: 120000 };
          execFileSync(process.execPath, [sourceCli, 'install', '--global', '--prefix', prefix, tgz, '--offline', '--ignore-scripts', '--no-audit', '--no-fund', '--no-update-notifier', '--cache', cache, '--userconfig', userConfig, '--globalconfig', globalConfig], { ...options, stdio: 'inherit' });
          const windows = process.platform === 'win32';
          const targetCli = join(prefix, windows ? 'node_modules' : 'lib/node_modules', 'npm/bin/npm-cli.js');
          if (execFileSync(process.execPath, [targetCli, '--version', '--no-update-notifier', '--userconfig', userConfig, '--globalconfig', globalConfig], options).toString().trim() !== version) throw new Error('Installed npm version mismatch');
          appendFileSync(process.env.GITHUB_PATH, (windows ? prefix : join(prefix, 'bin')) + '\n');
          console.log(`Prepared npm ${version}; platform=${process.platform}; integrity verified`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate production configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_D1_ANALYTICS_TOKEN }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
          CLOUDFLARE_USAGE_GUARD_URL: ${{ vars.CLOUDFLARE_USAGE_GUARD_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
          FORECAST_COLLECTOR_PRODUCTION_URL: ${{ vars.FORECAST_COLLECTOR_PRODUCTION_URL }}
          FORECAST_INTERACTIONS_URL: ${{ vars.FORECAST_INTERACTIONS_URL }}
          FORECAST_GITHUB_APP_ID: ${{ vars.FORECAST_GITHUB_APP_ID }}
          FORECAST_GITHUB_APP_INSTALLATION_ID: ${{ vars.FORECAST_GITHUB_APP_INSTALLATION_ID }}
          FORECAST_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FORECAST_GITHUB_APP_PRIVATE_KEY }}
          DISCORD_FORECAST_BOT_TOKEN: ${{ secrets.DISCORD_FORECAST_BOT_TOKEN }}
          DISCORD_FORECAST_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_CHANNEL_ID }}
          DISCORD_FORECAST_ACTIVITY_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ACTIVITY_CHANNEL_ID }}
          DISCORD_FORECAST_ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ALERT_CHANNEL_ID }}
          DISCORD_FORECAST_FALLBACK_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_FALLBACK_CHANNEL_ID }}
          DISCORD_FORECAST_APPROVAL_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_APPROVAL_CHANNEL_ID }}
          DISCORD_FORECAST_GUILD_ID: ${{ vars.DISCORD_FORECAST_GUILD_ID }}
          DISCORD_FORECAST_APPROVER_USER_ID: ${{ vars.DISCORD_FORECAST_APPROVER_USER_ID }}
          DISCORD_FORECAST_APPLICATION_ID: ${{ vars.DISCORD_FORECAST_APPLICATION_ID }}
          DISCORD_FORECAST_PUBLIC_KEY: ${{ vars.DISCORD_FORECAST_PUBLIC_KEY }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN" && \
          test -n "$CLOUDFLARE_D1_ANALYTICS_TOKEN" && test -n "$CLOUDFLARE_BILLING_READ_TOKEN" && \
          [[ "$CLOUDFLARE_USAGE_GUARD_URL" =~ ^https://[^/]+$ ]] && \
          test -n "$FORECAST_COLLECTOR_ADMIN_TOKEN" && test -n "$FORECAST_COLLECTOR_PRODUCTION_URL"
          node scripts/check-workflow-hardening.ts --router-origin "$FORECAST_INTERACTIONS_URL"
          [[ "$FORECAST_GITHUB_APP_ID" =~ ^[0-9]{1,20}$ ]]
          [[ "$FORECAST_GITHUB_APP_INSTALLATION_ID" =~ ^[0-9]{1,20}$ ]]
          test -n "$FORECAST_GITHUB_APP_PRIVATE_KEY" && test -n "$DISCORD_FORECAST_BOT_TOKEN"
          [[ "$DISCORD_FORECAST_CHANNEL_ID" =~ ^[0-9]{6,24}$ ]]
          [[ "$DISCORD_FORECAST_ACTIVITY_CHANNEL_ID" =~ ^[0-9]{6,24}$ ]]
          [[ "$DISCORD_FORECAST_ALERT_CHANNEL_ID" =~ ^[0-9]{6,24}$ ]]
          [[ "$DISCORD_FORECAST_FALLBACK_CHANNEL_ID" =~ ^[0-9]{6,24}$ ]]
          [[ "$DISCORD_FORECAST_APPROVAL_CHANNEL_ID" =~ ^[0-9]{6,24}$ ]]
          [[ "$DISCORD_FORECAST_GUILD_ID" =~ ^[0-9]{6,24}$ ]]
          [[ "$DISCORD_FORECAST_APPROVER_USER_ID" =~ ^[0-9]{6,24}$ ]]
          [[ "$DISCORD_FORECAST_APPLICATION_ID" =~ ^[0-9]{6,24}$ ]]
          [[ "$DISCORD_FORECAST_PUBLIC_KEY" =~ ^[0-9a-fA-F]{64}$ ]]

      - name: Capture validated production restorepoints
        id: prior
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for component in collector dispatcher router; do
            case "$component" in
              collector) config=forecast-collector/wrangler.toml; control=COLLECT_ENABLED ;;
              dispatcher) config=forecast-dispatcher/wrangler.toml; control=DISPATCH_ENABLED ;;
              router) config=forecast-interactions/wrangler.toml; control=PRODUCTION_MUTATIONS_ENABLED ;;
            esac
            npx wrangler deployments status --env="" --config "$config" \
              --json > "$RUNNER_TEMP/production-$component-before.json"
            version=$(node scripts/check-workflow-hardening.ts --active-version "$RUNNER_TEMP/production-$component-before.json")
            npx wrangler versions view "$version" --env="" --config "$config" \
              --json > "$RUNNER_TEMP/production-$component-version-before.json"
            node scripts/check-workflow-hardening.ts --version-identity \
              "$RUNNER_TEMP/production-$component-version-before.json" "$version" \
              > "$RUNNER_TEMP/production-$component-identity-before.json"
            node scripts/check-workflow-hardening.ts --sanitize-identity \
              "$RUNNER_TEMP/production-$component-identity-before.json" > "$RUNNER_TEMP/production-$component-identity-before.evidence.json"
            jq -e --arg control "$control" \
              '.vars[$control] == "true" or .vars[$control] == "false"' \
              "$RUNNER_TEMP/production-$component-identity-before.json" >/dev/null
            if [[ "$component" == "router" ]]; then
              jq -e '.tag == (.deploymentSha + "-production-enabled") or .tag == (.deploymentSha + "-production-disabled")' \
                "$RUNNER_TEMP/production-$component-identity-before.json" >/dev/null
            else
              jq -e '.vars.ENVIRONMENT == "production"' \
                "$RUNNER_TEMP/production-$component-identity-before.json" >/dev/null
            fi
            echo "${component}_version=$version" >> "$GITHUB_OUTPUT"
            echo "${component}_sha=$(jq -r '.deploymentSha' "$RUNNER_TEMP/production-$component-identity-before.json")" >> "$GITHUB_OUTPUT"
          done

      - name: Recheck D1 budget before production migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_D1_ANALYTICS_TOKEN }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          indexes=$(npx wrangler d1 execute FORECAST_DB --remote --env="" \
            --config forecast-collector/wrangler.toml \
            --command "SELECT name FROM sqlite_master WHERE type = 'index' AND name IN ('collector_invocations_latest_idx', 'dispatcher_invocations_environment_latest_idx') ORDER BY name;" \
            --json)
          jq -e '([.[0].results[].name] | sort) == ["collector_invocations_latest_idx","dispatcher_invocations_environment_latest_idx"]' \
            <<<"$indexes" >/dev/null || {
              echo "Production Forecast covering indexes are missing. Run Remediate Forecast D1 Indexes first." >&2
              exit 1
            }
          stats_probe=$(npx wrangler d1 execute DB --remote \
            --config cloudflare/wrangler.toml --command "SELECT 1 AS ok;" --json)
          [[ "$(jq -r '.[0].results[0].ok' <<<"$stats_probe")" == "1" ]]
          npm run check:d1-budget -- preflight --output "$RUNNER_TEMP/d1-budget-production-preflight.json"

      - name: Refresh Paid usage guard before production changes
        env:
          CLOUDFLARE_USAGE_GUARD_URL: ${{ vars.CLOUDFLARE_USAGE_GUARD_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --connect-timeout 5 --max-time 30 \
            --output "$RUNNER_TEMP/usage-guard-production-refresh.json" --write-out "%{http_code}" \
            -X POST -H "Authorization: Bearer $FORECAST_COLLECTOR_ADMIN_TOKEN" \
            "$CLOUDFLARE_USAGE_GUARD_URL/admin/refresh")
          [[ "$status" == "200" ]]
          jq -e '.ok == true and .state.action == "normal"' "$RUNNER_TEMP/usage-guard-production-refresh.json" >/dev/null

      - name: Verify Forecast migration runner
        run: npm test -- scripts/apply-forecast-d1-migrations.spec.ts scripts/forecast-dispatcher-workflow.spec.ts scripts/check-workflow-hardening.spec.ts

      - name: Apply production Forecast D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/apply-forecast-d1-migrations.ts --env production --remote

      - name: Verify production Cron trigger capacity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FORECAST_DISPATCHER_SCRIPT_NAME: collection-kit-forecast-dispatcher
        run: npm run check:cloudflare-cron-capacity

      - name: Determine coupled production rollout
        id: rollout
        env:
          DEPLOY_SHA: ${{ needs.canary.outputs.deployment_sha }}
          POLL_MODE: ${{ needs.canary.outputs.poll_mode }}
        run: |
          set -euo pipefail
          if jq -e --arg sha "$DEPLOY_SHA" --arg mode "$POLL_MODE" \
            '.deploymentSha == $sha and .tag == ($sha + "-" + $mode) and
             .vars.POLL_MODE == $mode and .vars.COLLECT_ENABLED == "true" and .vars.DISCORD_INTERACTION_OWNER == "router"' \
            "$RUNNER_TEMP/production-collector-identity-before.json" >/dev/null &&
            jq -e --arg sha "$DEPLOY_SHA" \
              '.deploymentSha == $sha and .tag == ($sha + "-enabled") and .vars.DISPATCH_ENABLED == "true"' \
              "$RUNNER_TEMP/production-dispatcher-identity-before.json" >/dev/null &&
            jq -e --arg sha "$DEPLOY_SHA" \
              '.deploymentSha == $sha and .tag == ($sha + "-production-enabled") and .vars.PRODUCTION_MUTATIONS_ENABLED == "true"' \
              "$RUNNER_TEMP/production-router-identity-before.json" >/dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare dispatcher deployment secret file
        if: steps.rollout.outputs.needed == 'true'
        env:
          FORECAST_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FORECAST_GITHUB_APP_PRIVATE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_FORECAST_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/forecast-dispatcher-secrets.json" <<'NODE'
          import { writeFileSync } from "node:fs";
          const privateKey = process.env.FORECAST_GITHUB_APP_PRIVATE_KEY ?? "";
          const discordToken = process.env.DISCORD_BOT_TOKEN ?? "";
          if (!privateKey.includes("BEGIN") || !discordToken) throw new Error("Dispatcher secrets are invalid.");
          writeFileSync(
            process.argv[2],
            JSON.stringify({ GITHUB_APP_PRIVATE_KEY: privateKey, DISCORD_BOT_TOKEN: discordToken }),
            { mode: 0o600 },
          );
          NODE

      - name: Prepare deployment secret file
        if: steps.rollout.outputs.needed == 'true'
        env:
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_FORECAST_BOT_TOKEN }}
          DISCORD_FORECAST_APPLICATION_ID: ${{ vars.DISCORD_FORECAST_APPLICATION_ID }}
          DISCORD_FORECAST_PUBLIC_KEY: ${{ vars.DISCORD_FORECAST_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          application="$RUNNER_TEMP/discord-bot-application.json"
          status=$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            --output "$application" --write-out "%{http_code}" \
            "https://discord.com/api/v10/oauth2/applications/@me")
          [[ "$status" == "200" ]] || {
            echo "Discord bot application lookup returned HTTP $status." >&2
            exit 1
          }
          node --input-type=module - "$application" "$RUNNER_TEMP/forecast-secrets.json" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const application = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (!/^\d{1,24}$/.test(application.id ?? "")) throw new Error("Discord application ID is invalid.");
          if (!/^[0-9a-f]{64}$/i.test(application.verify_key ?? "")) throw new Error("Discord public key is invalid.");
          if (application.id !== process.env.DISCORD_FORECAST_APPLICATION_ID) {
            throw new Error("Discord application ID does not match the repository variable.");
          }
          if (application.verify_key.toLowerCase() !== process.env.DISCORD_FORECAST_PUBLIC_KEY?.toLowerCase()) {
            throw new Error("Discord public key does not match the repository variable.");
          }
          writeFileSync(
            process.argv[3],
            JSON.stringify({
              ADMIN_TOKEN: process.env.FORECAST_COLLECTOR_ADMIN_TOKEN,
              DISCORD_APPLICATION_ID: application.id,
              DISCORD_PUBLIC_KEY: application.verify_key,
            }),
            { mode: 0o600 },
          );
          NODE

      - name: Probe GitHub App installation and fixed workflow
        if: steps.rollout.outputs.needed == 'true'
        env:
          FORECAST_GITHUB_APP_ID: ${{ vars.FORECAST_GITHUB_APP_ID }}
          FORECAST_GITHUB_APP_INSTALLATION_ID: ${{ vars.FORECAST_GITHUB_APP_INSTALLATION_ID }}
          FORECAST_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FORECAST_GITHUB_APP_PRIVATE_KEY }}
        run: npm run probe:forecast-github-app

      - name: Verify production dispatch D1 contract
        if: steps.rollout.outputs.needed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(npx wrangler d1 execute FORECAST_DB --remote --env="" \
            --config forecast-collector/wrangler.toml \
            --command "SELECT (SELECT COUNT(*) FROM schema_migrations WHERE version=9) AS migration, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('dispatcher_invocations','workflow_dispatches','forecast_ops_alerts','source_manual_reviews','discord_interaction_audit','canary_deployments','canary_runs')) AS tables, (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name IN ('collector_invocations_latest_idx','dispatcher_invocations_environment_latest_idx')) AS indexes;" \
            --json)
          [[ "$(jq -r '.[0].results[0].migration' <<<"$result")" == "1" ]]
          [[ "$(jq -r '.[0].results[0].tables' <<<"$result")" == "7" ]]
          [[ "$(jq -r '.[0].results[0].indexes' <<<"$result")" == "2" ]]

      - name: Deploy Router with production mutations disabled
        if: steps.rollout.outputs.needed == 'true'
        id: router_deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ needs.canary.outputs.deployment_sha }}
          DISCORD_FORECAST_GUILD_ID: ${{ vars.DISCORD_FORECAST_GUILD_ID }}
          DISCORD_FORECAST_APPROVER_USER_ID: ${{ vars.DISCORD_FORECAST_APPROVER_USER_ID }}
          DISCORD_FORECAST_APPROVAL_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_APPROVAL_CHANNEL_ID }}
          DISCORD_FORECAST_ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ALERT_CHANNEL_ID }}
          DISCORD_FORECAST_ACTIVITY_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ACTIVITY_CHANNEL_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/production-router-disabled-deploy.ndjson
        shell: bash
        run: |
          set -euo pipefail
          application="$RUNNER_TEMP/discord-bot-application.json"
          application_id=$(jq -r '.id' "$application")
          public_key=$(jq -r '.verify_key' "$application")
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --env="" --config forecast-interactions/wrangler.toml \
            --var DEPLOY_SHA:$DEPLOY_SHA \
            --var DISCORD_APPLICATION_ID:$application_id \
            --var DISCORD_PUBLIC_KEY:$public_key \
            --var DISCORD_GUILD_ID:$DISCORD_FORECAST_GUILD_ID \
            --var DISCORD_APPROVER_USER_ID:$DISCORD_FORECAST_APPROVER_USER_ID \
            --var DISCORD_APPROVAL_CHANNEL_ID:$DISCORD_FORECAST_APPROVAL_CHANNEL_ID \
            --var DISCORD_ALERT_CHANNEL_ID:$DISCORD_FORECAST_ALERT_CHANNEL_ID \
            --var DISCORD_ACTIVITY_CHANNEL_ID:$DISCORD_FORECAST_ACTIVITY_CHANNEL_ID \
            --var PRODUCTION_MUTATIONS_ENABLED:false \
            --tag "$DEPLOY_SHA-production-disabled" \
            --message "Forecast interaction Router production disabled $DEPLOY_SHA"
          version=$(node scripts/check-workflow-hardening.ts --deployment-version \
            "$WRANGLER_OUTPUT_FILE_PATH" collection-kit-forecast-interactions "")
          echo "version_id=$version" >> "$GITHUB_OUTPUT"

      - name: Verify Router production bindings
        if: steps.rollout.outputs.needed == 'true'
        env:
          FORECAST_EXPECTED_DEPLOY_SHA: ${{ needs.canary.outputs.deployment_sha }}
          FORECAST_INTERACTIONS_URL: ${{ vars.FORECAST_INTERACTIONS_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_VERSION: ${{ steps.router_deploy.outputs.version_id }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments status --env="" --config forecast-interactions/wrangler.toml \
            --json > "$RUNNER_TEMP/production-router-disabled-status.json"
          test "$(node scripts/check-workflow-hardening.ts --active-version "$RUNNER_TEMP/production-router-disabled-status.json")" = "$EXPECTED_VERSION"
          npm run smoke:forecast-interactions -- "$FORECAST_INTERACTIONS_URL"
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 20 \
            "$FORECAST_INTERACTIONS_URL/health" > "$RUNNER_TEMP/production-router-disabled-readiness.json"
          jq -e --arg sha "$FORECAST_EXPECTED_DEPLOY_SHA" \
            '.status == "ok" and .deploymentSha == $sha and .productionMutationsEnabled == false' \
            "$RUNNER_TEMP/production-router-disabled-readiness.json" >/dev/null
          node scripts/check-workflow-hardening.ts --sanitize-readiness \
            "$RUNNER_TEMP/production-router-disabled-readiness.json" > "$RUNNER_TEMP/production-router-disabled-readiness.evidence.json"

      - name: Deploy production dispatcher
        if: steps.rollout.outputs.needed == 'true'
        id: dispatcher_deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ needs.canary.outputs.deployment_sha }}
          FORECAST_GITHUB_APP_ID: ${{ vars.FORECAST_GITHUB_APP_ID }}
          FORECAST_GITHUB_APP_INSTALLATION_ID: ${{ vars.FORECAST_GITHUB_APP_INSTALLATION_ID }}
          DISCORD_FORECAST_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_CHANNEL_ID }}
          DISCORD_FORECAST_ACTIVITY_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ACTIVITY_CHANNEL_ID }}
          DISCORD_FORECAST_ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ALERT_CHANNEL_ID }}
          DISCORD_FORECAST_FALLBACK_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_FALLBACK_CHANNEL_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/production-dispatcher-disabled-deploy.ndjson
        shell: bash
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --env="" --config forecast-dispatcher/wrangler.toml \
            --secrets-file "$RUNNER_TEMP/forecast-dispatcher-secrets.json" \
            --var ENVIRONMENT:production --var DEPLOY_SHA:$DEPLOY_SHA \
            --var GITHUB_APP_ID:$FORECAST_GITHUB_APP_ID \
            --var GITHUB_APP_INSTALLATION_ID:$FORECAST_GITHUB_APP_INSTALLATION_ID \
            --var DISCORD_CHANNEL_ID:$DISCORD_FORECAST_CHANNEL_ID \
            --var DISCORD_ACTIVITY_CHANNEL_ID:$DISCORD_FORECAST_ACTIVITY_CHANNEL_ID \
            --var DISCORD_ALERT_CHANNEL_ID:$DISCORD_FORECAST_ALERT_CHANNEL_ID \
            --var DISCORD_FALLBACK_CHANNEL_ID:$DISCORD_FORECAST_FALLBACK_CHANNEL_ID \
            --var DISPATCH_ENABLED:false \
            --tag "$DEPLOY_SHA-disabled" --message "Forecast dispatcher production disabled $DEPLOY_SHA"
          version=$(node scripts/check-workflow-hardening.ts --deployment-version \
            "$WRANGLER_OUTPUT_FILE_PATH" collection-kit-forecast-dispatcher "")
          echo "version_id=$version" >> "$GITHUB_OUTPUT"
          npx wrangler deployments status --env="" --config forecast-dispatcher/wrangler.toml \
            --json > "$RUNNER_TEMP/production-dispatcher-disabled-status.json"
          test "$(node scripts/check-workflow-hardening.ts --active-version "$RUNNER_TEMP/production-dispatcher-disabled-status.json")" = "$version"
          npx wrangler versions view "$version" --env="" --config forecast-dispatcher/wrangler.toml \
            --json > "$RUNNER_TEMP/production-dispatcher-disabled-version.json"
          node scripts/check-workflow-hardening.ts --version-identity "$RUNNER_TEMP/production-dispatcher-disabled-version.json" "$version" \
            > "$RUNNER_TEMP/production-dispatcher-disabled-identity.json"
          jq -e --arg sha "$DEPLOY_SHA" \
            '.deploymentSha == $sha and .tag == ($sha + "-disabled") and .vars.DISPATCH_ENABLED == "false"' \
            "$RUNNER_TEMP/production-dispatcher-disabled-identity.json" >/dev/null
          node scripts/check-workflow-hardening.ts --sanitize-identity \
            "$RUNNER_TEMP/production-dispatcher-disabled-identity.json" > "$RUNNER_TEMP/production-dispatcher-disabled-identity.evidence.json"

      - name: Deploy production collector
        if: steps.rollout.outputs.needed == 'true'
        id: collector_deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ needs.canary.outputs.deployment_sha }}
          POLL_MODE: ${{ needs.canary.outputs.poll_mode }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/production-collector-deploy.ndjson
        shell: bash
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --env="" --config forecast-collector/wrangler.toml \
            --secrets-file "$RUNNER_TEMP/forecast-secrets.json" \
            --var ENVIRONMENT:production --var DEPLOY_SHA:$DEPLOY_SHA --var POLL_MODE:$POLL_MODE \
            --var COLLECT_ENABLED:true \
            --var DISCORD_INTERACTION_OWNER:router \
            --tag "$DEPLOY_SHA-$POLL_MODE" --message "Forecast collector production $DEPLOY_SHA ($POLL_MODE)"
          version=$(node scripts/check-workflow-hardening.ts --deployment-version \
            "$WRANGLER_OUTPUT_FILE_PATH" collection-kit-forecast-collector "")
          echo "version_id=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for production health readiness
        env:
          FORECAST_COLLECTOR_PRODUCTION_URL: ${{ vars.FORECAST_COLLECTOR_PRODUCTION_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
          FORECAST_EXPECTED_DEPLOY_SHA: ${{ needs.canary.outputs.deployment_sha }}
        run: |
          set -euo pipefail
          npm run smoke:forecast-collector -- "$FORECAST_COLLECTOR_PRODUCTION_URL" "$FORECAST_COLLECTOR_ADMIN_TOKEN" health-only
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 20 \
            -H "Authorization: Bearer $FORECAST_COLLECTOR_ADMIN_TOKEN" \
            "$FORECAST_COLLECTOR_PRODUCTION_URL/admin/canary-report" > "$RUNNER_TEMP/production-collector-readiness.json"
          jq -e --arg sha "$FORECAST_EXPECTED_DEPLOY_SHA" '.deploymentSha == $sha' \
            "$RUNNER_TEMP/production-collector-readiness.json" >/dev/null
          node scripts/check-workflow-hardening.ts --sanitize-readiness \
            "$RUNNER_TEMP/production-collector-readiness.json" > "$RUNNER_TEMP/production-collector-readiness.evidence.json"

      - name: Production round-trip smoke
        id: smoke
        env:
          FORECAST_COLLECTOR_PRODUCTION_URL: ${{ vars.FORECAST_COLLECTOR_PRODUCTION_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
          FORECAST_EXPECTED_DEPLOY_SHA: ${{ needs.canary.outputs.deployment_sha }}
        run: npm run smoke:forecast-collector -- "$FORECAST_COLLECTOR_PRODUCTION_URL" "$FORECAST_COLLECTOR_ADMIN_TOKEN"

      - name: Bootstrap recent Solo Raid ledger
        if: steps.smoke.outcome == 'success'
        id: bootstrap
        env:
          FORECAST_COLLECTOR_URL: ${{ vars.FORECAST_COLLECTOR_PRODUCTION_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
          FORECAST_BOOTSTRAP_SOLO_HISTORY: "true"
        run: npm run process:forecast-source-queue

      - name: Activate production dispatcher after collector readiness
        if: steps.rollout.outputs.needed == 'true' && steps.smoke.outcome == 'success' && steps.bootstrap.outcome == 'success'
        id: dispatcher_activate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ needs.canary.outputs.deployment_sha }}
          FORECAST_GITHUB_APP_ID: ${{ vars.FORECAST_GITHUB_APP_ID }}
          FORECAST_GITHUB_APP_INSTALLATION_ID: ${{ vars.FORECAST_GITHUB_APP_INSTALLATION_ID }}
          DISCORD_FORECAST_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_CHANNEL_ID }}
          DISCORD_FORECAST_ACTIVITY_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ACTIVITY_CHANNEL_ID }}
          DISCORD_FORECAST_ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ALERT_CHANNEL_ID }}
          DISCORD_FORECAST_FALLBACK_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_FALLBACK_CHANNEL_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/production-dispatcher-enabled-deploy.ndjson
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --env="" --config forecast-dispatcher/wrangler.toml \
            --secrets-file "$RUNNER_TEMP/forecast-dispatcher-secrets.json" \
            --var ENVIRONMENT:production --var DEPLOY_SHA:$DEPLOY_SHA \
            --var GITHUB_APP_ID:$FORECAST_GITHUB_APP_ID \
            --var GITHUB_APP_INSTALLATION_ID:$FORECAST_GITHUB_APP_INSTALLATION_ID \
            --var DISCORD_CHANNEL_ID:$DISCORD_FORECAST_CHANNEL_ID \
            --var DISCORD_ACTIVITY_CHANNEL_ID:$DISCORD_FORECAST_ACTIVITY_CHANNEL_ID \
            --var DISCORD_ALERT_CHANNEL_ID:$DISCORD_FORECAST_ALERT_CHANNEL_ID \
            --var DISCORD_FALLBACK_CHANNEL_ID:$DISCORD_FORECAST_FALLBACK_CHANNEL_ID \
            --var DISPATCH_ENABLED:true \
            --tag "$DEPLOY_SHA-enabled" --message "Forecast dispatcher production enabled $DEPLOY_SHA"
          version=$(node scripts/check-workflow-hardening.ts --deployment-version \
            "$WRANGLER_OUTPUT_FILE_PATH" collection-kit-forecast-dispatcher "")
          echo "version_id=$version" >> "$GITHUB_OUTPUT"

      - name: Enable production mutations in the Router
        if: steps.rollout.outputs.needed == 'true' && steps.smoke.outcome == 'success' && steps.bootstrap.outcome == 'success' && steps.dispatcher_activate.outcome == 'success'
        id: router_activate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ needs.canary.outputs.deployment_sha }}
          DISCORD_FORECAST_GUILD_ID: ${{ vars.DISCORD_FORECAST_GUILD_ID }}
          DISCORD_FORECAST_APPROVER_USER_ID: ${{ vars.DISCORD_FORECAST_APPROVER_USER_ID }}
          DISCORD_FORECAST_APPROVAL_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_APPROVAL_CHANNEL_ID }}
          DISCORD_FORECAST_ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ALERT_CHANNEL_ID }}
          DISCORD_FORECAST_ACTIVITY_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ACTIVITY_CHANNEL_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/production-router-enabled-deploy.ndjson
        shell: bash
        run: |
          set -euo pipefail
          application="$RUNNER_TEMP/discord-bot-application.json"
          application_id=$(jq -r '.id' "$application")
          public_key=$(jq -r '.verify_key' "$application")
          npx wrangler deploy --env="" --config forecast-interactions/wrangler.toml \
            --var DEPLOY_SHA:$DEPLOY_SHA \
            --var DISCORD_APPLICATION_ID:$application_id \
            --var DISCORD_PUBLIC_KEY:$public_key \
            --var DISCORD_GUILD_ID:$DISCORD_FORECAST_GUILD_ID \
            --var DISCORD_APPROVER_USER_ID:$DISCORD_FORECAST_APPROVER_USER_ID \
            --var DISCORD_APPROVAL_CHANNEL_ID:$DISCORD_FORECAST_APPROVAL_CHANNEL_ID \
            --var DISCORD_ALERT_CHANNEL_ID:$DISCORD_FORECAST_ALERT_CHANNEL_ID \
            --var DISCORD_ACTIVITY_CHANNEL_ID:$DISCORD_FORECAST_ACTIVITY_CHANNEL_ID \
            --var PRODUCTION_MUTATIONS_ENABLED:true \
            --tag "$DEPLOY_SHA-production-enabled" \
            --message "Forecast interaction Router production enabled $DEPLOY_SHA"
          version=$(node scripts/check-workflow-hardening.ts --deployment-version \
            "$WRANGLER_OUTPUT_FILE_PATH" collection-kit-forecast-interactions "")
          echo "version_id=$version" >> "$GITHUB_OUTPUT"
          FORECAST_EXPECTED_DEPLOY_SHA="$DEPLOY_SHA" \
            npm run smoke:forecast-interactions -- "${{ vars.FORECAST_INTERACTIONS_URL }}"

      - name: Verify final production deployment identities
        if: steps.rollout.outputs.needed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ needs.canary.outputs.deployment_sha }}
          POLL_MODE: ${{ needs.canary.outputs.poll_mode }}
          COLLECTOR_VERSION: ${{ steps.collector_deploy.outputs.version_id }}
          DISPATCHER_VERSION: ${{ steps.dispatcher_activate.outputs.version_id }}
          ROUTER_VERSION: ${{ steps.router_activate.outputs.version_id }}
          FORECAST_INTERACTIONS_URL: ${{ vars.FORECAST_INTERACTIONS_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for component in collector dispatcher router; do
            case "$component" in
              collector) config=forecast-collector/wrangler.toml; expected="$COLLECTOR_VERSION"; tag="$DEPLOY_SHA-$POLL_MODE"; control=COLLECT_ENABLED ;;
              dispatcher) config=forecast-dispatcher/wrangler.toml; expected="$DISPATCHER_VERSION"; tag="$DEPLOY_SHA-enabled"; control=DISPATCH_ENABLED ;;
              router) config=forecast-interactions/wrangler.toml; expected="$ROUTER_VERSION"; tag="$DEPLOY_SHA-production-enabled"; control=PRODUCTION_MUTATIONS_ENABLED ;;
            esac
            npx wrangler deployments status --env="" --config "$config" \
              --json > "$RUNNER_TEMP/production-$component-after.json"
            version=$(node scripts/check-workflow-hardening.ts --active-version "$RUNNER_TEMP/production-$component-after.json")
            test "$version" = "$expected"
            npx wrangler versions view "$version" --env="" --config "$config" \
              --json > "$RUNNER_TEMP/production-$component-version-after.json"
            node scripts/check-workflow-hardening.ts --version-identity "$RUNNER_TEMP/production-$component-version-after.json" "$version" \
              > "$RUNNER_TEMP/production-$component-identity-after.json"
            jq -e --arg sha "$DEPLOY_SHA" --arg tag "$tag" --arg control "$control" \
              '.deploymentSha == $sha and .tag == $tag and .vars[$control] == "true"' \
              "$RUNNER_TEMP/production-$component-identity-after.json" >/dev/null
            node scripts/check-workflow-hardening.ts --sanitize-identity \
              "$RUNNER_TEMP/production-$component-identity-after.json" > "$RUNNER_TEMP/production-$component-identity-after.evidence.json"
          done
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 20 \
            "$FORECAST_INTERACTIONS_URL/health" > "$RUNNER_TEMP/production-router-readiness.json"
          jq -e --arg sha "$DEPLOY_SHA" \
            '.status == "ok" and .deploymentSha == $sha and .productionMutationsEnabled == true' \
            "$RUNNER_TEMP/production-router-readiness.json" >/dev/null
          node scripts/check-workflow-hardening.ts --sanitize-readiness \
            "$RUNNER_TEMP/production-router-readiness.json" > "$RUNNER_TEMP/production-router-readiness.evidence.json"

      - name: Verify proposal workflow targets production collector
        if: steps.smoke.outcome == 'success' && steps.bootstrap.outcome == 'success' && steps.dispatcher_activate.outcome != 'failure' && steps.router_activate.outcome != 'failure'
        env:
          FORECAST_COLLECTOR_URL: ${{ vars.FORECAST_COLLECTOR_URL }}
          FORECAST_COLLECTOR_PRODUCTION_URL: ${{ vars.FORECAST_COLLECTOR_PRODUCTION_URL }}
        run: |
          test -n "$FORECAST_COLLECTOR_URL" || {
            echo "Missing administrator-managed FORECAST_COLLECTOR_URL repository variable." >&2
            exit 1
          }
          test "$FORECAST_COLLECTOR_URL" = "$FORECAST_COLLECTOR_PRODUCTION_URL" || {
            echo "FORECAST_COLLECTOR_URL does not match the verified production collector URL." >&2
            exit 1
          }

      - name: Write exact certified promotion identities to step summary
        env:
          CERTIFIED_SHA: ${{ needs.canary.outputs.deployment_sha }}
          CANARY_ID: ${{ needs.canary.outputs.canary_id }}
          POLL_MODE: ${{ needs.canary.outputs.poll_mode }}
          CANARY_COLLECTOR_VERSION: ${{ needs.canary.outputs.collector_version_id }}
          CANARY_DISPATCHER_VERSION: ${{ needs.canary.outputs.dispatcher_version_id }}
          STARTED_AT: ${{ needs.canary.outputs.started_at }}
          ENDS_AT: ${{ needs.canary.outputs.ends_at }}
          COLLECTOR_VERSION: ${{ steps.collector_deploy.outputs.version_id || steps.prior.outputs.collector_version }}
          DISPATCHER_VERSION: ${{ steps.dispatcher_activate.outputs.version_id || steps.prior.outputs.dispatcher_version }}
          ROUTER_VERSION: ${{ steps.router_activate.outputs.version_id || steps.prior.outputs.router_version }}
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/production-summary-identity.json" <<'NODE'
          import { writeFileSync } from "node:fs";
          const env = process.env;
          writeFileSync(process.argv[2], JSON.stringify({
            deploymentSha:env.CERTIFIED_SHA,canaryId:env.CANARY_ID,pollMode:env.POLL_MODE,
            collectorVersionId:env.CANARY_COLLECTOR_VERSION,dispatcherVersionId:env.CANARY_DISPATCHER_VERSION,
            startedAt:env.STARTED_AT,endsAt:env.ENDS_AT,
            productionVersions:{collector:env.COLLECTOR_VERSION,dispatcher:env.DISPATCHER_VERSION,router:env.ROUTER_VERSION}
          }));
          NODE
          node scripts/check-workflow-hardening.ts --sanitize-canary \
            "$RUNNER_TEMP/production-summary-identity.json" > "$RUNNER_TEMP/production-certified-canary-identity.evidence.json"
          node scripts/check-workflow-hardening.ts --identity-summary \
            "$RUNNER_TEMP/production-summary-identity.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Mark production operational verification complete
        id: operational_verification
        run: echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Project privacy-safe production preflight quota evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/d1-budget-production-preflight.json"
          if [[ -f "$source" ]]; then
            node scripts/check-workflow-hardening.ts --retain-evidence "$source" quota \
              > "$RUNNER_TEMP/d1-budget-production-preflight.evidence.pending"
            mv "$RUNNER_TEMP/d1-budget-production-preflight.evidence.pending" \
              "$RUNNER_TEMP/d1-budget-production-preflight.evidence.json"
          fi

      - name: Retain successful rollout evidence before leaving the restore boundary
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forecast-production-rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-*-identity-before.evidence.json
            ${{ runner.temp }}/production-*-identity-after.evidence.json
            ${{ runner.temp }}/production-dispatcher-disabled-identity.evidence.json
            ${{ runner.temp }}/production-*-readiness.evidence.json
            ${{ runner.temp }}/production-certified-canary-identity.evidence.json
            ${{ runner.temp }}/d1-budget-production-preflight.evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Restore production Router after any rollout failure
        if: always() && (failure() || cancelled()) && steps.operational_verification.outputs.verified != 'true' && steps.router_deploy.outputs.attempted == 'true'
        id: router_restore
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIOUS_VERSION: ${{ steps.prior.outputs.router_version }}
          FORECAST_EXPECTED_DEPLOY_SHA: ${{ steps.prior.outputs.router_sha }}
          FORECAST_INTERACTIONS_URL: ${{ vars.FORECAST_INTERACTIONS_URL }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/production-router-restore.ndjson
        shell: bash
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler versions deploy "$PREVIOUS_VERSION@100%" --yes --env="" \
            --config forecast-interactions/wrangler.toml --message "Restore Router after forecast rollout failure"
          npx wrangler deployments status --env="" --config forecast-interactions/wrangler.toml \
            --json > "$RUNNER_TEMP/production-router-restored.json"
          test "$(node scripts/check-workflow-hardening.ts --active-version "$RUNNER_TEMP/production-router-restored.json")" = "$PREVIOUS_VERSION"
          node scripts/check-workflow-hardening.ts --sanitize-identity \
            "$RUNNER_TEMP/production-router-identity-before.json" > "$RUNNER_TEMP/production-router-restored.evidence.json"
          npm run smoke:forecast-interactions -- "$FORECAST_INTERACTIONS_URL"
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 20 \
            "$FORECAST_INTERACTIONS_URL/health" > "$RUNNER_TEMP/production-router-restored-health.json"
          jq -e --arg sha "$FORECAST_EXPECTED_DEPLOY_SHA" \
            --slurpfile prior "$RUNNER_TEMP/production-router-identity-before.json" \
            '.status == "ok" and .deploymentSha == $sha and
             .productionMutationsEnabled == ($prior[0].vars.PRODUCTION_MUTATIONS_ENABLED == "true")' \
            "$RUNNER_TEMP/production-router-restored-health.json" >/dev/null
          node scripts/check-workflow-hardening.ts --sanitize-readiness \
            "$RUNNER_TEMP/production-router-restored-health.json" > "$RUNNER_TEMP/production-router-restored-health.evidence.json"

      - name: Restore production Collector after any rollout failure
        if: always() && (failure() || cancelled()) && steps.operational_verification.outputs.verified != 'true' && steps.collector_deploy.outputs.attempted == 'true'
        id: collector_restore
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIOUS_VERSION: ${{ steps.prior.outputs.collector_version }}
          FORECAST_EXPECTED_DEPLOY_SHA: ${{ steps.prior.outputs.collector_sha }}
          FORECAST_COLLECTOR_PRODUCTION_URL: ${{ vars.FORECAST_COLLECTOR_PRODUCTION_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/production-collector-restore.ndjson
        shell: bash
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler versions deploy "$PREVIOUS_VERSION@100%" --yes --env="" \
            --config forecast-collector/wrangler.toml --message "Restore collector after forecast rollout failure"
          npx wrangler deployments status --env="" --config forecast-collector/wrangler.toml \
            --json > "$RUNNER_TEMP/production-collector-restored.json"
          test "$(node scripts/check-workflow-hardening.ts --active-version "$RUNNER_TEMP/production-collector-restored.json")" = "$PREVIOUS_VERSION"
          node scripts/check-workflow-hardening.ts --sanitize-identity \
            "$RUNNER_TEMP/production-collector-identity-before.json" > "$RUNNER_TEMP/production-collector-restored.evidence.json"
          npm run smoke:forecast-collector -- "$FORECAST_COLLECTOR_PRODUCTION_URL" "$FORECAST_COLLECTOR_ADMIN_TOKEN" health-only

      - name: Restore production Dispatcher after any rollout failure
        if: always() && (failure() || cancelled()) && steps.operational_verification.outputs.verified != 'true' && steps.dispatcher_deploy.outputs.attempted == 'true'
        id: dispatcher_restore
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIOUS_VERSION: ${{ steps.prior.outputs.dispatcher_version }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/production-dispatcher-restore.ndjson
        shell: bash
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler versions deploy "$PREVIOUS_VERSION@100%" --yes --env="" \
            --config forecast-dispatcher/wrangler.toml --message "Restore dispatcher after forecast rollout failure"
          npx wrangler deployments status --env="" --config forecast-dispatcher/wrangler.toml \
            --json > "$RUNNER_TEMP/production-dispatcher-restored.json"
          test "$(node scripts/check-workflow-hardening.ts --active-version "$RUNNER_TEMP/production-dispatcher-restored.json")" = "$PREVIOUS_VERSION"
          node scripts/check-workflow-hardening.ts --sanitize-identity \
            "$RUNNER_TEMP/production-dispatcher-identity-before.json" > "$RUNNER_TEMP/production-dispatcher-restored.evidence.json"

      - name: Record production rollout and restore dispositions
        if: always() && (failure() || cancelled())
        env:
          CERTIFIED_SHA: ${{ needs.canary.outputs.deployment_sha }}
          CANARY_ID: ${{ needs.canary.outputs.canary_id }}
          PRIOR_OUTCOME: ${{ steps.prior.outcome }}
          COLLECTOR_DEPLOY: ${{ steps.collector_deploy.outcome }}
          DISPATCHER_DEPLOY: ${{ steps.dispatcher_deploy.outcome }}
          ROUTER_DEPLOY: ${{ steps.router_deploy.outcome }}
          COLLECTOR_RESTORE: ${{ steps.collector_restore.outcome }}
          DISPATCHER_RESTORE: ${{ steps.dispatcher_restore.outcome }}
          ROUTER_RESTORE: ${{ steps.router_restore.outcome }}
        run: |
          node --input-type=module - "$RUNNER_TEMP/production-rollout-dispositions.json" <<'NODE'
          import { writeFileSync } from "node:fs";
          const names = [
            "CERTIFIED_SHA", "CANARY_ID", "PRIOR_OUTCOME", "COLLECTOR_DEPLOY", "DISPATCHER_DEPLOY",
            "ROUTER_DEPLOY", "COLLECTOR_RESTORE", "DISPATCHER_RESTORE", "ROUTER_RESTORE",
          ];
          writeFileSync(process.argv[2], JSON.stringify(Object.fromEntries(
            names.map(name => [name, process.env[name] ?? ""]),
          ), null, 2) + "\n");
          NODE

      - name: Retain production rollout and independent restore evidence
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forecast-production-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-*-identity-before.evidence.json
            ${{ runner.temp }}/production-*-identity-after.evidence.json
            ${{ runner.temp }}/production-dispatcher-disabled-identity.evidence.json
            ${{ runner.temp }}/production-*-restored.evidence.json
            ${{ runner.temp }}/production-*-readiness.evidence.json
            ${{ runner.temp }}/production-router-restored-health.evidence.json
            ${{ runner.temp }}/production-certified-canary-identity.evidence.json
            ${{ runner.temp }}/production-rollout-dispositions.json
            ${{ runner.temp }}/d1-budget-production-preflight.evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail after independent restore attempts
        if: always() && (failure() || cancelled())
        run: exit 1

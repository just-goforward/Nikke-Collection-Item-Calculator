name: Promote Forecast Collector

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: forecast-collector-production
  cancel-in-progress: false

jobs:
  canary:
    if: vars.FORECAST_COLLECTOR_STAGING_URL != ''
    runs-on: ubuntu-latest
    outputs:
      canary_passed: ${{ steps.canary.outputs.canary_passed }}
      deployment_sha: ${{ steps.canary.outputs.deployment_sha }}
      x_enabled: ${{ steps.canary.outputs.x_enabled }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read authenticated 24-hour canary report
        id: canary
        env:
          FORECAST_COLLECTOR_URL: ${{ vars.FORECAST_COLLECTOR_STAGING_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
        run: npm run check:forecast-canary

      - name: Verify the canary belongs to current main
        if: steps.canary.outputs.canary_passed == 'true'
        env:
          CANARY_SHA: ${{ steps.canary.outputs.deployment_sha }}
        shell: bash
        run: |
          test "$CANARY_SHA" = "$(git rev-parse HEAD)" || {
            echo "Staging canary belongs to $CANARY_SHA, not current main." >&2
            exit 1
          }

      - name: Canary pending summary
        if: steps.canary.outputs.canary_passed != 'true'
        run: |
          echo "24-hour forecast collector canary is not yet eligible or has not passed." >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: canary
    if: needs.canary.outputs.canary_passed == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
          FORECAST_COLLECTOR_PRODUCTION_URL: ${{ vars.FORECAST_COLLECTOR_PRODUCTION_URL }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN" && \
          test -n "$FORECAST_COLLECTOR_ADMIN_TOKEN" && test -n "$FORECAST_COLLECTOR_PRODUCTION_URL"

      - name: Check whether this commit is already deployed
        id: deployed
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ needs.canary.outputs.deployment_sha }}
        shell: bash
        run: |
          npx wrangler versions list --env="" --config forecast-collector/wrangler.toml --json > "$RUNNER_TEMP/forecast-versions.json"
          if node -e 'const rows=require(process.argv[1]);process.exit(rows.some(x=>x.annotations?.["workers/tag"]===process.argv[2])?0:1)' "$RUNNER_TEMP/forecast-versions.json" "$DEPLOY_SHA"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare deployment secret file
        if: steps.deployed.outputs.needed == 'true'
        env:
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
        run: >-
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP+"/forecast-secrets.json",JSON.stringify({ADMIN_TOKEN:process.env.FORECAST_COLLECTOR_ADMIN_TOKEN}))'

      - name: Capture production version
        if: steps.deployed.outputs.needed == 'true'
        id: previous
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          npx wrangler deployments status --env="" --config forecast-collector/wrangler.toml --json > "$RUNNER_TEMP/forecast-before.json"
          version=$(node -e 'const x=require(process.argv[1]);process.stdout.write(x.versions?.find(v=>v.percentage===100)?.version_id??"")' "$RUNNER_TEMP/forecast-before.json")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy production collector
        if: steps.deployed.outputs.needed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ needs.canary.outputs.deployment_sha }}
          X_ENABLED: ${{ needs.canary.outputs.x_enabled }}
        run: >-
          npx wrangler deploy --env="" --config forecast-collector/wrangler.toml
          --secrets-file "$RUNNER_TEMP/forecast-secrets.json"
          --var ENVIRONMENT:production --var DEPLOY_SHA:$DEPLOY_SHA --var X_AUTOMATION_ENABLED:$X_ENABLED
          --tag "$DEPLOY_SHA" --message "Forecast collector production $DEPLOY_SHA"

      - name: Production round-trip smoke
        if: steps.deployed.outputs.needed == 'true'
        id: smoke
        continue-on-error: true
        env:
          FORECAST_COLLECTOR_PRODUCTION_URL: ${{ vars.FORECAST_COLLECTOR_PRODUCTION_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
          FORECAST_EXPECTED_DEPLOY_SHA: ${{ needs.canary.outputs.deployment_sha }}
        run: npm run smoke:forecast-collector -- "$FORECAST_COLLECTOR_PRODUCTION_URL" "$FORECAST_COLLECTOR_ADMIN_TOKEN"

      - name: Restore production after smoke failure
        if: steps.smoke.outcome == 'failure' && steps.previous.outputs.version != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: >-
          npx wrangler versions deploy "$PREVIOUS_VERSION@100%" --yes --env=""
          --config forecast-collector/wrangler.toml --message "Restore after forecast smoke failure"

      - name: Fail after restore
        if: steps.smoke.outcome == 'failure'
        run: exit 1

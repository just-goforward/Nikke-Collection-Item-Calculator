name: Deploy Cloudflare Worker

on:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STATS_ALLOWED_ORIGIN: ${{ vars.STATS_ALLOWED_ORIGIN }}
  STAGING_WORKER_URL: ${{ vars.CLOUDFLARE_STAGING_WORKER_URL }}

concurrency:
  group: cloudflare-worker-staging
  cancel-in-progress: false

jobs:
  staging:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      deploy_sha: ${{ steps.commit.outputs.deploy_sha }}
      should_deploy: ${{ steps.changes.outputs.should_deploy }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Verify Pages-tested commit is current
        id: commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          deploy_sha=$(git rev-parse HEAD)

          if [[ ! "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Trusted checkout did not resolve to a full commit SHA." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Trigger did not provide a valid commit SHA." >&2
            exit 1
          fi

          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          if [[ "$deploy_sha" != "$EXPECTED_SHA" ]]; then
            echo "main advanced from Pages-tested commit $EXPECTED_SHA to $deploy_sha; skipping this stale deployment."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "current=true" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_SHA=$deploy_sha" >> "$GITHUB_ENV"

      - name: Setup Node
        if: steps.commit.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Validate deployment configuration
        if: steps.commit.outputs.current == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret." >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID variable." >&2; exit 1; }
          test -n "$STATS_ALLOWED_ORIGIN" || { echo "Missing STATS_ALLOWED_ORIGIN variable." >&2; exit 1; }
          test -n "$STAGING_WORKER_URL" || { echo "Missing CLOUDFLARE_STAGING_WORKER_URL variable." >&2; exit 1; }

      - name: Prepare npm 12.2.0 with pinned integrity
        if: steps.commit.outputs.current == 'true'
        shell: bash
        timeout-minutes: 5
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-bootstrap-cache
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { existsSync, mkdtempSync, writeFileSync, appendFileSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { setTimeout as delay } from 'node:timers/promises';
          const version = '12.2.0';
          const url = 'https://registry.npmjs.org/npm/-/npm-12.2.0.tgz';
          const sri = 'sha512-ZsJjKpTnlmSXOLLXiU1xDCzC4Wlok4IwZmh/aw2KUuXytU7q6qMv/cUT7MoeSf95Slwuw/lRXYefGzGCspHPNQ==';
          if (process.version !== 'v24.21.0') throw new Error('Unexpected Node version');
          if (!process.env.RUNNER_TEMP || !process.env.GITHUB_PATH || !process.env.NPM_CONFIG_CACHE) throw new Error('Missing runner paths');
          const nodeDir = dirname(process.execPath);
          const sourceCli = [join(nodeDir, 'node_modules/npm/bin/npm-cli.js'), resolve(nodeDir, '../lib/node_modules/npm/bin/npm-cli.js')].find(existsSync);
          if (!sourceCli) throw new Error('Bundled npm CLI not found');
          const cleanEnv = Object.fromEntries(['PATH', 'HOME', 'USERPROFILE', 'SYSTEMROOT', 'WINDIR', 'COMSPEC', 'PATHEXT', 'TEMP', 'TMP', 'TMPDIR', 'APPDATA', 'LOCALAPPDATA'].filter(k => process.env[k] !== undefined).map(k => [k, process.env[k]]));
          const root = mkdtempSync(join(process.env.RUNNER_TEMP, 'npm-12.2.0-'));
          const prefix = join(root, 'prefix');
          const userConfig = join(root, 'user.npmrc');
          const globalConfig = join(root, 'global.npmrc');
          writeFileSync(userConfig, '', { flag: 'wx' });
          writeFileSync(globalConfig, '', { flag: 'wx' });
          const cacheKey = `npm-${version}-${process.platform}-${process.arch}-${Buffer.from(sri.slice(7), 'base64').toString('hex')}`;
          const cache = join(process.env.NPM_CONFIG_CACHE, cacheKey);
          let bytes;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(30000) });
              if (!response.ok) {
                const error = new Error(`npm tarball HTTP ${response.status}`);
                error.terminal = response.status < 500 && response.status !== 408 && response.status !== 429;
                throw error;
              }
              const chunks = []; let size = 0;
              for await (const chunk of response.body) {
                size += chunk.length;
                if (size > 8 * 1024 * 1024) throw Object.assign(new Error('npm tarball size limit exceeded'), { terminal: true });
                chunks.push(chunk);
              }
              bytes = Buffer.concat(chunks); break;
            } catch (error) {
              if (error.terminal || attempt === 2) throw error;
              await delay(1000 * (attempt + 1));
            }
          }
          if ('sha512-' + createHash('sha512').update(bytes).digest('base64') !== sri) throw new Error('npm tarball integrity mismatch');
          const tgz = join(root, 'npm-12.2.0.tgz');
          writeFileSync(tgz, bytes, { flag: 'wx' });
          const options = { cwd: root, env: cleanEnv, timeout: 120000 };
          execFileSync(process.execPath, [sourceCli, 'install', '--global', '--prefix', prefix, tgz, '--offline', '--ignore-scripts', '--no-audit', '--no-fund', '--no-update-notifier', '--cache', cache, '--userconfig', userConfig, '--globalconfig', globalConfig], { ...options, stdio: 'inherit' });
          const windows = process.platform === 'win32';
          const targetCli = join(prefix, windows ? 'node_modules' : 'lib/node_modules', 'npm/bin/npm-cli.js');
          if (execFileSync(process.execPath, [targetCli, '--version', '--no-update-notifier', '--userconfig', userConfig, '--globalconfig', globalConfig], options).toString().trim() !== version) throw new Error('Installed npm version mismatch');
          appendFileSync(process.env.GITHUB_PATH, (windows ? prefix : join(prefix, 'bin')) + '\n');
          console.log(`Prepared npm ${version}; platform=${process.platform}; integrity verified`);
          NODE

      - name: Install dependencies
        if: steps.commit.outputs.current == 'true'
        run: npm ci

      - name: Detect Worker-relevant changes
        if: steps.commit.outputs.current == 'true'
        id: changes
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npx wrangler deployments status --env staging --config cloudflare/wrangler.toml --json > "$RUNNER_TEMP/staging-deployment.json"
          npx wrangler versions list --env staging --config cloudflare/wrangler.toml --json > "$RUNNER_TEMP/staging-versions.json"
          base_sha=$(node -e '
            const fs = require("node:fs");
            const deployment = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const versions = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const activeId = deployment.versions?.find((item) => item.percentage === 100)?.version_id;
            const row = versions.find((item) => item.id === activeId);
            process.stdout.write(/^[0-9a-f]{40}$/.test(row?.annotations?.["workers/tag"] ?? "") ? row.annotations["workers/tag"] : "");
          ' "$RUNNER_TEMP/staging-deployment.json" "$RUNNER_TEMP/staging-versions.json")

          if [[ -z "$base_sha" ]]; then
            echo "No commit-tagged active staging deployment was found; deploying a new baseline."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_sql < <(
            git diff --name-only "$base_sha" "$DEPLOY_SHA" -- \
              'cloudflare/*.sql' \
              ':(exclude)cloudflare/reset-staging.sql'
          )
          if (( ${#changed_sql[@]} > 0 )); then
            game_day_v9_changed=false
            solver_observability_v10_changed=false
            for path in "${changed_sql[@]}"; do
              case "$path" in
                cloudflare/add-game-day-statistics-v9.sql)
                  game_day_v9_changed=true
                  ;;
                cloudflare/add-solver-observability-v10.sql)
                  solver_observability_v10_changed=true
                  ;;
                cloudflare/schema.sql)
                  ;;
                *)
                  echo "Unsupported automatic D1 migration file: $path" >&2
                  exit 1
                  ;;
              esac
            done
            if [[ "$game_day_v9_changed" != "true" && "$solver_observability_v10_changed" != "true" ]]; then
              echo "D1 SQL changed without an allowlisted additive migration." >&2
              exit 1
            fi
          fi

          if git diff --quiet "$base_sha" "$DEPLOY_SHA" -- \
            cloudflare/src \
            'cloudflare/*.sql' \
            ':(exclude)cloudflare/reset-staging.sql' \
            cloudflare/tsconfig.json \
            cloudflare/package.json \
            cloudflare/worker-configuration.d.ts \
            cloudflare/wrangler.toml \
            shared \
            package.json \
            package-lock.json \
            cloudflare/vitest.config.ts \
            .github/workflows/worker-deploy.yml \
            .github/workflows/worker-promote.yml \
            scripts/check-d1-schema.ts \
            scripts/stats-worker-health.ts \
            scripts/smoke-stats-worker.ts; then
            echo "No Worker-relevant changes since $base_sha."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Worker-relevant changes found since $base_sha."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Worker types
        if: steps.commit.outputs.current == 'true' && steps.changes.outputs.should_deploy == 'true'
        run: npm run worker:types:check

      - name: Test Worker D1 integration
        if: steps.commit.outputs.current == 'true' && steps.changes.outputs.should_deploy == 'true'
        run: npm run test:worker

      - name: Verify Paid quota guard before staging D1 access
        if: steps.commit.outputs.current == 'true' && steps.changes.outputs.should_deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_D1_ANALYTICS_TOKEN }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
          CLOUDFLARE_USAGE_GUARD_URL: ${{ vars.CLOUDFLARE_USAGE_GUARD_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_USAGE_GUARD_URL" =~ ^https://[^/]+$ ]] || {
            echo "Missing or invalid CLOUDFLARE_USAGE_GUARD_URL variable." >&2
            exit 1
          }
          npm run check:d1-budget -- preflight --output "$RUNNER_TEMP/stats-staging-paid-preflight.json"
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 20 \
            "$CLOUDFLARE_USAGE_GUARD_URL/health" > "$RUNNER_TEMP/usage-guard-health.json"
          jq -e '.ok == true and .state.action == "normal"' "$RUNNER_TEMP/usage-guard-health.json" >/dev/null

      - name: Ensure staging D1 schema
        if: steps.commit.outputs.current == 'true' && steps.changes.outputs.should_deploy == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if npm run check:d1-schema -- collection-kit-stats-staging staging; then
            echo "Staging D1 schema already satisfies the current contract."
          else
            echo "Applying additive statistics migrations to staging D1."
            npx wrangler d1 execute collection-kit-stats-staging \
              --remote \
              --env staging \
              --config cloudflare/wrangler.toml \
              --file cloudflare/add-game-day-statistics-v9.sql \
              --yes
            npx wrangler d1 execute collection-kit-stats-staging \
              --remote \
              --env staging \
              --config cloudflare/wrangler.toml \
              --file cloudflare/add-solver-observability-v10.sql \
              --yes
            npm run check:d1-schema -- collection-kit-stats-staging staging
          fi

      - name: Validate staging bundle
        if: steps.commit.outputs.current == 'true' && steps.changes.outputs.should_deploy == 'true'
        run: npx wrangler deploy --dry-run --env staging --config cloudflare/wrangler.toml

      - name: Capture current staging version
        if: steps.commit.outputs.current == 'true' && steps.changes.outputs.should_deploy == 'true'
        id: staging_previous
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deployments status --env staging --config cloudflare/wrangler.toml --json > "$RUNNER_TEMP/staging-before.json"
          version_id=$(node -e '
            const fs = require("node:fs");
            const deployment = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            process.stdout.write(deployment.versions?.find((item) => item.percentage === 100)?.version_id ?? "");
          ' "$RUNNER_TEMP/staging-before.json")
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Deploy staging Worker
        if: steps.commit.outputs.current == 'true' && steps.changes.outputs.should_deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler deploy --env staging --config cloudflare/wrangler.toml
          --var "ALLOWED_ORIGINS:$STATS_ALLOWED_ORIGIN"
          --var "DEPLOYMENT_SHA:$DEPLOY_SHA"
          --tag "$DEPLOY_SHA" --message "GitHub $DEPLOY_SHA"

      - name: Smoke test staging Worker
        if: steps.commit.outputs.current == 'true' && steps.changes.outputs.should_deploy == 'true'
        id: staging_smoke
        continue-on-error: true
        run: npm run smoke:stats-worker -- "$STAGING_WORKER_URL" "$STATS_ALLOWED_ORIGIN"

      - name: Restore staging after smoke failure
        if: steps.staging_smoke.outcome == 'failure' && steps.staging_previous.outputs.version_id != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIOUS_VERSION_ID: ${{ steps.staging_previous.outputs.version_id }}
        run: >-
          npx wrangler versions deploy "$PREVIOUS_VERSION_ID@100%"
          --yes --env staging --config cloudflare/wrangler.toml
          --message "Automatic restore after staging smoke failure"

      - name: Fail staging deployment after restore
        if: steps.staging_smoke.outcome == 'failure'
        run: |
          echo "Staging smoke failed; the previous version was restored when available." >&2
          exit 1

      - name: Record staging deployment
        if: steps.commit.outputs.current == 'true' && steps.changes.outputs.should_deploy == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler versions list --env staging --config cloudflare/wrangler.toml --json > "$RUNNER_TEMP/staging-versions.json"
          version_id=$(node -e 'const fs=require("node:fs");const rows=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(rows.at(-1)?.id??"unknown")' "$RUNNER_TEMP/staging-versions.json")
          {
            echo "### Cloudflare staging"
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Version: \`$version_id\`"
            echo "- URL: $STAGING_WORKER_URL"
            echo "- Smoke: passed"
          } >> "$GITHUB_STEP_SUMMARY"

name: Deploy Cloudflare Worker

on:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STATS_ALLOWED_ORIGIN: ${{ vars.STATS_ALLOWED_ORIGIN }}
  STAGING_WORKER_URL: ${{ vars.CLOUDFLARE_STAGING_WORKER_URL }}
  PRODUCTION_WORKER_URL: ${{ vars.CLOUDFLARE_PRODUCTION_WORKER_URL }}

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  staging:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.commit.outputs.deploy_sha }}
      should_deploy: ${{ steps.changes.outputs.should_deploy }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Verify Pages-tested commit is current
        id: commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          deploy_sha=$(git rev-parse HEAD)

          if [[ ! "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Trusted checkout did not resolve to a full commit SHA." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Trigger did not provide a valid commit SHA." >&2
            exit 1
          fi

          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          if [[ "$deploy_sha" != "$EXPECTED_SHA" ]]; then
            echo "main advanced from Pages-tested commit $EXPECTED_SHA to $deploy_sha; skipping this stale deployment."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "current=true" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_SHA=$deploy_sha" >> "$GITHUB_ENV"

      - name: Setup Node
        if: steps.commit.outputs.current == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate deployment configuration
        if: steps.commit.outputs.current == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret." >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID variable." >&2; exit 1; }
          test -n "$STATS_ALLOWED_ORIGIN" || { echo "Missing STATS_ALLOWED_ORIGIN variable." >&2; exit 1; }
          test -n "$STAGING_WORKER_URL" || { echo "Missing CLOUDFLARE_STAGING_WORKER_URL variable." >&2; exit 1; }

      - name: Install dependencies
        if: steps.commit.outputs.current == 'true'
        run: npm ci

      - name: Detect Worker-relevant changes
        if: steps.commit.outputs.current == 'true'
        id: changes
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npx wrangler versions list --env="" --config cloudflare/wrangler.toml --json > "$RUNNER_TEMP/production-versions.json"
          base_sha=$(node -e '
            const fs = require("node:fs");
            const rows = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const row = rows.toReversed().find((item) => /^[0-9a-f]{40}$/.test(item.annotations?.["workers/tag"] ?? ""));
            process.stdout.write(row?.annotations?.["workers/tag"] ?? "");
          ' "$RUNNER_TEMP/production-versions.json")

          if [[ -z "$base_sha" ]]; then
            echo "No commit-tagged production deployment was found; deploying a new baseline."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff --quiet "$base_sha" "$DEPLOY_SHA" -- 'cloudflare/*.sql'; then
            echo "D1 SQL changed. Apply migrations explicitly, then use workflow_dispatch." >&2
            exit 1
          fi

          if git diff --quiet "$base_sha" "$DEPLOY_SHA" -- \
            cloudflare/src \
            cloudflare/tsconfig.json \
            cloudflare/worker-configuration.d.ts \
            cloudflare/wrangler.toml \
            shared \
            package.json \
            package-lock.json \
            vitest.cloudflare.config.ts \
            .github/workflows/worker-deploy.yml \
            scripts/smoke-stats-worker.ts; then
            echo "No Worker-relevant changes since $base_sha."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Worker-relevant changes found since $base_sha."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Worker types
        if: steps.commit.outputs.current == 'true' && steps.changes.outputs.should_deploy == 'true'
        run: npm run worker:types:check

      - name: Test Worker D1 integration
        if: steps.commit.outputs.current == 'true' && steps.changes.outputs.should_deploy == 'true'
        run: npm run test:worker

      - name: Validate staging bundle
        if: steps.commit.outputs.current == 'true' && steps.changes.outputs.should_deploy == 'true'
        run: npx wrangler deploy --dry-run --env staging --config cloudflare/wrangler.toml

      - name: Deploy staging Worker
        if: steps.commit.outputs.current == 'true' && steps.changes.outputs.should_deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler deploy --env staging --config cloudflare/wrangler.toml
          --tag "$DEPLOY_SHA" --message "GitHub $DEPLOY_SHA"

      - name: Smoke test staging Worker
        if: steps.commit.outputs.current == 'true' && steps.changes.outputs.should_deploy == 'true'
        run: npm run smoke:stats-worker -- "$STAGING_WORKER_URL" "$STATS_ALLOWED_ORIGIN"

      - name: Record staging deployment
        if: steps.commit.outputs.current == 'true' && steps.changes.outputs.should_deploy == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler versions list --env staging --config cloudflare/wrangler.toml --json > "$RUNNER_TEMP/staging-versions.json"
          version_id=$(node -e 'const fs=require("node:fs");const rows=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(rows.at(-1)?.id??"unknown")' "$RUNNER_TEMP/staging-versions.json")
          {
            echo "### Cloudflare staging"
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Version: \`$version_id\`"
            echo "- URL: $STAGING_WORKER_URL"
            echo "- Smoke: passed"
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    needs: staging
    if: needs.staging.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: ${{ vars.CLOUDFLARE_PRODUCTION_WORKER_URL }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main

      - name: Verify staged commit is still current
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.staging.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          deploy_sha=$(git rev-parse HEAD)

          if [[ ! "$deploy_sha" =~ ^[0-9a-f]{40}$ || ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Production commit verification received an invalid SHA." >&2
            exit 1
          fi
          if [[ "$deploy_sha" != "$EXPECTED_SHA" ]]; then
            echo "main advanced after staging; refusing to deploy an unverified production commit." >&2
            exit 1
          fi

          echo "DEPLOY_SHA=$deploy_sha" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate production configuration
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret." >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID variable." >&2; exit 1; }
          test -n "$STATS_ALLOWED_ORIGIN" || { echo "Missing STATS_ALLOWED_ORIGIN variable." >&2; exit 1; }
          test -n "$PRODUCTION_WORKER_URL" || { echo "Missing CLOUDFLARE_PRODUCTION_WORKER_URL variable." >&2; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Validate production bundle
        run: npx wrangler deploy --dry-run --env="" --config cloudflare/wrangler.toml

      - name: Capture current production version
        id: previous
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deployments status --env="" --config cloudflare/wrangler.toml --json > "$RUNNER_TEMP/production-before.json"
          version_id=$(node -e '
            const fs = require("node:fs");
            const deployment = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            process.stdout.write(deployment.versions?.find((item) => item.percentage === 100)?.version_id ?? "");
          ' "$RUNNER_TEMP/production-before.json")
          test -n "$version_id" || { echo "Could not determine the current production version." >&2; exit 1; }
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Deploy production Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler deploy --env="" --config cloudflare/wrangler.toml
          --tag "$DEPLOY_SHA" --message "GitHub $DEPLOY_SHA"

      - name: Smoke test production Worker
        run: npm run smoke:stats-worker -- "$PRODUCTION_WORKER_URL" "$STATS_ALLOWED_ORIGIN"

      - name: Record rollback guidance
        if: failure() && steps.previous.outputs.version_id != ''
        env:
          PREVIOUS_VERSION_ID: ${{ steps.previous.outputs.version_id }}
        run: |
          {
            echo "### Production smoke failed"
            echo "Use the **Roll back Cloudflare Worker** workflow after reviewing the failure."
            echo "Previous version: \`$PREVIOUS_VERSION_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record production deployment
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler versions list --env="" --config cloudflare/wrangler.toml --json > "$RUNNER_TEMP/production-versions.json"
          version_id=$(node -e 'const fs=require("node:fs");const rows=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(rows.at(-1)?.id??"unknown")' "$RUNNER_TEMP/production-versions.json")
          {
            echo "### Cloudflare production"
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Version: \`$version_id\`"
            echo "- Previous version: \`${{ steps.previous.outputs.version_id }}\`"
            echo "- URL: $PRODUCTION_WORKER_URL"
            echo "- Smoke: passed"
          } >> "$GITHUB_STEP_SUMMARY"

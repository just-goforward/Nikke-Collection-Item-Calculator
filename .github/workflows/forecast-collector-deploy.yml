name: Deploy Forecast Collector Staging

on:
  push:
    branches: [main]
    paths:
      - "forecast-collector/**"
      - "!forecast-collector/README.md"
      - "forecast-dispatcher/**"
      - "forecast-interactions/**"
      - "forecast-admin/**"
      - "shared/forecastV2Notifications.ts"
      - "shared/forecastManualReview.ts"
      - "shared/certifiedEvidenceCoverage.ts"
      - "scripts/apply-forecast-d1-migrations.v2-gate.spec.ts"
      - "scripts/apply-forecast-d1-migrations.fail-closed.spec.ts"
      - "scripts/forecast-migration-0030.spec.ts"
      - "usage-guard/**"
      - "shared/boundedHttp.ts"
      - "shared/cloudflareD1Catalog.ts"
      - "shared/cloudflarePaidUsage.ts"
      - "shared/cloudflarePaidUsageQuery.ts"
      - "shared/cloudflareWorkerRuntimeWindow.ts"
      - "shared/discordInteraction.ts"
      - "shared/runtimeEnvironment.ts"
      - "shared/soloRaidCadence.ts"
      - "shared/certifiedRational.ts"
      - "shared/certifiedDispatchExpectations.ts"
      - "shared/certifiedSupply.ts"
      - "shared/certifiedSupplyBuild.ts"
      - "shared/certifiedSupplyLaws.ts"
      - "shared/certifiedSupplyModel.ts"
      - "shared/certifiedSupplyValidation.ts"
      - "shared/testD1Sql.ts"
      - "shared/d1QuotaEvidence.ts"
      - "shared/forecastCanaryRuntime.ts"
      - "shared/forecastCanaryRuntimeEvidence.ts"
      - "shared/usageGuard.ts"
      - "shared/supplyForecastCandidate.ts"
      - "scripts/smoke-forecast-collector.ts"
      - "scripts/smoke-forecast-dispatcher.ts"
      - "scripts/smoke-forecast-interactions.ts"
      - "scripts/forecast-v2-smoke.spec.ts"
      - "scripts/check-workflow-hardening-staging.spec.ts"
      - "scripts/check-forecast-canary-start.ts"
      - "scripts/check-forecast-canary-start.spec.ts"
      - "scripts/smoke-forecast-interactions.spec.ts"
      - "scripts/send-forecast-router-test.ts"
      - "scripts/cloudflare-cron-capacity.ts"
      - "scripts/cloudflare-d1-budget.ts"
      - "scripts/check-forecast-canary.ts"
      - "scripts/cloudflare-workers-observability.ts"
      - "scripts/lib/cloudflare-workers-observability.ts"
      - "scripts/peek-supply-forecast.ts"
      - "scripts/supply-forecast-codegen.ts"
      - "scripts/certified-forecast-registry.ts"
      - "scripts/certified-forecast-authority.ts"
      - "scripts/certified-engine-build.ts"
      - "scripts/check-workflow-hardening.ts"
      - "scripts/check-workflow-hardening.spec.ts"
      - "scripts/apply-forecast-d1-migrations.ts"
      - "scripts/apply-forecast-d1-migrations.spec.ts"
      - "scripts/apply-forecast-d1-migrations-json.spec.ts"
      - "scripts/forecast-dispatcher-workflow.spec.ts"
      - "forecast-collector/vitest.config.ts"
      - "forecast-dispatcher/vitest.config.ts"
      - "forecast-interactions/vitest.config.ts"
      - "usage-guard/vitest.config.ts"
      - ".github/workflows/forecast-collector-deploy.yml"
      - ".github/workflows/forecast-d1-budget-watch.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      poll_mode:
        description: Naver poll mode for a fresh canary
        required: true
        default: both
        type: choice
        options:
          - both
          - alternating
      router_endpoint_ready:
        description: Discord Developer Portal now points to the dedicated Router URL
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: forecast-collector-staging
  cancel-in-progress: false

jobs:
  staging-redeploy-disabled:
    if: vars.FORECAST_STAGING_AUTO_REDEPLOY == 'disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record staging redeploy suppression
        run: echo "Staging deployment skipped because FORECAST_STAGING_AUTO_REDEPLOY=disabled. Production safety workflows remain active." >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    # Shared Usage Guard deployment is independent of the staging maintenance switch.
    needs: deploy-usage-guard
    if: github.ref == 'refs/heads/main' && vars.FORECAST_STAGING_AUTO_REDEPLOY != 'disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Verify trusted checkout identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm

      - name: Validate configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_D1_ANALYTICS_TOKEN }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
          CLOUDFLARE_WORKERS_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_OBSERVABILITY_TOKEN }}
          CLOUDFLARE_USAGE_GUARD_URL: ${{ vars.CLOUDFLARE_USAGE_GUARD_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
          FORECAST_COLLECTOR_STAGING_URL: ${{ vars.FORECAST_COLLECTOR_STAGING_URL }}
          DISCORD_FORECAST_STAGING_BOT_TOKEN: ${{ secrets.DISCORD_FORECAST_STAGING_BOT_TOKEN }}
          DISCORD_FORECAST_STAGING_APPROVAL_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_APPROVAL_CHANNEL_ID }}
          DISCORD_FORECAST_STAGING_ACTIVITY_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_ACTIVITY_CHANNEL_ID }}
          DISCORD_FORECAST_STAGING_ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_ALERT_CHANNEL_ID }}
          DISCORD_FORECAST_STAGING_GUILD_ID: ${{ vars.DISCORD_FORECAST_STAGING_GUILD_ID }}
          DISCORD_FORECAST_STAGING_APPROVER_USER_ID: ${{ vars.DISCORD_FORECAST_STAGING_APPROVER_USER_ID }}
          DISCORD_FORECAST_STAGING_APPLICATION_ID: ${{ vars.DISCORD_FORECAST_STAGING_APPLICATION_ID }}
          DISCORD_FORECAST_STAGING_PUBLIC_KEY: ${{ vars.DISCORD_FORECAST_STAGING_PUBLIC_KEY }}
          FORECAST_INTERACTIONS_STAGING_URL: ${{ vars.FORECAST_INTERACTIONS_STAGING_URL }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID variable." >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret." >&2; exit 1; }
          test -n "$CLOUDFLARE_D1_ANALYTICS_TOKEN" || { echo "Missing CLOUDFLARE_D1_ANALYTICS_TOKEN secret." >&2; exit 1; }
          test -n "$CLOUDFLARE_BILLING_READ_TOKEN" || { echo "Missing CLOUDFLARE_BILLING_READ_TOKEN secret." >&2; exit 1; }
          test -n "$CLOUDFLARE_WORKERS_OBSERVABILITY_TOKEN" || { echo "Missing CLOUDFLARE_WORKERS_OBSERVABILITY_TOKEN secret." >&2; exit 1; }
          [[ "$CLOUDFLARE_USAGE_GUARD_URL" =~ ^https://[^/]+$ ]] || { echo "Missing or invalid CLOUDFLARE_USAGE_GUARD_URL variable." >&2; exit 1; }
          test -n "$FORECAST_COLLECTOR_ADMIN_TOKEN" || { echo "Missing FORECAST_COLLECTOR_ADMIN_TOKEN secret." >&2; exit 1; }
          test -n "$FORECAST_COLLECTOR_STAGING_URL" || { echo "Missing FORECAST_COLLECTOR_STAGING_URL variable." >&2; exit 1; }
          test -n "$DISCORD_FORECAST_STAGING_BOT_TOKEN" || { echo "Missing DISCORD_FORECAST_STAGING_BOT_TOKEN secret." >&2; exit 1; }
          for name in DISCORD_FORECAST_STAGING_APPROVAL_CHANNEL_ID DISCORD_FORECAST_STAGING_ACTIVITY_CHANNEL_ID DISCORD_FORECAST_STAGING_ALERT_CHANNEL_ID DISCORD_FORECAST_STAGING_GUILD_ID DISCORD_FORECAST_STAGING_APPROVER_USER_ID DISCORD_FORECAST_STAGING_APPLICATION_ID; do
            [[ "${!name}" =~ ^[0-9]{6,24}$ ]] || { echo "Missing or invalid $name variable." >&2; exit 1; }
          done
          [[ "$DISCORD_FORECAST_STAGING_PUBLIC_KEY" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Missing or invalid DISCORD_FORECAST_STAGING_PUBLIC_KEY variable." >&2; exit 1; }
          [[ "$FORECAST_INTERACTIONS_STAGING_URL" =~ ^https://[^/]+$ ]] || { echo "Missing or invalid FORECAST_INTERACTIONS_STAGING_URL variable." >&2; exit 1; }

      - name: Prepare npm 12.2.1 with pinned integrity
        shell: bash
        timeout-minutes: 5
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-bootstrap-cache
        run: &prepare_forecast_npm |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { existsSync, mkdtempSync, writeFileSync, appendFileSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { setTimeout as delay } from 'node:timers/promises';
          const version = '12.2.1';
          const url = 'https://registry.npmjs.org/npm/-/npm-12.2.1.tgz';
          const sri = 'sha512-bKCmFRVT/BB+YPEYbZwQ1XUI3N5t4xKSpU1MxOjo7z3iWzKBJ0ZXRC1xFdEN+TC7N5TdywaBzf2dMXGJq/e2PQ==';
          if (process.version !== 'v24.22.1') throw new Error('Unexpected Node version');
          if (!process.env.RUNNER_TEMP || !process.env.GITHUB_PATH || !process.env.NPM_CONFIG_CACHE) throw new Error('Missing runner paths');
          const nodeDir = dirname(process.execPath);
          const sourceCli = [join(nodeDir, 'node_modules/npm/bin/npm-cli.js'), resolve(nodeDir, '../lib/node_modules/npm/bin/npm-cli.js')].find(existsSync);
          if (!sourceCli) throw new Error('Bundled npm CLI not found');
          const cleanEnv = Object.fromEntries(['PATH', 'HOME', 'USERPROFILE', 'SYSTEMROOT', 'WINDIR', 'COMSPEC', 'PATHEXT', 'TEMP', 'TMP', 'TMPDIR', 'APPDATA', 'LOCALAPPDATA'].filter(k => process.env[k] !== undefined).map(k => [k, process.env[k]]));
          const root = mkdtempSync(join(process.env.RUNNER_TEMP, 'npm-12.2.1-'));
          const prefix = join(root, 'prefix');
          const userConfig = join(root, 'user.npmrc');
          const globalConfig = join(root, 'global.npmrc');
          writeFileSync(userConfig, '', { flag: 'wx' });
          writeFileSync(globalConfig, '', { flag: 'wx' });
          const cacheKey = `npm-${version}-${process.platform}-${process.arch}-${Buffer.from(sri.slice(7), 'base64').toString('hex')}`;
          const cache = join(process.env.NPM_CONFIG_CACHE, cacheKey);
          let bytes;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(30000) });
              if (!response.ok) {
                const error = new Error(`npm tarball HTTP ${response.status}`);
                error.terminal = response.status < 500 && response.status !== 408 && response.status !== 429;
                throw error;
              }
              const chunks = []; let size = 0;
              for await (const chunk of response.body) {
                size += chunk.length;
                if (size > 8 * 1024 * 1024) throw Object.assign(new Error('npm tarball size limit exceeded'), { terminal: true });
                chunks.push(chunk);
              }
              bytes = Buffer.concat(chunks); break;
            } catch (error) {
              if (error.terminal || attempt === 2) throw error;
              await delay(1000 * (attempt + 1));
            }
          }
          if ('sha512-' + createHash('sha512').update(bytes).digest('base64') !== sri) throw new Error('npm tarball integrity mismatch');
          const tgz = join(root, 'npm-12.2.1.tgz');
          writeFileSync(tgz, bytes, { flag: 'wx' });
          const options = { cwd: root, env: cleanEnv, timeout: 120000 };
          execFileSync(process.execPath, [sourceCli, 'install', '--global', '--prefix', prefix, tgz, '--offline', '--ignore-scripts', '--no-audit', '--no-fund', '--no-update-notifier', '--cache', cache, '--userconfig', userConfig, '--globalconfig', globalConfig], { ...options, stdio: 'inherit' });
          const windows = process.platform === 'win32';
          const targetCli = join(prefix, windows ? 'node_modules' : 'lib/node_modules', 'npm/bin/npm-cli.js');
          if (execFileSync(process.execPath, [targetCli, '--version', '--no-update-notifier', '--userconfig', userConfig, '--globalconfig', globalConfig], options).toString().trim() !== version) throw new Error('Installed npm version mismatch');
          appendFileSync(process.env.GITHUB_PATH, (windows ? prefix : join(prefix, 'bin')) + '\n');
          console.log(`Prepared npm ${version}; platform=${process.platform}; integrity verified`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate required Router origin after dependency installation
        env:
          FORECAST_INTERACTIONS_STAGING_URL: ${{ vars.FORECAST_INTERACTIONS_STAGING_URL }}
        run: node scripts/check-workflow-hardening.ts --router-origin "$FORECAST_INTERACTIONS_STAGING_URL"

      - name: Verify statistics production D1 remains readable
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          stats_probe=$(npx wrangler d1 execute DB --remote \
            --config cloudflare/wrangler.toml --command "SELECT 1 AS ok;" --json)
          [[ "$(jq -r '.[0].results[0].ok' <<<"$stats_probe")" == "1" ]]

      - name: Verify collector
        run: |
          npm run forecast:types:check
          npx tsc --noEmit -p forecast-collector/tsconfig.json
          npm run test:forecast-collector
          npx wrangler deploy --dry-run --env staging --config forecast-collector/wrangler.toml

      - name: Verify dispatcher
        run: |
          npm run dispatcher:types:check
          npx tsc --noEmit -p forecast-dispatcher/tsconfig.json
          npm run test:forecast-dispatcher
          npx wrangler deploy --dry-run --env staging --config forecast-dispatcher/wrangler.toml

      - name: Verify interaction Router
        run: |
          npm run interactions:types:check
          npx tsc --noEmit -p forecast-interactions/tsconfig.json
          npm run test:forecast-interactions
          npx wrangler deploy --dry-run --env staging --config forecast-interactions/wrangler.toml

      - name: Verify Forecast migration runner
        run: npm test -- scripts/apply-forecast-d1-migrations.spec.ts scripts/apply-forecast-d1-migrations-json.spec.ts scripts/apply-forecast-d1-migrations.v2-gate.spec.ts scripts/apply-forecast-d1-migrations.fail-closed.spec.ts scripts/forecast-migration-0030.spec.ts scripts/forecast-dispatcher-workflow.spec.ts scripts/check-workflow-hardening.spec.ts

      - name: Verify read-only forecast smoke clients
        run: npm test -- scripts/forecast-v2-smoke.spec.ts scripts/smoke-forecast-interactions.spec.ts scripts/check-workflow-hardening-staging.spec.ts scripts/check-forecast-canary-start.spec.ts shared/forecastCanaryRuntime.spec.ts

      - name: Verify Forecast admin
        run: |
          set -euo pipefail
          npx tsc --noEmit -p forecast-admin/tsconfig.json
          npm run test:forecast-admin

      - name: Apply staging Forecast D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/apply-forecast-d1-migrations.ts --env staging --remote --allow-forecast-v2

      - name: Deploy staging Forecast admin when Access is configured
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCESS_TEAM_DOMAIN: ${{ vars.FORECAST_ADMIN_ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.FORECAST_ADMIN_ACCESS_AUD }}
          ADMIN_ALLOWED_EMAILS: ${{ vars.FORECAST_ADMIN_ALLOWED_EMAILS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ACCESS_TEAM_DOMAIN" && -n "$ACCESS_AUD" && -n "$ADMIN_ALLOWED_EMAILS" ]]; then
            npx wrangler deploy --config forecast-admin/wrangler.toml \
              --var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN" \
              --var "ACCESS_AUD:$ACCESS_AUD" \
              --var "ADMIN_ALLOWED_EMAILS:$ADMIN_ALLOWED_EMAILS"
          else
            echo "Forecast admin deployment skipped: all three FORECAST_ADMIN_ACCESS_TEAM_DOMAIN, FORECAST_ADMIN_ACCESS_AUD and FORECAST_ADMIN_ALLOWED_EMAILS variables are required." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify staging Forecast covering indexes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          indexes=$(npx wrangler d1 execute FORECAST_DB --remote --env staging \
            --config forecast-collector/wrangler.toml \
            --command "SELECT name FROM sqlite_master WHERE type = 'index' AND name IN ('collector_invocations_latest_idx', 'dispatcher_invocations_environment_latest_idx') ORDER BY name;" \
            --json)
          jq -e '([.[0].results[].name] | sort) == ["collector_invocations_latest_idx","dispatcher_invocations_environment_latest_idx"]' \
            <<<"$indexes" >/dev/null || {
              echo "Forecast staging covering indexes are missing." >&2
              exit 1
            }

      - name: Check account-wide D1 preflight after index verification
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_D1_ANALYTICS_TOKEN }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
        run: npm run check:d1-budget -- preflight --output "$RUNNER_TEMP/d1-budget-preflight.json"

      - name: Verify account Cron trigger capacity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FORECAST_DISPATCHER_SCRIPT_NAME: collection-kit-forecast-dispatcher-staging
        run: npm run check:cloudflare-cron-capacity

      - name: Prepare dispatcher secret file
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_FORECAST_STAGING_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/forecast-dispatcher-secrets.json" <<'NODE'
          import { writeFileSync } from "node:fs";
          const discordToken = process.env.DISCORD_BOT_TOKEN ?? "";
          if (!discordToken) throw new Error("Dispatcher secrets are invalid.");
          writeFileSync(
            process.argv[2],
            JSON.stringify({ DISCORD_BOT_TOKEN: discordToken }),
            { mode: 0o600 },
          );
          NODE

      - name: Deploy staging dispatcher
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_FORECAST_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_APPROVAL_CHANNEL_ID }}
          DISCORD_FORECAST_ACTIVITY_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_ACTIVITY_CHANNEL_ID }}
          DISCORD_FORECAST_ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_ALERT_CHANNEL_ID }}
          DISCORD_FORECAST_FALLBACK_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_ALERT_CHANNEL_ID }}
        run: >-
          set -euo pipefail;
          npx wrangler deploy --env staging --config forecast-dispatcher/wrangler.toml
          --secrets-file "$RUNNER_TEMP/forecast-dispatcher-secrets.json"
          --var ENVIRONMENT:staging --var DEPLOY_SHA:${{ github.sha }}
          --var DISCORD_CHANNEL_ID:$DISCORD_FORECAST_CHANNEL_ID
          --var DISCORD_ACTIVITY_CHANNEL_ID:$DISCORD_FORECAST_ACTIVITY_CHANNEL_ID
          --var DISCORD_ALERT_CHANNEL_ID:$DISCORD_FORECAST_ALERT_CHANNEL_ID
          --var DISCORD_FALLBACK_CHANNEL_ID:$DISCORD_FORECAST_FALLBACK_CHANNEL_ID
          --var DISPATCH_ENABLED:false
          --var FORECAST_V2_NOTIFICATIONS_ENABLED:false
          --var DISCORD_APPROVAL_CHANNEL_ID:$DISCORD_FORECAST_CHANNEL_ID
          --tag "${{ github.sha }}-disabled" --message "Forecast dispatcher staging disabled ${{ github.sha }}"

      - name: Prepare deployment secret file
        env:
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_FORECAST_STAGING_BOT_TOKEN }}
          DISCORD_FORECAST_APPLICATION_ID: ${{ vars.DISCORD_FORECAST_STAGING_APPLICATION_ID }}
          DISCORD_FORECAST_PUBLIC_KEY: ${{ vars.DISCORD_FORECAST_STAGING_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FORECAST_COLLECTOR_ADMIN_TOKEN" || {
            echo "Missing FORECAST_COLLECTOR_ADMIN_TOKEN." >&2
            exit 1
          }
          test -n "$DISCORD_BOT_TOKEN" || {
            echo "Missing DISCORD_FORECAST_STAGING_BOT_TOKEN." >&2
            exit 1
          }
          application="$RUNNER_TEMP/discord-bot-application.json"
          status=$(curl --silent --show-error --max-time 10 \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            --output "$application" --write-out "%{http_code}" \
            "https://discord.com/api/v10/oauth2/applications/@me")
          [[ "$status" == "200" ]] || {
            echo "Discord bot application lookup returned HTTP $status." >&2
            exit 1
          }
          node --input-type=module - "$application" "$RUNNER_TEMP/forecast-secrets.json" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const application = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (!/^\d{1,24}$/.test(application.id ?? "")) {
            throw new Error("Discord bot application ID is invalid.");
          }
          if (!/^[0-9a-f]{64}$/i.test(application.verify_key ?? "")) {
            throw new Error("Discord bot application verify key is invalid.");
          }
          if (application.id !== process.env.DISCORD_FORECAST_APPLICATION_ID) {
            throw new Error("Discord bot application ID does not match the repository variable.");
          }
          if (application.verify_key.toLowerCase() !== process.env.DISCORD_FORECAST_PUBLIC_KEY?.toLowerCase()) {
            throw new Error("Discord bot public key does not match the repository variable.");
          }
          const applicationName = String(application.name ?? "").trim();
          if (!applicationName || /[\r\n]/.test(applicationName)) {
            throw new Error("Discord bot application name is invalid.");
          }
          console.log(`Discord bot application: ${applicationName} (${application.id})`);
          writeFileSync(
            process.argv[3],
            JSON.stringify({
              ADMIN_TOKEN: process.env.FORECAST_COLLECTOR_ADMIN_TOKEN,
            }),
            { mode: 0o600 },
          );
          NODE

      - name: Prepare staging interactions secret file
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_FORECAST_STAGING_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/forecast-interactions-staging-secrets.json" <<'NODE'
          import { writeFileSync } from "node:fs";
          const token = process.env.DISCORD_BOT_TOKEN;
          if (!token) throw new Error("Missing DISCORD_FORECAST_STAGING_BOT_TOKEN secret.");
          writeFileSync(process.argv[2], JSON.stringify({ DISCORD_BOT_TOKEN: token }), { mode: 0o600 });
          NODE

      - name: Deploy staging interactions
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_PUBLIC_KEY: ${{ vars.DISCORD_FORECAST_STAGING_PUBLIC_KEY }}
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_FORECAST_STAGING_APPLICATION_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_FORECAST_STAGING_GUILD_ID }}
          DISCORD_FORECAST_APPROVER_USER_ID: ${{ vars.DISCORD_FORECAST_STAGING_APPROVER_USER_ID }}
          DISCORD_APPROVAL_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_APPROVAL_CHANNEL_ID }}
          DISCORD_ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_ALERT_CHANNEL_ID }}
          DISCORD_ACTIVITY_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_ACTIVITY_CHANNEL_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --env staging --config forecast-interactions/wrangler.toml \
            --secrets-file "$RUNNER_TEMP/forecast-interactions-staging-secrets.json" \
            --var FORECAST_ENVIRONMENT:staging --var DEPLOY_SHA:${{ github.sha }} \
            --var "DISCORD_PUBLIC_KEY:$DISCORD_PUBLIC_KEY" \
            --var "DISCORD_APPLICATION_ID:$DISCORD_APPLICATION_ID" \
            --var "DISCORD_GUILD_ID:$DISCORD_GUILD_ID" \
            --var "DISCORD_FORECAST_APPROVER_USER_ID:$DISCORD_FORECAST_APPROVER_USER_ID" \
            --var "DISCORD_APPROVAL_CHANNEL_ID:$DISCORD_APPROVAL_CHANNEL_ID" \
            --var "DISCORD_ALERT_CHANNEL_ID:$DISCORD_ALERT_CHANNEL_ID" \
            --var "DISCORD_ACTIVITY_CHANNEL_ID:$DISCORD_ACTIVITY_CHANNEL_ID" \
            --var PRODUCTION_MUTATIONS_ENABLED:false \
            --var STAGING_PUBLICATION_MODE:enabled --var FORECAST_PUBLICATION_KEY_ID:staging-v1 \
            --var PRODUCTION_PUBLICATION_MODE:off \
            --tag "${{ github.sha }}-staging"

      - name: Verify staging interactions readiness
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FORECAST_EXPECTED_DEPLOY_SHA: ${{ github.sha }}
          FORECAST_INTERACTIONS_STAGING_URL: ${{ vars.FORECAST_INTERACTIONS_STAGING_URL }}
        run: |
          set -euo pipefail
          npm run smoke:forecast-interactions -- "$FORECAST_INTERACTIONS_STAGING_URL"
          npx wrangler deployments status --env staging --config forecast-interactions/wrangler.toml \
            --json > "$RUNNER_TEMP/staging-router-status.json"
          version=$(node scripts/check-workflow-hardening.ts --active-version "$RUNNER_TEMP/staging-router-status.json")
          npx wrangler versions view "$version" --env staging --config forecast-interactions/wrangler.toml \
            --json > "$RUNNER_TEMP/staging-router-version.json"
          node scripts/check-workflow-hardening.ts --version-identity \
            "$RUNNER_TEMP/staging-router-version.json" "$version" > "$RUNNER_TEMP/staging-router-identity.json"
          jq -e --arg sha "$FORECAST_EXPECTED_DEPLOY_SHA" \
            '.deploymentSha == $sha and .vars.FORECAST_ENVIRONMENT == "staging" and
             .vars.PRODUCTION_MUTATIONS_ENABLED == "false"' "$RUNNER_TEMP/staging-router-identity.json" >/dev/null
          node scripts/check-workflow-hardening.ts --sanitize-identity \
            "$RUNNER_TEMP/staging-router-identity.json" > "$RUNNER_TEMP/staging-router-identity.evidence.json"
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 20 \
            "$FORECAST_INTERACTIONS_STAGING_URL/health" > "$RUNNER_TEMP/staging-router-health.json"
          jq -e --arg sha "$FORECAST_EXPECTED_DEPLOY_SHA" \
            '.status == "ok" and .deploymentSha == $sha and .productionMutationsEnabled == false' \
            "$RUNNER_TEMP/staging-router-health.json" >/dev/null
          node scripts/check-workflow-hardening.ts --sanitize-readiness \
            "$RUNNER_TEMP/staging-router-health.json" > "$RUNNER_TEMP/staging-router-health.evidence.json"

      - name: Deploy staging collector
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLL_MODE: ${{ inputs.poll_mode || 'both' }}
        run: >-
          set -euo pipefail;
          npx wrangler deploy --env staging --config forecast-collector/wrangler.toml
          --secrets-file "$RUNNER_TEMP/forecast-secrets.json"
          --var ENVIRONMENT:staging --var DEPLOY_SHA:${{ github.sha }} --var POLL_MODE:$POLL_MODE
          --var COLLECT_ENABLED:false
          --var FORECAST_V2_MODE:on
          --tag "${{ github.sha }}-$POLL_MODE-disabled"
          --message "Forecast collector staging disabled ${{ github.sha }} ($POLL_MODE)"

      - name: Live staging read-only collector smoke
        env:
          FORECAST_COLLECTOR_STAGING_URL: ${{ vars.FORECAST_COLLECTOR_STAGING_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
          FORECAST_EXPECTED_DEPLOY_SHA: ${{ github.sha }}
        run: npm run smoke:forecast-collector -- "$FORECAST_COLLECTOR_STAGING_URL" "$FORECAST_COLLECTOR_ADMIN_TOKEN"

      - name: Verify Paid account-wide baseline
        if: github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready
        id: d1_baseline
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_D1_ANALYTICS_TOKEN }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          stats_probe=$(npx wrangler d1 execute DB --remote \
            --config cloudflare/wrangler.toml --command "SELECT 1 AS ok;" --json)
          [[ "$(jq -r '.[0].results[0].ok' <<<"$stats_probe")" == "1" ]] || {
            echo "Statistics production D1 read probe failed." >&2
            exit 1
          }
          npm run check:d1-budget -- snapshot --output "$RUNNER_TEMP/d1-budget-baseline.json"

      - name: Record live Observability contract probe start
        if: github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready
        id: live_probe_window
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"

      - name: Activate staging collector for live contract probe
        if: github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready
        id: collector_activation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLL_MODE: ${{ inputs.poll_mode || 'both' }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/collector-active-deploy.ndjson
        shell: bash
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --env staging --config forecast-collector/wrangler.toml \
            --secrets-file "$RUNNER_TEMP/forecast-secrets.json" \
            --var ENVIRONMENT:staging --var DEPLOY_SHA:${{ github.sha }} --var POLL_MODE:$POLL_MODE \
            --var COLLECT_ENABLED:true \
            --var FORECAST_V2_MODE:on \
            --tag "${{ github.sha }}-$POLL_MODE-v10" \
            --message "Forecast collector staging live probe ${{ github.sha }} ($POLL_MODE)" \
            2>&1 | tee "$RUNNER_TEMP/collector-active-deploy.log"
          version_id=$(node scripts/check-workflow-hardening.ts --deployment-version \
            "$WRANGLER_OUTPUT_FILE_PATH" collection-kit-forecast-collector-staging staging)
          npx wrangler deployments status --env staging --config forecast-collector/wrangler.toml \
            --json > "$RUNNER_TEMP/collector-active-status.json"
          test "$(node scripts/check-workflow-hardening.ts --active-version "$RUNNER_TEMP/collector-active-status.json")" = "$version_id"
          npx wrangler versions view "$version_id" --env staging --config forecast-collector/wrangler.toml \
            --json > "$RUNNER_TEMP/collector-active-version.json"
          node scripts/check-workflow-hardening.ts --version-identity "$RUNNER_TEMP/collector-active-version.json" "$version_id" \
            > "$RUNNER_TEMP/collector-active-identity.json"
          jq -e --arg sha "${{ github.sha }}" --arg mode "$POLL_MODE" \
            '.deploymentSha == $sha and .tag == ($sha + "-" + $mode + "-v10") and
             .vars.ENVIRONMENT == "staging" and .vars.POLL_MODE == $mode and .vars.COLLECT_ENABLED == "true"' \
            "$RUNNER_TEMP/collector-active-identity.json" >/dev/null
          node scripts/check-workflow-hardening.ts --sanitize-identity \
            "$RUNNER_TEMP/collector-active-identity.json" > "$RUNNER_TEMP/collector-active-identity.evidence.json"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Activate staging dispatcher after collector readiness
        if: github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready
        id: dispatcher_activation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_FORECAST_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_APPROVAL_CHANNEL_ID }}
          DISCORD_FORECAST_ACTIVITY_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_ACTIVITY_CHANNEL_ID }}
          DISCORD_FORECAST_ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_ALERT_CHANNEL_ID }}
          DISCORD_FORECAST_FALLBACK_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_ALERT_CHANNEL_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/dispatcher-active-deploy.ndjson
        shell: bash
        run: |
          set -euo pipefail
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --env staging --config forecast-dispatcher/wrangler.toml \
            --secrets-file "$RUNNER_TEMP/forecast-dispatcher-secrets.json" \
            --var ENVIRONMENT:staging --var DEPLOY_SHA:${{ github.sha }} \
            --var DISCORD_CHANNEL_ID:$DISCORD_FORECAST_CHANNEL_ID \
            --var DISCORD_ACTIVITY_CHANNEL_ID:$DISCORD_FORECAST_ACTIVITY_CHANNEL_ID \
            --var DISCORD_ALERT_CHANNEL_ID:$DISCORD_FORECAST_ALERT_CHANNEL_ID \
            --var DISCORD_FALLBACK_CHANNEL_ID:$DISCORD_FORECAST_FALLBACK_CHANNEL_ID \
            --var DISPATCH_ENABLED:true \
            --var FORECAST_V2_NOTIFICATIONS_ENABLED:false \
            --var DISCORD_APPROVAL_CHANNEL_ID:$DISCORD_FORECAST_CHANNEL_ID \
            --tag "${{ github.sha }}-v10" \
            --message "Forecast dispatcher staging live probe ${{ github.sha }}" \
            2>&1 | tee "$RUNNER_TEMP/dispatcher-active-deploy.log"
          version_id=$(node scripts/check-workflow-hardening.ts --deployment-version \
            "$WRANGLER_OUTPUT_FILE_PATH" collection-kit-forecast-dispatcher-staging staging)
          npx wrangler deployments status --env staging --config forecast-dispatcher/wrangler.toml \
            --json > "$RUNNER_TEMP/dispatcher-active-status.json"
          test "$(node scripts/check-workflow-hardening.ts --active-version "$RUNNER_TEMP/dispatcher-active-status.json")" = "$version_id"
          npx wrangler versions view "$version_id" --env staging --config forecast-dispatcher/wrangler.toml \
            --json > "$RUNNER_TEMP/dispatcher-active-version.json"
          node scripts/check-workflow-hardening.ts --version-identity "$RUNNER_TEMP/dispatcher-active-version.json" "$version_id" \
            > "$RUNNER_TEMP/dispatcher-active-identity.json"
          jq -e --arg sha "${{ github.sha }}" \
            '.deploymentSha == $sha and .tag == ($sha + "-v10") and
             .vars.ENVIRONMENT == "staging" and .vars.DISPATCH_ENABLED == "true"' \
            "$RUNNER_TEMP/dispatcher-active-identity.json" >/dev/null
          node scripts/check-workflow-hardening.ts --sanitize-identity \
            "$RUNNER_TEMP/dispatcher-active-identity.json" > "$RUNNER_TEMP/dispatcher-active-identity.evidence.json"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Live staging dispatcher outbox readiness
        if: github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready
        id: dispatcher_smoke
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FORECAST_COLLECTOR_STAGING_URL: ${{ vars.FORECAST_COLLECTOR_STAGING_URL }}
        shell: bash
        run: &staging_outbox_readiness |
          set -euo pipefail
          npx wrangler d1 execute FORECAST_DB --remote --env staging \
            --config forecast-collector/wrangler.toml \
            --command "SELECT 'publication' AS queue, 'staging' AS environment, (SELECT state FROM forecast_runtime_outbox WHERE environment='staging' LIMIT 1) AS state UNION ALL SELECT 'v2', 'staging', (SELECT state FROM forecast_v2_notification_outbox LIMIT 1);" \
            --json > "$RUNNER_TEMP/staging-outbox-readiness.json"
          npm run smoke:forecast-dispatcher -- \
            "$FORECAST_COLLECTOR_STAGING_URL" "$RUNNER_TEMP/staging-outbox-readiness.json"

      - name: Wait for first scheduled live-contract samples
        if: github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready && steps.dispatcher_smoke.outcome == 'success'
        run: sleep 420

      - name: Verify live Workers Observability contract before burn-in
        if: github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready && steps.dispatcher_smoke.outcome == 'success'
        id: observability_live_probe
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_OBSERVABILITY_TOKEN }}
          FORECAST_CANARY_DEPLOYMENT_SHA: ${{ github.sha }}
          FORECAST_COLLECTOR_SCRIPT_VERSION: ${{ github.sha }}-${{ inputs.poll_mode || 'both' }}-v10
          FORECAST_DISPATCHER_SCRIPT_VERSION: ${{ github.sha }}-v10
          FORECAST_COLLECTOR_SCRIPT_VERSION_ID: ${{ steps.collector_activation.outputs.version_id }}
          FORECAST_DISPATCHER_SCRIPT_VERSION_ID: ${{ steps.dispatcher_activation.outputs.version_id }}
          FORECAST_CANARY_STARTED_AT: ${{ steps.live_probe_window.outputs.started_at }}
          FORECAST_CANARY_RUNTIME_OUTPUT: ${{ runner.temp }}/forecast-observability-live-probe.json
        shell: bash
        run: |
          set -euo pipefail
          export FORECAST_CANARY_ID="fc-$(printf '%s' '${{ github.sha }}' | cut -c1-32)"
          export FORECAST_CANARY_ENDED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          npm run preflight:forecast-runtime

      - name: Project privacy-safe live Observability contract evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready && steps.live_probe_window.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/forecast-observability-live-probe.json"
          if [[ -f "$source" ]]; then
            node scripts/check-workflow-hardening.ts --retain-evidence "$source" runtime \
              > "$RUNNER_TEMP/forecast-observability-live-probe.evidence.pending"
            mv "$RUNNER_TEMP/forecast-observability-live-probe.evidence.pending" \
              "$RUNNER_TEMP/forecast-observability-live-probe.evidence.json"
          fi

      - name: Upload live Observability contract evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready && steps.live_probe_window.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forecast-observability-v10-live-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/collector-active-identity.evidence.json
            ${{ runner.temp }}/dispatcher-active-identity.evidence.json
            ${{ runner.temp }}/forecast-observability-live-probe.evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Observe 30-minute account-wide D1 burn-in
        if: github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready && steps.dispatcher_smoke.outcome == 'success'
        run: sleep 1800

      - name: Recheck Workers Observability contract after burn-in
        if: github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready && steps.dispatcher_smoke.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_OBSERVABILITY_TOKEN }}
          FORECAST_CANARY_DEPLOYMENT_SHA: ${{ github.sha }}
          FORECAST_COLLECTOR_SCRIPT_VERSION: ${{ github.sha }}-${{ inputs.poll_mode || 'both' }}-v10
          FORECAST_DISPATCHER_SCRIPT_VERSION: ${{ github.sha }}-v10
          FORECAST_COLLECTOR_SCRIPT_VERSION_ID: ${{ steps.collector_activation.outputs.version_id }}
          FORECAST_DISPATCHER_SCRIPT_VERSION_ID: ${{ steps.dispatcher_activation.outputs.version_id }}
          FORECAST_CANARY_RUNTIME_OUTPUT: ${{ runner.temp }}/forecast-observability-preflight.json
        shell: bash
        run: |
          set -euo pipefail
          export FORECAST_CANARY_ID="fc-$(printf '%s' '${{ github.sha }}' | cut -c1-32)"
          export FORECAST_CANARY_ENDED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          export FORECAST_CANARY_STARTED_AT="$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%S.000Z)"
          npm run preflight:forecast-runtime

      - name: Evaluate account-wide D1 budget
        if: github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready && steps.dispatcher_smoke.outcome == 'success'
        id: d1_budget
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_D1_ANALYTICS_TOKEN }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
        run: >-
          npm run check:d1-budget -- evaluate
          --baseline "$RUNNER_TEMP/d1-budget-baseline.json"
          --output "$RUNNER_TEMP/d1-budget-evaluation.json"

      - name: Send direct Discord D1 budget failure alert
        if: always() && steps.d1_budget.outcome == 'failure'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_FORECAST_STAGING_BOT_TOKEN }}
          DISCORD_ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_ALERT_CHANNEL_ID }}
        shell: bash
        run: |
          set -euo pipefail
          reasons=$(jq -r '.reasons | join(", ")' "$RUNNER_TEMP/d1-budget-evaluation.json" 2>/dev/null || echo "budget_evaluation_failed")
          payload=$(jq -n \
            --arg content "Forecast staging D1 canary was stopped. Reasons: $reasons. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{content:$content,allowed_mentions:{parse:[]}}')
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 20 \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://discord.com/api/v10/channels/$DISCORD_ALERT_CHANNEL_ID/messages" >/dev/null

      - name: Fail after D1 budget rollback
        if: always() && steps.d1_budget.outcome == 'failure'
        run: exit 1

      - name: Refresh Paid usage guard after burn-in
        if: github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready && steps.d1_budget.outcome == 'success'
        env:
          CLOUDFLARE_USAGE_GUARD_URL: ${{ vars.CLOUDFLARE_USAGE_GUARD_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --connect-timeout 5 --max-time 30 \
            --output "$RUNNER_TEMP/usage-guard-post-burn-in.json" --write-out "%{http_code}" \
            -X POST -H "Authorization: Bearer $FORECAST_COLLECTOR_ADMIN_TOKEN" \
            "$CLOUDFLARE_USAGE_GUARD_URL/admin/refresh")
          [[ "$status" == "200" ]] || { echo "Usage Guard refresh returned HTTP $status." >&2; exit 1; }
          jq -e '.ok == true and .state.action == "normal"' "$RUNNER_TEMP/usage-guard-post-burn-in.json" >/dev/null

      - name: Align canary start using version-bound scheduled telemetry
        if: github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready && steps.d1_budget.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_OBSERVABILITY_TOKEN }}
          FORECAST_CANARY_DEPLOYMENT_SHA: ${{ github.sha }}
          FORECAST_COLLECTOR_SCRIPT_VERSION: ${{ github.sha }}-${{ inputs.poll_mode || 'both' }}-v10
          FORECAST_DISPATCHER_SCRIPT_VERSION: ${{ github.sha }}-v10
          FORECAST_COLLECTOR_SCRIPT_VERSION_ID: ${{ steps.collector_activation.outputs.version_id }}
          FORECAST_DISPATCHER_SCRIPT_VERSION_ID: ${{ steps.dispatcher_activation.outputs.version_id }}
          FORECAST_CANARY_RUNTIME_OUTPUT: ${{ runner.temp }}/forecast-canary-start-runtime.json
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 420 ))
          while (( $(date +%s) < deadline )); do
            minute=$(date -u +%M)
            second=$(date -u +%S)
            if (( 10#$minute % 3 == 2 )) && (( 10#$second >= 10 )) && (( 10#$second <= 40 )); then
              export FORECAST_CANARY_ID="fc-$(printf '%s' '${{ github.sha }}' | cut -c1-32)"
              export FORECAST_CANARY_STARTED_AT="$(date -u -d '6 minutes ago' +%Y-%m-%dT%H:%M:%S.000Z)"
              export FORECAST_CANARY_ENDED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
              npm run preflight:forecast-runtime
              node scripts/check-forecast-canary-start.ts "$FORECAST_CANARY_RUNTIME_OUTPUT"
              node scripts/check-workflow-hardening.ts --retain-evidence "$FORECAST_CANARY_RUNTIME_OUTPUT" runtime \
                > "$RUNNER_TEMP/forecast-canary-start-runtime.evidence.json"
              exit 0
            fi
            sleep 5
          done
          echo "A completed Collector/Dispatcher Cron pair was not observed in a safe start phase." >&2
          exit 1

      - name: Start fixed eight-hour v2 canary
        if: github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready && steps.d1_budget.outcome == 'success'
        id: canary_start
        env:
          FORECAST_COLLECTOR_STAGING_URL: ${{ vars.FORECAST_COLLECTOR_STAGING_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          canary_id="fc-$(node --input-type=module -e 'console.log(crypto.randomUUID().replaceAll("-", ""))')"
          jq -n \
            --arg canaryId "$canary_id" \
            --arg collectorVersionId "${{ steps.collector_activation.outputs.version_id }}" \
            --arg dispatcherVersionId "${{ steps.dispatcher_activation.outputs.version_id }}" \
            --slurpfile evaluation "$RUNNER_TEMP/d1-budget-evaluation.json" \
            '{canaryId:$canaryId,collectorCron:"*/3 * * * *",dispatcherCron:"1-59/3 * * * *",collectorVersionId:$collectorVersionId,dispatcherVersionId:$dispatcherVersionId,quotaEvidence:$evaluation[0].evidence}' \
            > "$RUNNER_TEMP/canary-start-request.json"
          status=$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
            --output "$RUNNER_TEMP/canary-start.json" --write-out "%{http_code}" \
            -H "Authorization: Bearer $FORECAST_COLLECTOR_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/canary-start-request.json" \
            "$FORECAST_COLLECTOR_STAGING_URL/admin/canary-deployments/start")
          [[ "$status" == "200" ]] || {
            echo "Canary start returned HTTP $status." >&2
            exit 1
          }
          jq -e --arg sha "${{ github.sha }}" --arg canaryId "$canary_id" \
            --arg collectorVersionId "${{ steps.collector_activation.outputs.version_id }}" \
            --arg dispatcherVersionId "${{ steps.dispatcher_activation.outputs.version_id }}" \
            '.canary.canaryId == $canaryId and .canary.deploymentSha == $sha and .canary.collectorCron == "*/3 * * * *" and .canary.dispatcherCron == "1-59/3 * * * *" and .canary.collectorVersionId == $collectorVersionId and .canary.dispatcherVersionId == $dispatcherVersionId' \
            "$RUNNER_TEMP/canary-start.json" >/dev/null
          echo "canary_id=$canary_id" >> "$GITHUB_OUTPUT"
          echo "started_at=$(jq -r '.canary.startedAt' "$RUNNER_TEMP/canary-start.json")" >> "$GITHUB_OUTPUT"
          echo "ends_at=$(jq -r '.canary.endsAt' "$RUNNER_TEMP/canary-start.json")" >> "$GITHUB_OUTPUT"
          jq --arg mode "${{ inputs.poll_mode || 'both' }}" \
            '.canary + {pollMode:$mode}' "$RUNNER_TEMP/canary-start.json" > "$RUNNER_TEMP/canary-start-identity.json"
          node scripts/check-workflow-hardening.ts --sanitize-canary \
            "$RUNNER_TEMP/canary-start-identity.json" > "$RUNNER_TEMP/canary-start-identity.evidence.json"

      - name: Check dispatcher outbox inside the canary window
        if: github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready && steps.canary_start.outputs.canary_id != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FORECAST_COLLECTOR_STAGING_URL: ${{ vars.FORECAST_COLLECTOR_STAGING_URL }}
        shell: bash
        run: *staging_outbox_readiness

      - name: Send mutation-free Router test card
        if: github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_FORECAST_STAGING_BOT_TOKEN }}
          DISCORD_ACTIVITY_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_ACTIVITY_CHANNEL_ID }}
        run: npm run send:forecast-router-test

      - name: Record shadow start
        run: |
          {
            echo "### Forecast collector staging shadow"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Cron: every 3 minutes"
            echo "- Dispatcher Cron: minute 1, then every 3 minutes"
            if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.router_endpoint_ready }}" == "true" ]]; then
              echo "- Canary: fresh v10 fixed eight-hour window started after live-contract probe and D1 burn-in"
              node scripts/check-workflow-hardening.ts --identity-summary "$RUNNER_TEMP/canary-start-identity.evidence.json"
              echo "- Quota policy: all account Workers and D1 databases included; project automation fails closed at 50%"
              echo "- Required action: click the Router response test card during this canary window"
              echo "- Promotion: blocked until the authenticated v10 certificate and final Paid quota check pass"
            else
              echo "- Dispatcher: remains disabled"
              echo "- Canary: not started"
              echo "- Required action: verify the staging Discord Interaction Endpoint, then dispatch this workflow with router_endpoint_ready=true"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark staging operational verification complete
        id: operational_verification
        run: echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Project privacy-safe staging burn-in and quota evidence
        if: always()
        shell: bash
        run: |
          set -u
          failed=0
          while read -r kind stem; do
            source="$RUNNER_TEMP/$stem.json"
            [[ -f "$source" ]] || continue
            if node scripts/check-workflow-hardening.ts --retain-evidence "$source" "$kind" \
              > "$RUNNER_TEMP/$stem.evidence.pending"; then
              mv "$RUNNER_TEMP/$stem.evidence.pending" "$RUNNER_TEMP/$stem.evidence.json"
            else
              failed=1
            fi
          done <<'EVIDENCE'
          runtime forecast-observability-live-probe
          runtime forecast-observability-preflight
          quota d1-budget-preflight
          baseline d1-budget-baseline
          quota d1-budget-evaluation
          EVIDENCE
          exit "$failed"

      - name: Retain successful staging identity before leaving the stop boundary
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forecast-staging-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/staging-router-identity.evidence.json
            ${{ runner.temp }}/staging-router-health.evidence.json
            ${{ runner.temp }}/*-active-identity.evidence.json
            ${{ runner.temp }}/canary-start-identity.evidence.json
            ${{ runner.temp }}/forecast-observability-live-probe.evidence.json
            ${{ runner.temp }}/forecast-observability-preflight.evidence.json
            ${{ runner.temp }}/forecast-canary-start-runtime.evidence.json
            ${{ runner.temp }}/d1-budget-preflight.evidence.json
            ${{ runner.temp }}/d1-budget-baseline.evidence.json
            ${{ runner.temp }}/d1-budget-evaluation.evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail-closed rollback when staging validation fails - Dispatcher
        if: always() && (failure() || cancelled()) && steps.operational_verification.outputs.verified != 'true' && steps.dispatcher_activation.outputs.attempted == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_FORECAST_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_APPROVAL_CHANNEL_ID }}
          DISCORD_FORECAST_ACTIVITY_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_ACTIVITY_CHANNEL_ID }}
          DISCORD_FORECAST_ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_ALERT_CHANNEL_ID }}
          DISCORD_FORECAST_FALLBACK_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_STAGING_ALERT_CHANNEL_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/dispatcher-validation-stop.ndjson
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --env staging --config forecast-dispatcher/wrangler.toml \
            --secrets-file "$RUNNER_TEMP/forecast-dispatcher-secrets.json" \
            --var ENVIRONMENT:staging --var DEPLOY_SHA:${{ github.sha }} \
            --var DISCORD_CHANNEL_ID:$DISCORD_FORECAST_CHANNEL_ID \
            --var DISCORD_ACTIVITY_CHANNEL_ID:$DISCORD_FORECAST_ACTIVITY_CHANNEL_ID \
            --var DISCORD_ALERT_CHANNEL_ID:$DISCORD_FORECAST_ALERT_CHANNEL_ID \
            --var DISCORD_FALLBACK_CHANNEL_ID:$DISCORD_FORECAST_FALLBACK_CHANNEL_ID \
            --var DISPATCH_ENABLED:false \
            --var FORECAST_V2_NOTIFICATIONS_ENABLED:false \
            --var DISCORD_APPROVAL_CHANNEL_ID:$DISCORD_FORECAST_CHANNEL_ID \
            --tag "${{ github.sha }}-v10-validation-stop" \
            --message "Disable forecast dispatcher after staging validation failure"
          version=$(node scripts/check-workflow-hardening.ts --deployment-version \
            "$WRANGLER_OUTPUT_FILE_PATH" collection-kit-forecast-dispatcher-staging staging)
          npx wrangler deployments status --env staging --config forecast-dispatcher/wrangler.toml \
            --json > "$RUNNER_TEMP/dispatcher-validation-stopped.json"
          test "$(node scripts/check-workflow-hardening.ts --active-version "$RUNNER_TEMP/dispatcher-validation-stopped.json")" = "$version"
          npx wrangler versions view "$version" --env staging --config forecast-dispatcher/wrangler.toml \
            --json > "$RUNNER_TEMP/dispatcher-validation-stop-version.json"
          node scripts/check-workflow-hardening.ts --version-identity "$RUNNER_TEMP/dispatcher-validation-stop-version.json" "$version" \
            > "$RUNNER_TEMP/dispatcher-validation-stop-identity.json"
          jq -e --arg sha "${{ github.sha }}" \
            '.deploymentSha == $sha and .vars.DISPATCH_ENABLED == "false"' \
            "$RUNNER_TEMP/dispatcher-validation-stop-identity.json" >/dev/null
          node scripts/check-workflow-hardening.ts --sanitize-identity \
            "$RUNNER_TEMP/dispatcher-validation-stop-identity.json" > "$RUNNER_TEMP/dispatcher-validation-stop-identity.evidence.json"

      - name: Fail-closed rollback when staging validation fails - Collector
        if: always() && (failure() || cancelled()) && steps.operational_verification.outputs.verified != 'true' && steps.collector_activation.outputs.attempted == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLL_MODE: ${{ inputs.poll_mode || 'both' }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/collector-validation-stop.ndjson
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --env staging --config forecast-collector/wrangler.toml \
            --secrets-file "$RUNNER_TEMP/forecast-secrets.json" \
            --var ENVIRONMENT:staging --var DEPLOY_SHA:${{ github.sha }} --var POLL_MODE:$POLL_MODE \
            --var COLLECT_ENABLED:false \
            --var FORECAST_V2_MODE:on \
            --tag "${{ github.sha }}-$POLL_MODE-v10-validation-stop" \
            --message "Disable forecast collector after staging validation failure"
          version=$(node scripts/check-workflow-hardening.ts --deployment-version \
            "$WRANGLER_OUTPUT_FILE_PATH" collection-kit-forecast-collector-staging staging)
          npx wrangler deployments status --env staging --config forecast-collector/wrangler.toml \
            --json > "$RUNNER_TEMP/collector-validation-stopped.json"
          test "$(node scripts/check-workflow-hardening.ts --active-version "$RUNNER_TEMP/collector-validation-stopped.json")" = "$version"
          npx wrangler versions view "$version" --env staging --config forecast-collector/wrangler.toml \
            --json > "$RUNNER_TEMP/collector-validation-stop-version.json"
          node scripts/check-workflow-hardening.ts --version-identity "$RUNNER_TEMP/collector-validation-stop-version.json" "$version" \
            > "$RUNNER_TEMP/collector-validation-stop-identity.json"
          jq -e --arg sha "${{ github.sha }}" \
            '.deploymentSha == $sha and .vars.COLLECT_ENABLED == "false"' \
            "$RUNNER_TEMP/collector-validation-stop-identity.json" >/dev/null
          node scripts/check-workflow-hardening.ts --sanitize-identity \
            "$RUNNER_TEMP/collector-validation-stop-identity.json" > "$RUNNER_TEMP/collector-validation-stop-identity.evidence.json"

      - name: Retain staging identity and canary start evidence
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forecast-staging-stop-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/staging-router-identity.evidence.json
            ${{ runner.temp }}/staging-router-health.evidence.json
            ${{ runner.temp }}/*-active-identity.evidence.json
            ${{ runner.temp }}/*-validation-stop-identity.evidence.json
            ${{ runner.temp }}/canary-start-identity.evidence.json
            ${{ runner.temp }}/forecast-observability-live-probe.evidence.json
            ${{ runner.temp }}/forecast-observability-preflight.evidence.json
            ${{ runner.temp }}/forecast-canary-start-runtime.evidence.json
            ${{ runner.temp }}/d1-budget-preflight.evidence.json
            ${{ runner.temp }}/d1-budget-baseline.evidence.json
            ${{ runner.temp }}/d1-budget-evaluation.evidence.json
          if-no-files-found: warn
          retention-days: 30

  # Account-wide production safety must not depend on FORECAST_STAGING_AUTO_REDEPLOY.
  deploy-usage-guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Guard deployment revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Verify Guard checkout identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Guard Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm

      - name: Validate Guard configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_D1_ANALYTICS_TOKEN }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
          CLOUDFLARE_USAGE_GUARD_URL: ${{ vars.CLOUDFLARE_USAGE_GUARD_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
          DISCORD_FORECAST_BOT_TOKEN: ${{ secrets.DISCORD_FORECAST_BOT_TOKEN }}
          DISCORD_FORECAST_ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ALERT_CHANNEL_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID variable." >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret." >&2; exit 1; }
          test -n "$CLOUDFLARE_D1_ANALYTICS_TOKEN" || { echo "Missing CLOUDFLARE_D1_ANALYTICS_TOKEN secret." >&2; exit 1; }
          test -n "$CLOUDFLARE_BILLING_READ_TOKEN" || { echo "Missing CLOUDFLARE_BILLING_READ_TOKEN secret." >&2; exit 1; }
          [[ "$CLOUDFLARE_USAGE_GUARD_URL" =~ ^https://[^/]+$ ]] || { echo "Missing or invalid CLOUDFLARE_USAGE_GUARD_URL variable." >&2; exit 1; }
          test -n "$FORECAST_COLLECTOR_ADMIN_TOKEN" || { echo "Missing FORECAST_COLLECTOR_ADMIN_TOKEN secret." >&2; exit 1; }
          test -n "$DISCORD_FORECAST_BOT_TOKEN" || { echo "Missing DISCORD_FORECAST_BOT_TOKEN secret." >&2; exit 1; }
          [[ "$DISCORD_FORECAST_ALERT_CHANNEL_ID" =~ ^[0-9]{6,24}$ ]] || { echo "Missing or invalid DISCORD_FORECAST_ALERT_CHANNEL_ID variable." >&2; exit 1; }

      - name: Prepare Guard npm 12.2.1 with pinned integrity
        shell: bash
        timeout-minutes: 5
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-bootstrap-cache
        run: *prepare_forecast_npm

      - name: Install Guard dependencies
        run: npm ci

      - name: Verify Paid usage guard
        run: |
          npm run usage-guard:types:check
          npx tsc --noEmit -p usage-guard/tsconfig.json
          npm run test:usage-guard
          npx wrangler deploy --dry-run --config usage-guard/wrangler.toml

      - name: Apply usage guard D1 schema
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler d1 execute GUARD_DB --remote
          --config usage-guard/wrangler.toml
          --file usage-guard/schema.sql --yes

      - name: Prepare usage guard secrets
        env:
          CLOUDFLARE_D1_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_D1_ANALYTICS_TOKEN }}
          CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_FORECAST_BOT_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/usage-guard-secrets.json" <<'NODE'
          import { writeFileSync } from "node:fs";
          const names = [
            "CLOUDFLARE_D1_ANALYTICS_TOKEN",
            "CLOUDFLARE_BILLING_READ_TOKEN",
            "DISCORD_BOT_TOKEN",
            "ADMIN_TOKEN",
          ];
          const values = Object.fromEntries(names.map((name) => [name, process.env[name] ?? ""]));
          if (Object.values(values).some((value) => !value)) throw new Error("Usage Guard secrets are incomplete.");
          writeFileSync(process.argv[2], JSON.stringify(values), { mode: 0o600 });
          NODE

      - name: Deploy and initialize Paid usage guard
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_USAGE_GUARD_URL: ${{ vars.CLOUDFLARE_USAGE_GUARD_URL }}
          FORECAST_COLLECTOR_ADMIN_TOKEN: ${{ secrets.FORECAST_COLLECTOR_ADMIN_TOKEN }}
          DISCORD_FORECAST_ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ALERT_CHANNEL_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config usage-guard/wrangler.toml \
            --secrets-file "$RUNNER_TEMP/usage-guard-secrets.json" \
            --var DEPLOY_SHA:${{ github.sha }} \
            --var DISCORD_ALERT_CHANNEL_ID:$DISCORD_FORECAST_ALERT_CHANNEL_ID \
            --tag "${{ github.sha }}" --message "Paid quota guard ${{ github.sha }}"
          ready=false
          for attempt in {1..12}; do
            health_status=$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
              --output "$RUNNER_TEMP/usage-guard-readiness.json" --write-out "%{http_code}" \
              "$CLOUDFLARE_USAGE_GUARD_URL/health" || true)
            if [[ "$health_status" == "200" ]] && \
              jq -e --arg sha "${{ github.sha }}" '.deploymentSha == $sha' \
                "$RUNNER_TEMP/usage-guard-readiness.json" >/dev/null 2>&1; then
              ready=true
              break
            fi
            if (( attempt < 12 )); then sleep 5; fi
          done
          [[ "$ready" == "true" ]] || {
            echo "Usage Guard endpoint did not expose deployment ${{ github.sha }} within 60 seconds." >&2
            exit 1
          }
          status=$(curl --silent --show-error --connect-timeout 5 --max-time 30 \
            --output "$RUNNER_TEMP/usage-guard-refresh.json" --write-out "%{http_code}" \
            -X POST -H "Authorization: Bearer $FORECAST_COLLECTOR_ADMIN_TOKEN" \
            "$CLOUDFLARE_USAGE_GUARD_URL/admin/refresh")
          [[ "$status" == "200" ]] || { echo "Usage Guard refresh returned HTTP $status." >&2; exit 1; }
          jq -e '.ok == true and .state.action == "normal"' "$RUNNER_TEMP/usage-guard-refresh.json" >/dev/null

name: Bootstrap Production Forecast Router Disabled

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Reviewed full lowercase commit SHA in the dispatched main history
        required: true
        type: string
      confirm_router_only:
        description: Deploy only the production Router with production mutations disabled
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: forecast-collector-production
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_router_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and select the approved main snapshot
        env:
          TRUSTED_SHA: ${{ github.sha }}
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ && "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TRUSTED_SHA"
          git cat-file -e "$DEPLOY_SHA^{commit}"
          git merge-base --is-ancestor "$DEPLOY_SHA" "$TRUSTED_SHA"
          git checkout --detach "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Prepare npm 12.2.0 with pinned integrity
        shell: bash
        timeout-minutes: 5
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-bootstrap-cache
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { existsSync, mkdtempSync, writeFileSync, appendFileSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { setTimeout as delay } from 'node:timers/promises';
          const version = '12.2.0';
          const url = 'https://registry.npmjs.org/npm/-/npm-12.2.0.tgz';
          const sri = 'sha512-ZsJjKpTnlmSXOLLXiU1xDCzC4Wlok4IwZmh/aw2KUuXytU7q6qMv/cUT7MoeSf95Slwuw/lRXYefGzGCspHPNQ==';
          if (process.version !== 'v24.21.0') throw new Error('Unexpected Node version');
          if (!process.env.RUNNER_TEMP || !process.env.GITHUB_PATH || !process.env.NPM_CONFIG_CACHE) throw new Error('Missing runner paths');
          const nodeDir = dirname(process.execPath);
          const sourceCli = [join(nodeDir, 'node_modules/npm/bin/npm-cli.js'), resolve(nodeDir, '../lib/node_modules/npm/bin/npm-cli.js')].find(existsSync);
          if (!sourceCli) throw new Error('Bundled npm CLI not found');
          const cleanEnv = Object.fromEntries(['PATH', 'HOME', 'USERPROFILE', 'SYSTEMROOT', 'WINDIR', 'COMSPEC', 'PATHEXT', 'TEMP', 'TMP', 'TMPDIR', 'APPDATA', 'LOCALAPPDATA'].filter(k => process.env[k] !== undefined).map(k => [k, process.env[k]]));
          const root = mkdtempSync(join(process.env.RUNNER_TEMP, 'npm-12.2.0-'));
          const prefix = join(root, 'prefix');
          const userConfig = join(root, 'user.npmrc');
          const globalConfig = join(root, 'global.npmrc');
          writeFileSync(userConfig, '', { flag: 'wx' });
          writeFileSync(globalConfig, '', { flag: 'wx' });
          const cacheKey = `npm-${version}-${process.platform}-${process.arch}-${Buffer.from(sri.slice(7), 'base64').toString('hex')}`;
          const cache = join(process.env.NPM_CONFIG_CACHE, cacheKey);
          let bytes;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(30000) });
              if (!response.ok) {
                const error = new Error(`npm tarball HTTP ${response.status}`);
                error.terminal = response.status < 500 && response.status !== 408 && response.status !== 429;
                throw error;
              }
              const chunks = []; let size = 0;
              for await (const chunk of response.body) {
                size += chunk.length;
                if (size > 8 * 1024 * 1024) throw Object.assign(new Error('npm tarball size limit exceeded'), { terminal: true });
                chunks.push(chunk);
              }
              bytes = Buffer.concat(chunks); break;
            } catch (error) {
              if (error.terminal || attempt === 2) throw error;
              await delay(1000 * (attempt + 1));
            }
          }
          if ('sha512-' + createHash('sha512').update(bytes).digest('base64') !== sri) throw new Error('npm tarball integrity mismatch');
          const tgz = join(root, 'npm-12.2.0.tgz');
          writeFileSync(tgz, bytes, { flag: 'wx' });
          const options = { cwd: root, env: cleanEnv, timeout: 120000 };
          execFileSync(process.execPath, [sourceCli, 'install', '--global', '--prefix', prefix, tgz, '--offline', '--ignore-scripts', '--no-audit', '--no-fund', '--no-update-notifier', '--cache', cache, '--userconfig', userConfig, '--globalconfig', globalConfig], { ...options, stdio: 'inherit' });
          const windows = process.platform === 'win32';
          const targetCli = join(prefix, windows ? 'node_modules' : 'lib/node_modules', 'npm/bin/npm-cli.js');
          if (execFileSync(process.execPath, [targetCli, '--version', '--no-update-notifier', '--userconfig', userConfig, '--globalconfig', globalConfig], options).toString().trim() !== version) throw new Error('Installed npm version mismatch');
          appendFileSync(process.env.GITHUB_PATH, (windows ? prefix : join(prefix, 'bin')) + '\n');
          console.log(`Prepared npm ${version}; platform=${process.platform}; integrity verified`);
          NODE

      - name: Install dependencies without deployment credentials
        run: npm ci

      - name: Validate Router configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          FORECAST_INTERACTIONS_URL: ${{ vars.FORECAST_INTERACTIONS_URL }}
          DISCORD_FORECAST_APPLICATION_ID: ${{ vars.DISCORD_FORECAST_APPLICATION_ID }}
          DISCORD_FORECAST_PUBLIC_KEY: ${{ vars.DISCORD_FORECAST_PUBLIC_KEY }}
          DISCORD_FORECAST_GUILD_ID: ${{ vars.DISCORD_FORECAST_GUILD_ID }}
          DISCORD_FORECAST_APPROVER_USER_ID: ${{ vars.DISCORD_FORECAST_APPROVER_USER_ID }}
          DISCORD_FORECAST_APPROVAL_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_APPROVAL_CHANNEL_ID }}
          DISCORD_FORECAST_ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ALERT_CHANNEL_ID }}
          DISCORD_FORECAST_ACTIVITY_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ACTIVITY_CHANNEL_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/check-workflow-hardening.ts --router-origin "$FORECAST_INTERACTIONS_URL"
          for name in DISCORD_FORECAST_APPLICATION_ID DISCORD_FORECAST_GUILD_ID DISCORD_FORECAST_APPROVER_USER_ID DISCORD_FORECAST_APPROVAL_CHANNEL_ID DISCORD_FORECAST_ALERT_CHANNEL_ID DISCORD_FORECAST_ACTIVITY_CHANNEL_ID; do
            [[ "${!name}" =~ ^[0-9]{6,24}$ ]]
          done
          [[ "$DISCORD_FORECAST_PUBLIC_KEY" =~ ^[0-9a-fA-F]{64}$ ]]

      - name: Capture restorepoint and deploy disabled Router
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          DISCORD_FORECAST_APPLICATION_ID: ${{ vars.DISCORD_FORECAST_APPLICATION_ID }}
          DISCORD_FORECAST_PUBLIC_KEY: ${{ vars.DISCORD_FORECAST_PUBLIC_KEY }}
          DISCORD_FORECAST_GUILD_ID: ${{ vars.DISCORD_FORECAST_GUILD_ID }}
          DISCORD_FORECAST_APPROVER_USER_ID: ${{ vars.DISCORD_FORECAST_APPROVER_USER_ID }}
          DISCORD_FORECAST_APPROVAL_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_APPROVAL_CHANNEL_ID }}
          DISCORD_FORECAST_ALERT_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ALERT_CHANNEL_ID }}
          DISCORD_FORECAST_ACTIVITY_CHANNEL_ID: ${{ vars.DISCORD_FORECAST_ACTIVITY_CHANNEL_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/bootstrap-router-deploy.ndjson
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deployments status --env="" --config forecast-interactions/wrangler.toml \
            --json > "$RUNNER_TEMP/router-before.json"
          previous=$(node scripts/check-workflow-hardening.ts --active-version "$RUNNER_TEMP/router-before.json")
          npx wrangler versions view "$previous" --env="" --config forecast-interactions/wrangler.toml \
            --json > "$RUNNER_TEMP/router-version-before.json"
          node scripts/check-workflow-hardening.ts --version-identity \
            "$RUNNER_TEMP/router-version-before.json" "$previous" > "$RUNNER_TEMP/router-identity-before.json"
          # Never downgrade production, even if its tag and control flag disagree.
          jq -e '(.tag | endswith("-production-enabled") | not) and
            .vars.PRODUCTION_MUTATIONS_ENABLED == "false" and
            (.tag == (.deploymentSha + "-staging") or .tag == (.deploymentSha + "-production-disabled"))' \
            "$RUNNER_TEMP/router-identity-before.json" >/dev/null
          node scripts/check-workflow-hardening.ts --sanitize-identity \
            "$RUNNER_TEMP/router-identity-before.json" > "$RUNNER_TEMP/router-before.evidence.json"
          echo "previous_version=$previous" >> "$GITHUB_OUTPUT"
          jq -r '"Router restorepoint: version=\(.versionId), tag=\(.tag), productionMutationsEnabled=\(.vars.PRODUCTION_MUTATIONS_ENABLED)"' \
            "$RUNNER_TEMP/router-identity-before.json" >> "$GITHUB_STEP_SUMMARY"
          application_id="$DISCORD_FORECAST_APPLICATION_ID"
          public_key="$DISCORD_FORECAST_PUBLIC_KEY"
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --env="" --config forecast-interactions/wrangler.toml \
            --var DEPLOY_SHA:$DEPLOY_SHA \
            --var DISCORD_APPLICATION_ID:$application_id \
            --var DISCORD_PUBLIC_KEY:$public_key \
            --var DISCORD_GUILD_ID:$DISCORD_FORECAST_GUILD_ID \
            --var DISCORD_APPROVER_USER_ID:$DISCORD_FORECAST_APPROVER_USER_ID \
            --var DISCORD_APPROVAL_CHANNEL_ID:$DISCORD_FORECAST_APPROVAL_CHANNEL_ID \
            --var DISCORD_ALERT_CHANNEL_ID:$DISCORD_FORECAST_ALERT_CHANNEL_ID \
            --var DISCORD_ACTIVITY_CHANNEL_ID:$DISCORD_FORECAST_ACTIVITY_CHANNEL_ID \
            --var PRODUCTION_MUTATIONS_ENABLED:false \
            --tag "$DEPLOY_SHA-production-disabled" \
            --message "Forecast interaction Router production disabled $DEPLOY_SHA"
          version=$(node scripts/check-workflow-hardening.ts --deployment-version \
            "$WRANGLER_OUTPUT_FILE_PATH" collection-kit-forecast-interactions "")
          echo "version_id=$version" >> "$GITHUB_OUTPUT"

      - name: Verify disabled Router identity and health
        id: verify
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          EXPECTED_VERSION: ${{ steps.deploy.outputs.version_id }}
          FORECAST_INTERACTIONS_URL: ${{ vars.FORECAST_INTERACTIONS_URL }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments status --env="" --config forecast-interactions/wrangler.toml \
            --json > "$RUNNER_TEMP/router-after.json"
          version=$(node scripts/check-workflow-hardening.ts --active-version "$RUNNER_TEMP/router-after.json")
          test "$version" = "$EXPECTED_VERSION"
          npx wrangler versions view "$version" --env="" --config forecast-interactions/wrangler.toml \
            --json > "$RUNNER_TEMP/router-version-after.json"
          node scripts/check-workflow-hardening.ts --version-identity \
            "$RUNNER_TEMP/router-version-after.json" "$version" > "$RUNNER_TEMP/router-identity-after.json"
          jq -e --arg sha "$DEPLOY_SHA" \
            '.deploymentSha == $sha and .tag == ($sha + "-production-disabled") and
             .vars.PRODUCTION_MUTATIONS_ENABLED == "false"' "$RUNNER_TEMP/router-identity-after.json" >/dev/null
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 20 \
            "$FORECAST_INTERACTIONS_URL/health" > "$RUNNER_TEMP/router-health.json"
          jq -e --arg sha "$DEPLOY_SHA" --slurpfile identity "$RUNNER_TEMP/router-identity-after.json" \
            '.status == "ok" and .deploymentSha == $sha and .productionMutationsEnabled == false and
             .productionMutationsEnabled == ($identity[0].vars.PRODUCTION_MUTATIONS_ENABLED == "true")' \
            "$RUNNER_TEMP/router-health.json" >/dev/null
          node scripts/check-workflow-hardening.ts --sanitize-identity \
            "$RUNNER_TEMP/router-identity-after.json" > "$RUNNER_TEMP/router-after.evidence.json"
          node scripts/check-workflow-hardening.ts --sanitize-readiness \
            "$RUNNER_TEMP/router-health.json" > "$RUNNER_TEMP/router-health.evidence.json"
          jq -r '"Verified disabled Router: version=\(.versionId), tag=\(.tag)"' \
            "$RUNNER_TEMP/router-identity-after.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore captured Router after failure
        if: always() && (failure() || cancelled()) && steps.deploy.outputs.attempted == 'true' && steps.verify.outcome != 'success'
        id: restore
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIOUS_VERSION: ${{ steps.deploy.outputs.previous_version }}
          FORECAST_INTERACTIONS_URL: ${{ vars.FORECAST_INTERACTIONS_URL }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions deploy "$PREVIOUS_VERSION@100%" --yes --env="" \
            --config forecast-interactions/wrangler.toml --message "Restore Router after forecast bootstrap failure"
          npx wrangler deployments status --env="" --config forecast-interactions/wrangler.toml \
            --json > "$RUNNER_TEMP/router-restored.json"
          test "$(node scripts/check-workflow-hardening.ts --active-version "$RUNNER_TEMP/router-restored.json")" = "$PREVIOUS_VERSION"
          npx wrangler versions view "$PREVIOUS_VERSION" --env="" --config forecast-interactions/wrangler.toml \
            --json > "$RUNNER_TEMP/router-version-restored.json"
          node scripts/check-workflow-hardening.ts --version-identity \
            "$RUNNER_TEMP/router-version-restored.json" "$PREVIOUS_VERSION" > "$RUNNER_TEMP/router-identity-restored.json"
          jq -e --slurpfile prior "$RUNNER_TEMP/router-identity-before.json" \
            '. == $prior[0]' "$RUNNER_TEMP/router-identity-restored.json" >/dev/null
          curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 20 \
            "$FORECAST_INTERACTIONS_URL/health" > "$RUNNER_TEMP/router-restored-health.json"
          jq -e --slurpfile prior "$RUNNER_TEMP/router-identity-before.json" \
            '.status == "ok" and .deploymentSha == $prior[0].deploymentSha and
             .productionMutationsEnabled == false' "$RUNNER_TEMP/router-restored-health.json" >/dev/null
          node scripts/check-workflow-hardening.ts --sanitize-identity \
            "$RUNNER_TEMP/router-identity-restored.json" > "$RUNNER_TEMP/router-restored.evidence.json"
          jq -r '"Restored Router without relabelling: version=\(.versionId), tag=\(.tag)"' \
            "$RUNNER_TEMP/router-identity-restored.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain Router bootstrap evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forecast-router-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/router-*.evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail after attempted restoration
        if: always() && (failure() || cancelled())
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
        run: |
          echo "Router bootstrap failed; restore outcome: $RESTORE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          exit 1

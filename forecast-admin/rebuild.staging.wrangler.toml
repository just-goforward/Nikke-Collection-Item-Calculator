name = "collection-kit-forecast-admin-v2-staging"
main = "src/worker.ts"
compatibility_date = "2026-08-22"
upload_source_maps = false
workers_dev = false
preview_urls = false
routes = []

[limits]
cpu_ms = 50
[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1.0
[triggers]
crons = []
[[d1_databases]]
binding = "FORECAST_DB"
database_name = "collection-kit-forecast-collector-staging"
database_id = "49b5dc06-37ae-4245-896c-daea98562ed8"
[[d1_databases]]
binding = "USAGE_GUARD_DB"
database_name = "collection-kit-usage-guard"
database_id = "49b7f966-f4e8-4c2d-8453-279415737054"
[[ratelimits]]
name = "ADMIN_IP_RATE_LIMITER"
namespace_id = "419108"
simple = { limit = 30, period = 60 }
[[ratelimits]]
name = "ADMIN_IDENTITY_RATE_LIMITER"
namespace_id = "419109"
simple = { limit = 20, period = 60 }
[vars]
ACCESS_TEAM_DOMAIN = "unset"
ACCESS_AUD = "unset"
ADMIN_ALLOWED_EMAILS = "unset"
DISCORD_GUILD_ID = "1542497533417496619"

name = "collection-kit-forecast-interactions-staging"
main = "src/worker.ts"
compatibility_date = "2026-08-22"
upload_source_maps = false
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[limits]
cpu_ms = 10

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 0.25

[[d1_databases]]
binding = "STAGING_FORECAST_DB"
database_name = "collection-kit-forecast-collector-staging"
database_id = "49b5dc06-37ae-4245-896c-daea98562ed8"

[[d1_databases]]
binding = "USAGE_GUARD_DB"
database_name = "collection-kit-usage-guard"
database_id = "49b7f966-f4e8-4c2d-8453-279415737054"

[vars]
DEPLOY_SHA = "local"
DISCORD_PUBLIC_KEY = "ac93bf021478a9bb6f2c610f7b5402610633007d4728d449a5b109bcdbefb3ae"
DISCORD_APPLICATION_ID = "1542496100525805668"
DISCORD_GUILD_ID = "1542497533417496619"
DISCORD_FORECAST_APPROVER_USER_ID = "1539627186212839517"
DISCORD_APPROVAL_CHANNEL_ID = "1542497534373662802"
DISCORD_ALERT_CHANNEL_ID = "1542497534373662802"
DISCORD_ACTIVITY_CHANNEL_ID = "1542497534373662802"
PRODUCTION_MUTATIONS_ENABLED = "false"
STAGING_PUBLICATION_MODE = "off"
PRODUCTION_PUBLICATION_MODE = "off"
FORECAST_PUBLICATION_KEY_ID = "staging-v1"


name = "collection-kit-forecast-interactions-v2"
main = "src/worker.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = false
workers_dev = false
preview_urls = false
routes = []

[limits]
cpu_ms = 10
[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 0.25
[triggers]
crons = []
[[d1_databases]]
binding = "STAGING_FORECAST_DB"
database_name = "collection-kit-forecast-collector-staging"
database_id = "49b5dc06-37ae-4245-896c-daea98562ed8"
[[d1_databases]]
binding = "USAGE_GUARD_DB"
database_name = "collection-kit-usage-guard"
database_id = "49b7f966-f4e8-4c2d-8453-279415737054"
[vars]
FORECAST_ENVIRONMENT = "staging"
DEPLOY_SHA = "local"
# No verified public key is present in the source configuration.
DISCORD_PUBLIC_KEY = "unset"
DISCORD_APPLICATION_ID = "1561374944062087470"
DISCORD_GUILD_ID = "unset"
DISCORD_FORECAST_APPROVER_USER_ID = "unset"
DISCORD_APPROVAL_CHANNEL_ID = "1561375802027810957"
DISCORD_ALERT_CHANNEL_ID = "unset"
DISCORD_ACTIVITY_CHANNEL_ID = "1561375968441143306"
PRODUCTION_MUTATIONS_ENABLED = "false"
STAGING_PUBLICATION_MODE = "off"
PRODUCTION_PUBLICATION_MODE = "off"
FORECAST_PUBLICATION_KEY_ID = "unset"
# FORECAST_PUBLICATION_SIGNING_KEY is needed only for approved publication activation.

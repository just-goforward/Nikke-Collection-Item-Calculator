name = "collection-kit-stats-v2-production"
main = "src/worker.ts"
compatibility_date = "2026-08-09"
workers_dev = false
preview_urls = false
routes = []
upload_source_maps = false

[cache]
enabled = true
[limits]
cpu_ms = 10
[observability.logs]
enabled = false
invocation_logs = false
[triggers]
crons = []
[[d1_databases]]
binding = "DB"
database_name = "collection-kit-stats"
database_id = "3e18385a-af83-4c67-83a0-ab889149692c"
[[d1_databases]]
binding = "USAGE_GUARD_DB"
database_name = "collection-kit-usage-guard"
database_id = "49b7f966-f4e8-4c2d-8453-279415737054"
[[ratelimits]]
name = "EVENT_RATE_LIMITER"
namespace_id = "419101"
simple = { limit = 120, period = 60 }
[[ratelimits]]
name = "READ_RATE_LIMITER"
namespace_id = "419103"
simple = { limit = 120, period = 60 }
[vars]
ALLOWED_ORIGINS = "https://nikkecollection.com"
TURNSTILE_ALLOWED_HOSTNAMES = "nikkecollection.com,www.nikkecollection.com"
DEPLOYMENT_SHA = "local"
[secrets]
required = ["TURNSTILE_SECRET_KEY"]
